<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ほったらかし釣り堀</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Bebas+Neue&display=swap">
<style>
:root { --bg: #0e1622; --panel: #152234; --panel2: #1d2e45; --ink: #f2f5f8; --muted: #8aa0b8; --line: #2a3e58; --gold: #ffd040; --pink: #ff5fb8; --green: #4ad66a; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; overflow: hidden; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
button, a, [role=button] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
.num { font-family: "Bebas Neue", "Noto Sans JP", sans-serif; letter-spacing: .02em; }

#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
/* ---- 上のバー ---- */
#hud { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto auto; align-items: center; gap: 10px; padding: calc(6px + env(safe-area-inset-top, 0px)) 12px 6px; background: linear-gradient(#0b121c, #0e1622); border-bottom: 1px solid var(--line); z-index: 5; }
#hud a.home { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--panel2); color: var(--ink); text-decoration: none; font-weight: 900; font-size: 1.1rem; }
.money { min-width: 0; line-height: 1; }
.money .c { font-size: 1.9rem; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.money .ps { font-size: .74rem; color: var(--muted); font-weight: 700; white-space: nowrap; }
.chip { display: flex; align-items: center; gap: 4px; background: var(--panel2); border-radius: 999px; padding: 4px 10px 4px 6px; font-weight: 900; font-size: .86rem; white-space: nowrap; }
.chip i { font-style: normal; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: .72rem; }
.chip.pearl i { background: radial-gradient(circle at 35% 35%, #fff, #b8d8ff 60%, #7aa0d0); }
.chip.luck i { background: var(--green); color: #0b2a14; }
#mute { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--panel2); font-size: 1rem; }

/* ---- 池 ---- */
#stage { position: relative; min-height: 0; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#bar { position: absolute; left: 10px; right: 10px; top: 8px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; z-index: 2; }
.pond-nm { background: rgba(0,0,0,.45); border-radius: 8px; padding: 4px 10px; font-weight: 900; font-size: .85rem; }
.buff { background: rgba(0,0,0,.45); border-radius: 8px; padding: 4px 8px; font-weight: 900; font-size: .78rem; }
.buff.fever { background: var(--pink); color: #fff; animation: pulse .6s infinite alternate; }
.buff.luck { color: #8affa0; } .buff.value { color: var(--gold); } .buff.omi { color: #ffb0d8; }
@keyframes pulse { to { filter: brightness(1.3); transform: scale(1.04); } }
#prog { position: absolute; left: 10px; right: 10px; bottom: 8px; height: 22px; background: rgba(0,0,0,.45); border-radius: 999px; overflow: hidden; z-index: 2; pointer-events: none; }
#prog b { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #3da0ff, #4ad66a); border-radius: 999px; transition: width .3s; }
#prog span { position: relative; display: block; text-align: center; font-size: .74rem; font-weight: 900; line-height: 22px; text-shadow: 0 1px 2px #000; }
#prog.ready b { background: linear-gradient(90deg, #ffb020, #ff5fb8); animation: pulse .5s infinite alternate; }
#chestBtn { position: absolute; right: 10px; bottom: 40px; z-index: 3; border: 0; border-radius: 14px; padding: 8px 12px; background: linear-gradient(#ffd040, #e89a10); color: #3a2200; font-weight: 900; font-size: .9rem; box-shadow: 0 4px 0 #a05a00, 0 8px 18px rgba(0,0,0,.4); animation: bounce .8s infinite; }
@keyframes bounce { 50% { transform: translateY(-5px); } }
#hint { position: absolute; left: 50%; top: 44px; transform: translateX(-50%); background: rgba(5,12,24,.78); padding: 9px 14px; border-radius: 12px; font-weight: 700; font-size: .8rem; text-align: center; line-height: 1.6; z-index: 3; pointer-events: none; width: min(86%, 340px); }
#feverBan { position: absolute; left: 0; right: 0; top: 36%; text-align: center; font-family: "Bebas Neue", "Noto Sans JP"; font-size: 3.2rem; color: #fff; text-shadow: 0 0 18px var(--pink), 0 3px 0 #a0206a; pointer-events: none; z-index: 3; animation: ban 1.8s forwards; }
@keyframes ban { 0% { transform: scale(.4); opacity: 0; } 15% { transform: scale(1.15); opacity: 1; } 70% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.1); opacity: 0; } }

/* ---- 下のパネル ---- */
#panel { position: relative; z-index: 6; background: var(--panel); border-top: 1px solid var(--line); }
#tabs { display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); }
#tabs button { position: relative; border: 0; background: none; padding: 7px 2px 8px; display: grid; justify-items: center; gap: 1px; font-weight: 900; font-size: .72rem; color: var(--muted); }
#tabs button b { font-size: 1.3rem; line-height: 1.2; font-weight: 400; }
#tabs button.on { color: var(--ink); background: var(--panel2); }
#tabs button .dot { position: absolute; top: 5px; right: calc(50% - 20px); width: 9px; height: 9px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 0 2px var(--panel); }
#sheet { position: absolute; left: 0; right: 0; bottom: 100%; max-height: min(58vh, 520px); overflow-y: auto; background: var(--panel); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.45); padding: 6px 14px 16px; overscroll-behavior: contain; }
#sheet .grab { display: flex; justify-content: space-between; align-items: center; position: sticky; top: -6px; background: var(--panel); padding: 8px 0 8px; z-index: 2; }
#sheet h2 { margin: 0; font-size: 1.05rem; font-weight: 900; }
#sheet .x { border: 0; background: var(--panel2); border-radius: 8px; width: 34px; height: 34px; font-weight: 900; }

.row { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--panel2); border-radius: 12px; padding: 9px 10px; margin-bottom: 8px; }
.row .ic { width: 46px; height: 46px; border-radius: 10px; display: grid; place-items: center; font-size: 1.5rem; background: #0e1a2a; }
.row .t { font-weight: 900; font-size: .92rem; }
.row .t small { color: var(--muted); font-weight: 700; margin-left: 4px; }
.row .d { color: var(--muted); font-size: .74rem; font-weight: 700; line-height: 1.4; }
.row .d em { color: #8affa0; font-style: normal; }
.buy { border: 0; border-radius: 10px; padding: 8px 10px; min-width: 88px; background: linear-gradient(#ffd040, #e8a020); color: #3a2200; font-weight: 900; line-height: 1.1; box-shadow: 0 3px 0 #9a5a00; }
.buy small, .buy * { pointer-events: none; }
.buy small { display: block; font-size: .64rem; font-weight: 700; }
.buy:disabled { background: #34465e; color: #7a8ca4; box-shadow: 0 3px 0 #22303f; cursor: default; }
.buy.max { background: #2a4a3a; color: #8affa0; box-shadow: none; }
.big { width: 100%; border: 0; border-radius: 12px; padding: 13px; font-weight: 900; font-size: 1.02rem; background: linear-gradient(#ff7ac8, #e0409a); color: #fff; box-shadow: 0 4px 0 #8a1a5a; margin: 6px 0; }
.big:disabled { background: #34465e; color: #7a8ca4; box-shadow: 0 4px 0 #22303f; }
.big.gold { background: linear-gradient(#ffd040, #e8a020); color: #3a2200; box-shadow: 0 4px 0 #9a5a00; }
.big.ghost { background: var(--panel2); color: var(--ink); box-shadow: none; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.note { color: var(--muted); font-size: .76rem; font-weight: 700; line-height: 1.6; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.stats div { background: var(--panel2); border-radius: 10px; padding: 7px 4px; text-align: center; font-size: .68rem; color: var(--muted); font-weight: 700; }
.stats b { display: block; color: var(--ink); font-size: 1.05rem; }
.odds { width: 100%; border-collapse: collapse; font-size: .78rem; margin-top: 6px; }
.odds td { padding: 5px 4px; border-bottom: 1px solid var(--line); font-weight: 700; }
.odds td:last-child { text-align: right; color: var(--muted); }

.zk-head { display: flex; justify-content: space-between; align-items: baseline; margin: 10px 0 6px; font-weight: 900; font-size: .9rem; }
.zk-head small { color: var(--muted); }
.zk { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.zk button { border: 0; background: var(--panel2); border-radius: 10px; padding: 4px 2px 6px; display: grid; justify-items: center; gap: 1px; border-bottom: 3px solid var(--rc, #333); }
.zk img { width: 84px; height: 56px; }
.zk span { font-size: .66rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.zk .no span { color: #5a6a80; }

.pondrow { border-radius: 12px; padding: 12px; margin-bottom: 8px; position: relative; overflow: hidden; }
.pondrow .t { font-weight: 900; font-size: 1rem; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.pondrow .d { font-size: .76rem; font-weight: 700; margin-top: 2px; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
.pondrow .tag { position: absolute; right: 10px; top: 10px; font-size: .7rem; font-weight: 900; background: rgba(0,0,0,.5); padding: 3px 8px; border-radius: 999px; }
.pondrow.lock { filter: grayscale(.8) brightness(.55); }

.omi { text-align: center; padding: 6px 0; }
.omi .box { width: 110px; height: 150px; margin: 6px auto; border-radius: 12px; background: linear-gradient(#e83a3a, #a01a1a); display: grid; place-items: center; box-shadow: inset 0 0 0 5px #ffd040, 0 6px 16px rgba(0,0,0,.4); font-weight: 900; font-size: 1.15rem; writing-mode: vertical-rl; color: #fff; letter-spacing: .3em; }
.omi .box.shake { animation: shake .12s 8 alternate; }
@keyframes shake { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
.omi .res { font-size: 3rem; font-weight: 900; margin: 4px 0; }
.omi .msg { font-weight: 700; }

/* ---- 小窓 ---- */
.modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(3,8,16,.72); padding: 16px; }
.card { width: min(100%, 360px); max-height: calc(100dvh - 32px); overflow-y: auto; background: var(--panel); border-radius: 18px; padding: 18px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.6); border: 2px solid var(--line); animation: popin .25s; }
@keyframes popin { from { transform: scale(.7); opacity: 0; } }
.card h3 { margin: 0 0 6px; font-size: 1.2rem; font-weight: 900; }
.card p { margin: 6px 0; font-weight: 700; font-size: .9rem; line-height: 1.6; }
.card .rar { display: inline-block; padding: 3px 12px; border-radius: 999px; font-weight: 900; font-size: .8rem; color: #111; }
.card canvas.fishbig { width: 240px; height: 160px; display: block; margin: 4px auto; }
.card.glow { border-color: var(--rc); box-shadow: 0 0 0 3px var(--rc), 0 0 50px var(--rc); }
#wheelCv { width: min(260px, 46vh); height: min(260px, 46vh); display: block; margin: 8px auto; }
@media (max-height: 560px) { .card { padding: 12px; } .card h3 { font-size: 1.05rem; } .card .big { padding: 9px; margin: 3px 0; } .card canvas.fishbig { width: 180px; height: 120px; } #wres { margin: 2px 0; } }
.wheelwrap { position: relative; }
.wheelwrap::after { content: ""; position: absolute; left: 50%; top: -2px; transform: translateX(-50%); border: 12px solid transparent; border-top: 22px solid #fff; filter: drop-shadow(0 2px 2px #000); }
.gres { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; margin: 8px 0; text-align: left; }
.gres div { background: var(--panel2); border-radius: 10px; padding: 8px; font-size: .78rem; font-weight: 700; border-left: 4px solid var(--rc); }

/* ---- PCと横向き：パネルを右に ---- */
@media (min-width: 900px), (orientation: landscape) and (min-width: 600px) and (max-height: 560px) {
  #app { grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: auto minmax(0, 1fr); }
  #hud { grid-column: 1 / -1; }
  #panel { grid-row: 2; grid-column: 2; border-top: 0; border-left: 1px solid var(--line); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
  #tabs { order: -1; padding-bottom: 0; border-bottom: 1px solid var(--line); }
  #sheet { position: static; max-height: none; border-radius: 0; box-shadow: none; border-top: 0; min-height: 0; }
  #sheet .x { display: none; }
}
@media (orientation: landscape) and (max-height: 560px) {
  #app { grid-template-columns: minmax(0, 1fr) 320px; }
  #hud { padding-top: 4px; padding-bottom: 4px; }
  .money .c { font-size: 1.5rem; }
  #tabs button { padding: 4px 2px 5px; font-size: .64rem; }
  #tabs button b { font-size: 1.05rem; }
  .zk { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 380px) {
  #hud { gap: 6px; padding-left: 8px; padding-right: 8px; }
  .money .c { font-size: 1.55rem; }
  .chip { padding: 3px 7px 3px 4px; font-size: .78rem; }
  .zk img { width: 72px; height: 48px; }
}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <a class="home" href="../index.html" aria-label="ゲーム一覧にもどる">←</a>
    <div class="money"><span class="c num" id="coins">0</span><span class="ps" id="ps">+0 / 秒</span></div>
    <div class="chip pearl" title="真珠"><i></i><span id="pearls">0</span></div>
    <div class="chip luck" title="運（レアな魚の出やすさ）"><i>運</i><span id="luck">0</span></div>
    <button id="mute" aria-label="音のオン・オフ">♪</button>
  </header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="bar"></div>
    <div id="prog"><b></b><span></span></div>
    <button id="chestBtn" hidden>🎁 宝箱 ×<span>1</span></button>
    <div id="hint" hidden>ほうっておいても、ねこが釣ってくれます。<br>浮きに <b style="color:#ff6a6a">！</b> が出たらタップで<b style="color:var(--gold)">ナイスキャッチ ×1.5</b></div>
  </main>
  <aside id="panel">
    <section id="sheet" hidden></section>
    <nav id="tabs">
      <button data-tab="up"><b>⬆️</b>強化</button>
      <button data-tab="zukan"><b>📖</b>図鑑</button>
      <button data-tab="gacha"><b>🔮</b>ガチャ</button>
      <button data-tab="omikuji"><b>⛩️</b>おみくじ</button>
      <button data-tab="pond"><b>🗺️</b>池</button>
    </nav>
  </aside>
</div>
<div id="modal" class="modal" hidden></div>

<script src="core.js"></script>
<script>
(function () {
'use strict';
const F = window.Fish;
const SAVE = 'hottarakashi-v1';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------------- 数字 ----------------
function fmt(n) {
  n = Math.floor(n);
  if (n < 1e4) return n.toLocaleString('ja-JP');
  const U = [[1e16, '京'], [1e12, '兆'], [1e8, '億'], [1e4, '万']];
  for (const [u, s] of U) if (n >= u) { const x = n / u; return (x < 10 ? x.toFixed(2) : x < 100 ? x.toFixed(1) : Math.floor(x)) + s; }
}
function fmtT(s) { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}時間${m}分` : m ? `${m}分${s % 60}秒` : `${s}秒`; }

// ---------------- セーブ ----------------
let S;
function load() {
  try { const raw = localStorage.getItem(SAVE); if (raw) { const o = JSON.parse(raw); const base = F.newState(); S = Object.assign(base, o); S.lv = Object.assign(base.lv, o.lv || {}); S.stats = Object.assign(F.newState().stats, o.stats || {}); S.omikuji = o.omikuji || base.omikuji; return; } } catch (e) {}
  S = F.newState();
}
function save() { S.last = Date.now(); try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {} }
load();
S.chestN = S.chestN || 0;
let mute = false; try { mute = localStorage.getItem(SAVE + '-mute') === '1'; } catch (e) {}

// ---------------- 音 ----------------
let AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function tone(f, d = .12, type = 'sine', v = .12, delay = 0) {
  if (mute || !AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02);
}
const SND = {
  bite: () => { tone(1100, .07, 'square', .05); tone(1400, .07, 'square', .05, .07); },
  catch: r => { const i = F.RORDER.indexOf(r); const base = [523, 587, 659, 784, 880, 1047][i]; tone(base, .12, 'triangle', .1); if (i >= 2) tone(base * 1.5, .2, 'triangle', .08, .08); if (i >= 3) { tone(base * 2, .3, 'triangle', .08, .16); tone(base * 2.5, .4, 'sine', .06, .26); } },
  nice: () => tone(1568, .1, 'sine', .08),
  splash: () => tone(180, .08, 'sawtooth', .03),
  buy: () => { tone(660, .06, 'square', .06); tone(990, .1, 'square', .06, .05); },
  fever: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .18, 'triangle', .08, i * .07)),
  tick: () => tone(900, .03, 'square', .03),
  prize: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, .2, 'triangle', .08, i * .08)),
  sad: () => { tone(392, .2, 'triangle', .07); tone(330, .3, 'triangle', .07, .16); },
};
$('#mute').textContent = mute ? '🔇' : '♪';
$('#mute').onclick = () => { mute = !mute; $('#mute').textContent = mute ? '🔇' : '♪'; try { localStorage.setItem(SAVE + '-mute', mute ? '1' : '0'); } catch (e) {} audio(); };
addEventListener('pointerdown', audio, { capture: true });

// =============================================================
//  魚の絵（形ごとに手続きで描く。0,0 が真ん中、右向き、長さ s）
// =============================================================
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255; const f = k < 0 ? 0 : 255, a = Math.abs(k); r = Math.round(r + (f - r) * a); g = Math.round(g + (f - g) * a); b = Math.round(b + (f - b) * a); return `rgb(${r},${g},${b})`; }
function bodyGrad(c, f, rx, ry) { const g = c.createLinearGradient(0, -ry, 0, ry); g.addColorStop(0, shade(f.c1, -.25)); g.addColorStop(.45, f.c1); g.addColorStop(1, shade(f.c1, .55)); return g; }
function rainbow(c, rx) { const g = c.createLinearGradient(-rx, 0, rx, 0); ['#ff5a5a', '#ffb040', '#ffe860', '#5ae07a', '#5ab0ff', '#b07aff'].forEach((col, i) => g.addColorStop(i / 5, col)); return g; }
function eye(c, x, y, r) { c.fillStyle = '#fff'; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); c.fillStyle = '#111'; c.beginPath(); c.arc(x + r * .15, y, r * .6, 0, 7); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(x + r * .35, y - r * .3, r * .22, 0, 7); c.fill(); }
function pattern(c, f, rx, ry, seed) {
  const R = mulberry(seed);
  if (f.pat === 'spots') { c.fillStyle = shade(f.c2, -.1); for (let i = 0; i < 14; i++) { const x = (R() * 2 - 1) * rx * .8, y = (R() * 1.4 - .9) * ry; c.globalAlpha = .75; c.beginPath(); c.arc(x, y, rx * (.04 + R() * .04), 0, 7); c.fill(); } c.globalAlpha = 1; }
  if (f.pat === 'stripes') { c.fillStyle = f.c2; c.globalAlpha = .6; for (let i = -3; i <= 3; i++) { c.beginPath(); c.ellipse(i * rx * .24, 0, rx * .045, ry * 1.1, 0, 0, 7); c.fill(); } c.globalAlpha = 1; }
  if (f.pat === 'rainbow') { c.globalAlpha = .55; c.fillStyle = rainbow(c, rx); c.fillRect(-rx, -ry * .3, rx * 2, ry * .5); c.globalAlpha = 1; }
  if (f.pat === 'shine') { const g = c.createLinearGradient(-rx, -ry, rx * .4, ry); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.45, 'rgba(255,255,255,.75)'); g.addColorStop(.55, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillRect(-rx, -ry, rx * 2, ry * 2); }

function closeSheet() { curTab = null; $('#sheet').hidden = true; document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('on')); }
function head(title) { return `<div class="grab"><h2>${title}</h2><button class="x" aria-label="とじる">✕</button></div>`; }
$('#sheet').addEventListener('click', e => { if (e.target.closest('.x')) closeSheet(); });
let refresh = null;     // 開いているタブの数字だけ更新する関数

const UPIC = { fisher: '🐱', rod: '🎣', bait: '🪱', net: '🥅', master: '🏅' };
function upEffect(k) {
  const lv = S.lv[k];
  const T = Object.assign({}, S, { lv: Object.assign({}, S.lv, { [k]: lv + 1 }) });
  const gain = F.perSec(T) - F.perSec(S);
  let d = '';
  if (k === 'fisher') d = `釣り人 ${F.fishers(S)} → ${F.fishers(T)}匹`;
  if (k === 'rod') d = `かかるまで 約${F.waitMean(S).toFixed(1)}秒 → ${F.waitMean(T).toFixed(1)}秒`;
  if (k === 'bait') d = `運 ${F.luck(S)} → ${F.luck(T)}`;
  if (k === 'net') d = `値段 ×${Math.pow(1.25, lv).toFixed(1)} → ×${Math.pow(1.25, lv + 1).toFixed(1)}`;
  if (k === 'master') d = `ほったらかしで釣り上げ ${Math.round(F.autoRate(S) * 100)}% → ${Math.round(F.autoRate(T) * 100)}%`;
  return { d, gain };
}
const RENDER = {
  up(sh) {
    sh.innerHTML = head('⬆️ 強化') + F.UPS.map(u => `<div class="row" data-k="${u.k}"><div class="ic">${UPIC[u.k]}</div><div><div class="t">${u.nm}<small class="lv"></small></div><div class="d"></div></div><button class="buy" data-buy="${u.k}"></button></div>`).join('')
      + `<p class="note">強化は池を移るとリセットされます（池の値段が上がるので、すぐ取りもどせます）。</p><div class="stats" id="stats"></div><button class="big ghost" id="resetBtn" style="margin-top:14px;font-size:.82rem">データを消して最初から</button>`;
    sh.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => { if (F.buy(S, b.dataset.buy)) { SND.buy(); refresh(); hud(); save(); } });
    sh.querySelector('#resetBtn').onclick = () => confirmModal('データを消しますか？', '図鑑・真珠・お守りもすべて消えます。元にもどせません。', '消す', () => { try { localStorage.removeItem(SAVE); } catch (e) {} location.reload(); });
    refresh = () => {
      F.UPS.forEach(u => {
        const row = sh.querySelector(`.row[data-k="${u.k}"]`), lv = S.lv[u.k], max = lv >= u.max;
        row.querySelector('.lv').textContent = `Lv${lv}${max ? '（MAX）' : ''}`;
        const e = upEffect(u.k);
        { const dd = row.querySelector('.d'), hh = max ? esc(u.desc) : `${esc(e.d)}${e.gain > 0 ? `<br><em>+${e.gain < 100 ? e.gain.toFixed(1) : fmt(e.gain)} / 秒</em>` : ''}`; if (dd.innerHTML !== hh) dd.innerHTML = hh; }
        const b = row.querySelector('.buy');
        if (max) { b.className = 'buy max'; b.disabled = true; if (b.dataset.h !== 'MAX') { b.dataset.h = 'MAX'; b.innerHTML = 'MAX'; } }
        else { const c = F.upCost(u.k, lv, S.pond); b.className = 'buy'; b.disabled = S.coins < c; const h = `買う<small class="num" style="font-size:.9rem">${fmt(c)}</small>`; if (b.dataset.h !== h) { b.dataset.h = h; b.innerHTML = h; } }
      });
      const st = S.stats, zk = Object.keys(S.zukan).length;
      sh.querySelector('#stats').innerHTML = [['釣った数', fmt(st.catches)], ['ナイス', fmt(st.nice)], ['図鑑', zk + '/45'], ['宝箱', st.chests], ['ガチャ', st.gacha], ['遊んだ時間', fmtT(st.playT)]].map(([a, b]) => `<div>${a}<b>${b}</b></div>`).join('');
    };
    refresh();
  },
  zukan(sh) {
    const total = Object.keys(S.zukan).length;
    let h = head(`📖 図鑑 <small style="color:var(--muted)">${total} / 45</small>`);
    F.PONDS.forEach((P, pi) => {
      const fs = F.FISH.filter(f => f.pond === pi), got = fs.filter(f => S.zukan[f.id]).length;
      const reached = pi <= S.pond || got > 0;
      h += `<div class="zk-head"><span>${reached ? esc(P.nm) : '？？？の池'}</span><small>${got} / 9</small></div><div class="zk">`;
      fs.forEach(f => { const z = S.zukan[f.id]; h += `<button data-f="${f.id}" class="${z ? '' : 'no'}" style="--rc:${z ? F.RAR[f.r].c : '#2a3a50'}"><img alt="" src="${fishIcon(f, !!z)}"><span>${z ? esc(f.nm) : '？？？'}</span></button>`; });
      h += '</div>';
    });
    h += `<p class="note">運が高いほど、レアな魚が出やすくなります。<br>出やすさ（今の運 ${F.luck(S)}）：${(() => { const w = F.weights(S), s = w.reduce((a, b) => a + b, 0); return F.RORDER.map((r, i) => `${F.RAR[r].nm} ${(w[i] / s * 100).toFixed(w[i] / s < .01 ? 2 : 1)}%`).join('・'); })()}</p>`;
    sh.innerHTML = h;
    sh.querySelectorAll('[data-f]').forEach(b => b.onclick = () => fishModal(F.FISH[+b.dataset.f]));
    refresh = null;
  },
  gacha(sh) {
    const sum = F.GACHA.reduce((s, x) => s + x.w, 0);
    sh.innerHTML = head('🔮 真珠ガチャ') + `<p class="note">SR以上の魚を釣ると真珠がもらえます。真珠${F.GACHA_COST}こで1回。</p>
      <div class="two"><button class="big" id="g1">1回（${F.GACHA_COST}こ）</button><button class="big" id="g10">10回（${F.GACHA_COST * 10}こ）</button></div>
      <div id="gout"></div>
      <table class="odds">${F.GACHA.map(g => `<tr><td><span style="color:${F.RAR[g.r].c}">●</span> ${esc(g.nm)}</td><td>${(g.w / sum * 100).toFixed(0)}%</td></tr>`).join('')}</table>
      <p class="note">お守り：${S.charm}こ（運+${S.charm}）　帽子：${S.hat}こ（値段+${S.hat * 10}%）</p>`;
    const go = n => {
      const res = []; for (let i = 0; i < n; i++) { const g = F.gacha(S, Math.random); if (!g) break; res.push(g); }
      if (!res.length) return;
      const top = res.reduce((a, g) => F.RORDER.indexOf(g.r) > F.RORDER.indexOf(a.r) ? g : a, res[0]);
      if (F.RORDER.indexOf(top.r) >= 3) SND.prize(); else SND.buy();
      sh.querySelector('#gout').innerHTML = `<div class="gres">${res.map(g => `<div style="--rc:${F.RAR[g.r].c}">${esc(g.nm)}</div>`).join('')}</div>`;
      if (F.RORDER.indexOf(top.r) >= 3) { const r = cv.getBoundingClientRect(); sparkle(W / 2, H / 2, 40, F.RAR[top.r].c); }
      save(); hud(); refresh();
    };
    sh.querySelector('#g1').onclick = () => go(1);
    sh.querySelector('#g10').onclick = () => go(10);
    refresh = () => { sh.querySelector('#g1').disabled = S.pearls < F.GACHA_COST; sh.querySelector('#g10').disabled = S.pearls < F.GACHA_COST * 10; const n = sh.querySelectorAll('.note')[1]; if (n) n.textContent = `お守り：${S.charm}こ（運+${S.charm}）　帽子：${S.hat}こ（値段+${S.hat * 10}%）`; };
    refresh();
  },
  omikuji(sh) {
    const om = F.omikujiNow(S);
    if (!om) {
      sh.innerHTML = head('⛩️ おみくじ') + `<div class="omi"><p class="note">1日1回ひけます。結果は今日いっぱい効きます。</p><div class="box" id="omiBox">おみくじ</div><button class="big gold" id="omiGo">ひく</button></div>`;
      sh.querySelector('#omiGo').onclick = () => {
        const btn = sh.querySelector('#omiGo'); btn.disabled = true;
        sh.querySelector('#omiBox').classList.add('shake'); SND.tick();
        setTimeout(() => { const o = F.drawOmikuji(S, Math.random); if (o) { if (o.k === '凶') SND.sad(); else SND.prize(); save(); } RENDER.omikuji(sh); hud(); }, 1000);
      };
    } else {
      const o = F.OMIKUJI.find(x => x.k === om);
      const col = { '大吉': '#ff4fa0', '中吉': '#ffb020', '吉': '#4ad66a', '小吉': '#3da0ff', '末吉': '#b8c4cc', '凶': '#8a8aa0' }[om];
      sh.innerHTML = head('⛩️ おみくじ') + `<div class="omi"><div class="res" style="color:${col}">${om}</div><p class="msg">${esc(o.msg)}</p>
        <p class="note">今日のごりやく：運 ${o.luck >= 0 ? '+' : ''}${o.luck}${o.value > 1 ? `・値段 ×${o.value}` : ''}${om === '凶' ? '・真珠 +20' : ''}</p><p class="note">また明日ひけます。</p></div>`;
    }
    refresh = null;
  },
  pond(sh) {
    let h = head('🗺️ 池');
    F.PONDS.forEach((P, i) => {
      const cur = i === S.pond, done = i < S.pond, next = i === S.pond + 1, lock = i > S.pond + 1;
      h += `<div class="pondrow ${lock ? 'lock' : ''}" style="background:linear-gradient(160deg, ${P.sky[0]} 0%, ${P.water[0]} 45%, ${P.water[1]} 100%)">
        <div class="t">${lock ? '？？？' : esc(P.nm)}</div>
        <div class="d">魚の値段 ×${fmt(P.mult)}${i > 0 ? `・移るのに ${fmt(P.need)} コイン` : ''}</div>
        <span class="tag">${cur ? 'いまここ' : done ? '通過' : next ? '次の池' : 'まだ'}</span>
        ${next ? `<button class="big gold" id="moveBtn" style="margin-top:10px"></button>` : ''}
      </div>`;
    });
    h += `<p class="note">池を移ると、コインと強化はリセット。そのかわり<b style="color:#8affa0">お守り（ずっと運+1）</b>がもらえて、魚がずっと高く売れます。図鑑・真珠・お守り・帽子は消えません。<br>最後の「星空の池」で ${fmt(F.GOAL)} コイン貯めるとゴール！</p>`;
    sh.innerHTML = h;
    const mb = sh.querySelector('#moveBtn');
    if (mb) mb.onclick = () => { const P = F.PONDS[S.pond + 1]; confirmModal(`「${P.nm}」へ移りますか？`, 'コインと強化はリセットされます。お守り（運+1）がもらえます。', '移る', () => { if (F.movePond(S)) { SND.prize(); save(); layoutScene(); closeModal(); RENDER.pond(sh); hud(); clearDot('pond'); popText(W / 2, H * .45, `ようこそ「${P.nm}」へ！`, '#fff', 1); sparkle(W / 2, H * .45, 40, '#ffd040'); } }); };
    refresh = () => { if (!mb) return; const need = F.PONDS[S.pond + 1].need; mb.disabled = !F.canMove(S); mb.textContent = F.canMove(S) ? 'この池へ移る' : `あと ${fmt(Math.max(0, need - S.coins))} コイン`; };
    refresh();
  },
};

// =============================================================
//  小窓
// =============================================================
const modal = $('#modal');
let modalQueue = [];
function showModal(html, onopen, cls = '') {
  if (!modal.hidden) { modalQueue.push([html, onopen, cls]); return; }
  modal.innerHTML = `<div class="card ${cls}">${html}</div>`; modal.hidden = false;
  if (onopen) onopen(modal.querySelector('.card'));
  hud();
}
function closeModal() { modal.hidden = true; modal.innerHTML = ''; if (modalQueue.length) { const [h, o, c] = modalQueue.shift(); showModal(h, o, c); } }
modal.addEventListener('click', e => { if (e.target === modal && !modal.dataset.lock) closeModal(); if (e.target.closest('[data-close]')) closeModal(); });
function confirmModal(title, msg, ok, fn) {
  showModal(`<h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="two"><button class="big ghost" data-close>やめる</button><button class="big gold" id="okBtn">${esc(ok)}</button></div>`, c => c.querySelector('#okBtn').onclick = () => { const q = modalQueue; modalQueue = []; closeModal(); modalQueue = q; fn(); });
}
function bigFishCanvas(card, f) {
  const c2 = card.querySelector('canvas.fishbig'); c2.width = 480; c2.height = 320;
  const k = c2.getContext('2d'); let t0 = performance.now();
  const draw = () => { if (!c2.isConnected) return; const t = (performance.now() - t0) / 1000; k.clearRect(0, 0, 480, 320); k.save(); k.translate(240, 170 + Math.sin(t * 2) * 6); paintFish(k, f, f.shape === 'kappa' || f.shape === 'jelly' ? 300 : 340, t); k.restore(); requestAnimationFrame(draw); };
  draw();
}
let rareOpen = 0;
function rarePopup(ev) {
  if (rareOpen > 2 || window.__fishQuiet) return;    // 連続で来たら出しすぎない
  rareOpen++;
  const f = ev.fish, R = F.RAR[f.r];
  showModal(`<span class="rar" style="background:${R.c}">${R.nm}</span>${ev.isNew ? ' <span class="rar" style="background:#8affa0">NEW</span>' : ''}
    <canvas class="fishbig"></canvas><h3>${esc(f.nm)}</h3>
    <p>大きさ ${ev.size.toFixed(2)}倍${ev.size >= 1.3 ? '（大物！）' : ''}<br><b style="color:var(--gold)">+${fmt(ev.v)} コイン</b>${ev.pearls ? `　真珠 +${ev.pearls}` : ''}</p>
    <button class="big" data-close>やったね！</button>`, card => {
      card.style.setProperty('--rc', R.c); bigFishCanvas(card, f);
      const auto = setTimeout(() => { if (card.isConnected) closeModal(); }, f.r === 'GOD' || f.r === 'LR' ? 6000 : 3500);
      card.addEventListener('click', () => clearTimeout(auto), { once: true });
      const obs = new MutationObserver(() => { if (!card.isConnected) { rareOpen--; obs.disconnect(); } }); obs.observe(modal, { childList: true });
    }, 'glow');
  if (f.r === 'GOD' || f.r === 'LR') sparkle(W / 2, H / 2, 70, R.c);
}
function fishModal(f) {
  const z = S.zukan[f.id], R = F.RAR[f.r];
  if (!z) { showModal(`<h3>？？？</h3><p>まだ釣っていない魚。<br>${f.pond <= S.pond ? `「${esc(F.PONDS[f.pond].nm)}」にいるらしい。` : '先の池にいるらしい。'}</p><p class="note">レア度：${R.nm}</p><button class="big ghost" data-close>とじる</button>`); return; }
  showModal(`<span class="rar" style="background:${R.c}">${R.nm}</span><canvas class="fishbig"></canvas><h3>${esc(f.nm)}</h3>
    <p>${esc(F.PONDS[f.pond].nm)}の魚<br>釣った数 ${fmt(z.n)}匹・最大 ${z.big.toFixed(2)}倍</p><button class="big ghost" data-close>とじる</button>`, card => { card.style.setProperty('--rc', R.c); bigFishCanvas(card, f); }, 'glow');
}
// ---- 宝箱のルーレット ----
$('#chestBtn').onclick = () => { audio(); wheelModal(); };
const WLABEL = ['💰×20', '真珠5', 'FEVER', '💰×80', '運+10', 'はずれ', '真珠25', '大当り'];
function wheelModal() {
  if (!S.chestN) return;
  showModal(`<h3>🎁 宝箱ルーレット</h3><p class="note">のこり <b id="wn">${S.chestN}</b> 回</p><div class="wheelwrap"><canvas id="wheelCv"></canvas></div><p id="wres" style="min-height:1.6em;font-size:1.05rem"></p>
    <div class="two"><button class="big ghost" data-close>あとで</button><button class="big gold" id="spin">まわす</button></div>`, card => {
      const c2 = card.querySelector('#wheelCv'); c2.width = 520; c2.height = 520;
      const k = c2.getContext('2d'), sum = F.WHEEL.reduce((s, x) => s + x.w, 0);
      let ang = 0, spinning = false;
      const segs = []; let a0 = 0; F.WHEEL.forEach(w => { const a = w.w / sum * Math.PI * 2; segs.push([a0, a0 + a]); a0 += a; });
      const draw = () => {
        k.clearRect(0, 0, 520, 520); k.save(); k.translate(260, 260); k.rotate(ang);
        F.WHEEL.forEach((w, i) => {
          const [s, e] = segs[i]; k.fillStyle = w.c; k.beginPath(); k.moveTo(0, 0); k.arc(0, 0, 240, s - Math.PI / 2, e - Math.PI / 2); k.closePath(); k.fill();
          k.strokeStyle = '#0e1622'; k.lineWidth = 4; k.stroke();
          k.save(); k.rotate((s + e) / 2 - Math.PI / 2); k.fillStyle = w.k === 'none' ? '#fff' : '#1a1a2a'; k.font = `900 ${w.w < 4 ? 17 : w.w < 8 ? 21 : 26}px "Noto Sans JP",sans-serif`; k.textAlign = 'right'; k.textBaseline = 'middle';
          k.fillText(WLABEL[i], 226, 0); k.restore();
        });
        k.fillStyle = '#0e1622'; k.beginPath(); k.arc(0, 0, 36, 0, 7); k.fill(); k.fillStyle = '#ffd040'; k.beginPath(); k.arc(0, 0, 26, 0, 7); k.fill();
        k.restore();
      };
      draw();
      card.querySelector('#spin').onclick = () => {
        if (spinning || !S.chestN) return; spinning = true; modal.dataset.lock = 1;
        card.querySelector('#spin').disabled = true; card.querySelector('[data-close]').disabled = true;
        S.chestN--; card.querySelector('#wn').textContent = S.chestN;
        const idx = F.spinWheel(Math.random), [s, e] = segs[idx];
        const target = -(s + (e - s) * (.2 + Math.random() * .6));
        const start = ang % (Math.PI * 2), end = target - Math.PI * 2 * 6;
        const t0 = performance.now(), D = 3200; let lastTick = 0;
        const anim = () => {
          const p = Math.min(1, (performance.now() - t0) / D), q = 1 - Math.pow(1 - p, 4);
          ang = start + (end - start) * q; draw();
          const tk = Math.floor(-ang / .45); if (tk !== lastTick) { lastTick = tk; SND.tick(); }
          if (p < 1) return requestAnimationFrame(anim);
          const prize = F.WHEEL[idx], v = F.applyPrize(S, prize);
          card.querySelector('#wres').innerHTML = prize.k === 'none' ? 'はずれ…' : prize.k === 'coin' ? `<b style="color:var(--gold)">+${fmt(v)} コイン！</b>` : `<b style="color:${prize.c}">${esc(prize.nm)}！</b>`;
          if (prize.k === 'none') SND.sad(); else SND.prize();
          if (prize.k === 'fever') feverBanner();
          spinning = false; delete modal.dataset.lock; save(); hud();
          card.querySelector('[data-close]').disabled = false; card.querySelector('[data-close]').textContent = 'とじる';
          card.querySelector('#spin').disabled = !S.chestN; card.querySelector('#spin').textContent = S.chestN ? 'もう1回' : 'おしまい';
        };
        anim();
      };
    });
}
function offlineModal(r) {
  const b = r.best;
  showModal(`<h3>おかえりなさい！</h3><p>留守のあいだ（${fmtT(r.secs)}）に<br>ねこたちが <b>${fmt(r.n)}匹</b> 釣りました。</p>
    <p style="font-size:1.4rem"><b style="color:var(--gold)" class="num">+${fmt(r.coins)}</b> コイン${r.pearls ? `<br><span style="font-size:.95rem">真珠 +${fmt(r.pearls)}</span>` : ''}</p>
    ${b ? `<p class="note">いちばんの大物：<span style="color:${F.RAR[b.r].c}">${esc(b.nm)}（${F.RAR[b.r].nm}）</span></p>` : ''}
    <p class="note">留守中はいつもの半分のペース（最大8時間）。</p><button class="big gold" data-close>受け取る</button>`);
}
function clearModal() {
  SND.prize(); sparkle(W / 2, H / 2, 90, '#ffd040');
  showModal(`<h3>🎉 ゴール！</h3><p>星空の池で ${fmt(F.GOAL)} コイン貯めました！<br>遊んだ時間：${fmtT(S.stats.playT)}<br>図鑑：${Object.keys(S.zukan).length} / 45</p><p class="note">このまま釣りを続けて、図鑑を全部うめよう。</p><button class="big gold" data-close>まだまだ釣る</button>`);
}

// =============================================================
//  ループ
// =============================================================
function checkAway() {
  const away = (Date.now() - (S.last || Date.now())) / 1000;
  if (away > 60) { const r = F.offline(S, away); if (r) offlineModal(r); }
  S.last = Date.now();
}
let prev = performance.now(), saveT = 0;
function loop(now) {
  let dt = (now - prev) / 1000; prev = now;
  if (dt > .25) dt = .25;
  run.sync();
  run.step(dt);
  while (run.events.length) handle(run.events.shift());
  frame(S.t, dt);
  S.last = Date.now();
  if (now - lastHudT > 200) { lastHudT = now; hud(); if (refresh && curTab) refresh(); }
  saveT += dt; if (saveT > 5) { saveT = 0; save(); }
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else { checkAway(); prev = performance.now(); } });
addEventListener('pagehide', save);
addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe($('#stage'));

let hintShown = false;
function hideHint() { if (!hintShown) return; hintShown = false; $('#hint').hidden = true; try { localStorage.setItem(SAVE + '-hint', '1'); } catch (e) {} }
resize();
checkAway();
try { if (!localStorage.getItem(SAVE + '-hint')) { hintShown = true; $('#hint').hidden = false; setTimeout(hideHint, 9000); } } catch (e) {}
if (!isMobile()) openTab('up');
requestAnimationFrame(loop);

// テスト用
window.__fish = { get S() { return S; }, run, F, fmt, openTab, closeSheet, tapAt, G: () => G, ff(sec) { for (let i = 0; i < sec * 20; i++) { run.sync(); run.step(.05); while (run.events.length) { const e = run.events.shift(); if (e.k === 'catch' && e.chest) S.chestN++; } } hud(); }, isMobile };
})();
</script>
