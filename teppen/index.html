<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<script src="../perf.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>テッペンキック</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0d1b2a;overflow:hidden;font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Meiryo",sans-serif;touch-action:none}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.78vw);overflow:hidden}
canvas{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;color:#fff}
.ov.show{display:flex}
.panel{background:rgba(255,255,255,.95);color:#123;border-radius:18px;padding:16px;width:100%;max-height:85%;overflow:auto;box-shadow:0 6px 0 rgba(0,0,0,.25)}
h1{font-size:44px;color:#fff;letter-spacing:2px;-webkit-text-stroke:3px #123;paint-order:stroke fill;text-shadow:0 5px 0 #123;transform:rotate(-4deg)}
.sub{font-size:13px;color:#fff;text-shadow:0 2px 0 #123}
.btn{border:none;border-radius:14px;padding:12px 20px;font-size:20px;font-weight:bold;font-family:inherit;cursor:pointer;background:#ffd23f;color:#123;box-shadow:0 5px 0 #b8860b;min-width:200px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b8860b}
.btn.s{font-size:15px;min-width:0;padding:9px 14px;background:#fff;box-shadow:0 4px 0 #8aa}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.big{font-size:40px;font-weight:bold}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:5px;border-bottom:1px solid #dde}
td:last-child{text-align:right;font-weight:bold}
.item{display:flex;justify-content:space-between;align-items:center;padding:7px;border-bottom:1px solid #dde;font-size:14px}
.item button{font-family:inherit;border:none;border-radius:8px;padding:6px 10px;font-weight:bold;background:#ffd23f;cursor:pointer}
.item button.on{background:#7bd389}
.item button:disabled{background:#ccc}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;font-family:inherit;border:none;border-radius:8px;padding:7px;background:#dde;font-weight:bold;cursor:pointer}
.tabs button.on{background:#ffd23f}
.ach{text-align:left;font-size:14px;padding:6px;border-bottom:1px solid #dde}
.ach.no{opacity:.35}
a.home{position:absolute;top:10px;left:12px;color:#fff;font-weight:bold;font-size:14px;text-decoration:none;text-shadow:0 2px 0 #123;background:rgba(18,34,51,.35);padding:5px 10px;border-radius:10px}
#coinsTop{position:absolute;top:10px;right:12px;color:#fff;font-weight:bold;text-shadow:0 2px 0 #123}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>

<div id="title" class="ov show">
  <div class="sub">壁をけって、どこまでも上へ</div>
  <h1>テッペン<br>キック</h1>
  <div class="sub" id="bestT"></div>
  <div style="height:190px"></div>
  <button class="btn" id="bStart">スタート</button>
  <div class="row">
    <button class="btn s" id="bShop">きせかえ</button>
    <button class="btn s" id="bAch">実績</button>

  </div>

</div>

<div id="over" class="ov">
  <div class="panel">
    <div id="oCause" style="font-size:14px;color:#c33;font-weight:bold"></div>
    <div>とうたつ</div>
    <div class="big" id="oH"></div>
    <div id="oArea" style="font-size:14px"></div>
    <div id="oBest" style="margin:6px 0;font-size:14px"></div>
    <div id="oCoin" style="font-size:14px"></div>
    <div id="oSend" style="font-size:12px;color:#678;margin-top:4px"></div>
  </div>
  <button class="btn" id="bRetry">もう1回</button>
  <button class="btn s" id="bBack">タイトルへ</button>
  <a href="../index.html" class="btn s" style="text-decoration:none">ゲーム一覧へ</a>
</div>

<div id="shop" class="ov"><div class="panel">
  <div class="tabs"><button data-t="color" class="on">いろ</button><button data-t="hat">ぼうし</button><button data-t="trail">きせき</button></div>
  <div id="shopList"></div></div>
  <button class="btn s" data-close>もどる</button></div>

<div id="achs" class="ov"><div class="panel"><b>実績</b><div id="achList"></div></div>
  <button class="btn s" data-close>もどる</button></div>


</div>

<script src="../account.js"></script>
<script src="../rank.js"></script>

<script>
(()=>{
// ---------- 基本 ----------
const W=360,H=640,WALL=34,R=11;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let DPR=1;
function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(window.devicePixelRatio||1,2);cv.width=r.width*DPR;cv.height=r.height*DPR;}
addEventListener('resize',resize);
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// 高さ(px) → メートル。上に行くほど1キックで進むmが増える
const toM=h=>h<=0?0:0.1*h*Math.exp(h/30000);
const fmtM=m=>m>=10000?(m/1000).toFixed(1)+'km':Math.floor(m)+'m';

// ---------- セーブ ----------
const SAVE_KEY='teppenkick_save';
let S={best:0,total:0,coins:0,own:{color:['black'],hat:['none'],trail:['none']},eq:{color:'black',hat:'none',trail:'none'},ach:[],snd:true,hist:[]};
try{const d=JSON.parse(localStorage.getItem(SAVE_KEY));if(d)S=Object.assign(S,d);}catch(e){}
const save=()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}};


// ---------- 音 ----------
let AC=null;
function snd(f,d,type='square',v=.08,f2){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,AC.currentTime);if(f2)o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
const SE={kick:()=>snd(220,.12,'square',.07,440),land:()=>snd(140,.06,'triangle',.08),coin:()=>{snd(988,.06,'square',.05);setTimeout(()=>snd(1319,.1,'square',.05),60)},
 die:()=>snd(400,.6,'sawtooth',.08,60),item:()=>{snd(523,.08);setTimeout(()=>snd(784,.15),80)},mile:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>snd(f,.15,'square',.06),i*90))},shield:()=>snd(800,.3,'triangle',.1,200)};

// ---------- エリア（現実の高さ） ----------
const AREAS=[
 {m:0,name:'地上の街',sky:['#8fd3ff','#d8f1ff'],wall:'fence'},
 {m:100,name:'高層ビル街',sky:['#6fc3ff','#cdeeff'],wall:'steel'},
 {m:634,name:'山のふもと',sky:['#5ab4f5','#c4e8ff'],wall:'rock'},
 {m:2000,name:'けわしい崖',sky:['#4aa3ea','#bfe0fb'],wall:'rock'},
 {m:3776,name:'雪山',sky:['#3c8fdc','#b7d8f5'],wall:'snow'},
 {m:8849,name:'氷の世界',sky:['#2c74c4','#a7c8ea'],wall:'ice'},
 {m:10000,name:'雲の上',sky:['#1f5fae','#8fb7e3'],wall:'fence'},
 {m:20000,name:'成層圏',sky:['#123c7a','#4a78b5'],wall:'steel'},
 {m:50000,name:'中間圏',sky:['#0a1d45','#1d3c78'],wall:'steel'},
 {m:100000,name:'宇宙',sky:['#000008','#05102a'],wall:'space'},
];
const MILES=[[333,'東京タワー越え！'],[634,'スカイツリー越え！'],[828,'ブルジュ・ハリファ越え！'],[3776,'富士山越え！'],[8849,'エベレスト越え！'],[10000,'旅客機の高さ！'],[50000,'成層圏突破！'],[100000,'宇宙到達！'],[400000,'宇宙ステーションの高さ！']];
const areaOf=m=>{let a=AREAS[0];for(const x of AREAS)if(m>=x.m)a=x;return a;};
function skyAt(m){let i=0;for(let k=0;k<AREAS.length;k++)if(m>=AREAS[k].m)i=k;const a=AREAS[i],b=AREAS[Math.min(i+1,AREAS.length-1)];const t=b===a?0:clamp((m-a.m)/(b.m-a.m),0,1);return [mix(a.sky[0],b.sky[0],t),mix(a.sky[1],b.sky[1],t)];}
function mix(c1,c2,t){const p=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));const a=p(c1),b=p(c2);return 'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')+')';}

// ---------- きせかえ ----------
const SHOP={
 color:[['black','くろ',0,'#111'],['red','あか',30,'#d62828'],['blue','あお',30,'#1d4ed8'],['green','みどり',30,'#2a9d4a'],['pink','ピンク',60,'#e85d9e'],['white','しろ',100,'#f4f4f4'],['gold','きん',300,'#e0b000'],
  ['orange','オレンジ',40,'#f77f00'],['purple','むらさき',40,'#7b2cbf'],['sky','みずいろ',40,'#3fa7f5'],['brown','ちゃいろ',40,'#7f5539'],
  ['neon','ネオン',150,'#39ff14'],['silver','ぎん',200,'#b8c0c8'],['ghost','ゆうれい',250,'ghost'],['rainbowc','にじいろ',600,'rainbow'],['shadow','かげ',800,'shadow']],
 hat:[['none','なし',0],['cap','キャップ',40],['band','ハチマキ',60],['helm','ヘルメット',120],['crown','おうかん',400],
  ['ribbon','リボン',80],['cat','ネコミミ',100],['oni','おにのツノ',120],['chef','コックぼう',120],['ninja','にんじゃずきん',150],
  ['propeller','プロペラ',200],['wizard','まほうのぼうし',250],['halo','てんしのわ',300],['astro','うちゅうヘルメット',500]],
 trail:[['none','なし',0],['white','しろいせん',50],['fire','ほのお',150],['rainbow','にじ',300],['star','ほし',500],
  ['bubble','あわ',80],['smoke','けむり',100],['heart','ハート',150],['note','おんぷ',150],['sakura','さくら',200],['pixel','ドット',250],['bolt','いなずま',400]]};
const colorOf=id=>{const c=(SHOP.color.find(c=>c[0]===id)||SHOP.color[0])[3];
 if(c==='rainbow')return 'hsl('+((performance.now()/6)%360|0)+',90%,55%)';
 if(c==='ghost')return 'rgba(235,245,255,.75)';
 if(c==='shadow')return '#000';return c;};
const LIGHT=['white','ghost','silver','neon'];

// ---------- ゲーム状態 ----------
let G=null,state='title',last=0,press=false,pressT=0;
function newGame(){
 G={p:{x:WALL+R,y:60,vx:0,vy:0,side:'L',st:'wall',jumps:0,dbl:0,shield:false,pose:0,wallT:0,lastKick:0},
  cam:0,segs:[],blocks:[],lastBlkY:500,inset:{L:0,R:0},gen:{L:-200,R:-200},genY:700,coins:[],items:[],rocks:[],birds:[],parts:[],trail:[],
  maxH:60,coinsGot:0,combo:0,comboT:0,shake:0,mile:0,popup:null,popT:0,wind:0,windT:0,t:0,cause:''};
 // 最初は両側しっかり
 G.segs.push({side:'L',y0:-300,y1:700,type:'n',mat:'fence'},{side:'R',y0:-300,y1:700,type:'n',mat:'fence'});
 G.gen.L=G.gen.R=700;
 G.p.on=G.segs[0];
 while(G.mile<MILES.length&&MILES[G.mile][0]<=0)G.mile++;
}

function diff(){return clamp(G.maxH/70000,0,1);}
const insAt=(s,y)=>{const b=s.inset||0;if(s.ia==null||!s.ramp||y>=s.y0+s.ramp)return b;const t=clamp((y-s.y0)/s.ramp,0,1);return s.ia+(b-s.ia)*t;};
const surf=(s,y)=>{const i=insAt(s,y);return s.side==='L'?WALL+i:W-WALL-i;};
function genWorld(){
 const top=G.cam+H*2;
 // 左右いっしょに「区画」ごとに作る。危ないもの（トゲ・すきま・崩れる壁）は1区画に片側1つだけ、
 // まわりはふつうの壁にして、反対側はいつも安全 → かならずクリアできる道がある
 while(G.genY<top){
  const d=diff(),y=G.genY,am=areaOf(toM(y)).wall;
  const CH=Math.round(rnd(320,440)-d*80);
  const hz=y>1500&&Math.random()<.34+d*.4;
  const hs=Math.random()<.5?'L':'R';
  let kind=null,a=0,len=0;
  if(hz){const r=Math.random();
   if(y>1200&&r<.45){kind='spike';len=rnd(40,60+d*30);}
   else if(y>3500&&r<.6){kind='crumble';len=rnd(110,150);}
   else{kind='gap';len=rnd(60,90+d*30);}
   const amin=Math.max(130,(G.hzEnd||0)+340-y);
   if(amin+len>CH-130)kind=null;else{a=rnd(amin,CH-130-len);G.hzEnd=y+a+len;(G.hzList=G.hzList||[]).push([y+a,y+a+len]);if(G.hzList.length>30)G.hzList.shift();}}
  for(const side of ['L','R']){
   const other=side==='L'?'R':'L',ia=G.inset[side];
   let ins=ia;
   if(y>500&&Math.random()<.6)ins=clamp(ins+[-50,-30,30,50,60][Math.floor(Math.random()*5)],0,90);
   ins=Math.max(0,Math.min(ins,130-G.inset[other]));G.inset[side]=ins;
   const ramp=ins===ia?0:Math.min(110,60+Math.abs(ins-ia)*1.2);
   const nt=()=>{const r=Math.random();if(am==='ice'||am==='snow')return r<.45?'ice':'n';return (y>2500&&r<.12+d*.12)?'ice':'n';};
   const seg=(y0,y1,type,first)=>{if(y1-y0<1)return;G.segs.push({side,y0,y1,type,mat:am,crack:0,inset:ins,ia:first?ia:ins,ramp:first?ramp:0});};
   if(kind&&side===hs){
    seg(y,y+a,nt(),true);
    if(kind!=='gap')seg(y+a,y+a+len,kind,false);
    seg(y+a+len,y+CH,'n',false);
   }else seg(y,y+CH,nt(),true);
  }
  G.genY+=CH;
 }
 // 空中ブロック
 while(G.lastBlkY<G.genY-300){
  G.lastBlkY+=rnd(260,520);
  const y=G.lastBlkY;
  const sl=segAt('L',y),sr=segAt('R',y);
  const lx=sl?surf(sl,y):WALL,rx=sr?surf(sr,y):W-WALL;
  if(rx-lx<220)continue;
  if((G.hzList||[]).some(h=>h[1]>y-260&&h[0]<y+260))continue; // 危ないもの（トゲ・すきま・崩れる壁）の近くには置かない
  const cx=(lx+rx)/2;
  G.blocks.push({blk:true,x:cx+rnd(-1,1)*Math.min(40,(rx-lx-200)/2),y,s:34,type:'n'});
 }
 // コイン・アイテム
 while((G.lastCoinY||200)<top){
  G.lastCoinY=(G.lastCoinY||200)+rnd(110,220);
  const y=G.lastCoinY;
  if(Math.random()<.1)G.items.push({x:W/2+rnd(-60,60),y,kind:Math.random()<.5?'dbl':'shield'});
  else{const n=Math.random()<.4?3:1;for(let i=0;i<n;i++)G.coins.push({x:W/2+rnd(-90,90),y:y+i*26});}
 }
 G.segs=G.segs.filter(s=>s.y1>G.cam-200);G.blocks=G.blocks.filter(b=>b.y>G.cam-100);
 G.coins=G.coins.filter(c=>c.y>G.cam-100);G.items=G.items.filter(c=>c.y>G.cam-100);
}
function segAt(side,y){for(const s of G.segs)if(s.side===side&&y>=s.y0&&y<=s.y1&&!s.gone)return s;return null;}

// ---------- 入力 ----------
const KV=430,KY=800,GRAV=1300;
function down(e){if(e)e.preventDefault();if(state!=='play')return;
 const p=G.p;if(p.st==='wall'){kick();return;}
 if(p.st==='air'&&p.dbl>0){p.dbl--;p.vy=KY*.85;const dir=p.vx>0?-1:p.vx<0?1:(p.x<W/2?1:-1);p.vx=dir*KV;p.side=dir>0?'R':'L';SE.kick();burst(p.x,p.y,'#fff',8);}}
function up(e){}
cv.addEventListener('pointerdown',down);addEventListener('pointerup',up);addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){if(state==='play')down(e);else if(state==='over'){e.preventDefault();start();}}});
addEventListener('keyup',e=>{if(e.code==='Space')up(e);});

function kick(){
 const p=G.p;if(p.st!=='wall')return;
 p.vy=KY;p.vx=p.side==='L'?KV:-KV;p.st='air';p.on=null;
 p.side=p.side==='L'?'R':'L';
 if(G.t-p.lastLand<.35){G.combo++;G.comboT=1.2;}else G.combo=1;
 if(G.combo>=5&&G.combo%5===0){G.coinsGot++;SE.coin();}
 SE.kick();burst(p.x,p.y,'#fff',10);G.shake=3;
}
function attach(o,side,x){const p=G.p;
 if(o.type==='spike'&&!o.blk){ // トゲのはしっこギリギリならセーフ（となりの壁に乗る）
  for(const dy of [-12,12]){const n=segAt(side,p.y+dy);if(n&&n.type!=='spike'){o=n;p.y=dy<0?o.y1-1:o.y0+1;break;}}}
 if(o.type==='spike'&&!p.inv){die('トゲに当たった');return;}
 p.st='wall';p.on=o;p.side=side;p.x=x;p.vx=0;p.lastLand=G.t;p.wallT=0;SE.land();burst(p.x+(side==='L'?-R:R),p.y,'#fff',5);}

// ---------- 更新 ----------
function die(cause){const p=G.p;
 if(p.shield&&cause!=='fall'){p.shield=false;SE.shield();burst(p.x,p.y,'#7df',20);G.shake=8;p.inv=1;
  if(p.st==='wall'){p.vx=p.side==='L'?KV:-KV;p.vy=400;p.st='air';p.on=null;p.side=p.side==='L'?'R':'L';}return;}
 if(p.st==='dead')return;
 p.st='dead';p.vy=420;p.vx=p.vx>0?-120:120;G.cause=cause;G.shake=12;SE.die();burst(p.x,p.y,colorOf(S.eq.color),25);
 setTimeout(gameOver,1100);
}
function update(dt){
 const p=G.p;G.t+=dt;if(press)pressT+=dt;
 if(p.inv)p.inv=Math.max(0,p.inv-dt);
 const m=toM(G.maxH);
 // 風（高いところほど）
 G.windT-=dt;if(G.windT<=0){G.windT=rnd(2,5);G.wind=m>8000?rnd(-1,1)*clamp(m/60000,.3,1)*150:0;}
 if(p.st==='wall'){
  let o=p.on;
  // 壁のつなぎ目ではそのまま下の壁に乗りかえる（すきまでなければ落ちない）
  if(o&&!o.blk&&(o.gone||p.y<o.y0||p.y>o.y1)){const n=segAt(p.side,p.y);if(n&&!o.gone){o=p.on=n;}}
  const ok=o&&(o.blk?(p.y>o.y-o.s/2-R*.6&&p.y<o.y+o.s/2+R):(!o.gone&&p.y>=o.y0&&p.y<=o.y1));
  if(!ok){p.st='air';p.vx=0;p.vy=0;p.on=null;}
  else{
   if(o.type==='spike'&&!p.inv){die('トゲに当たった');}
   if(o.type==='crumble'){o.crack+=dt;if(o.crack>.7){o.gone=true;burst(p.x,p.y,'#a98',14);}}
   const slide=o.type==='ice'?110:38+diff()*15;
   p.vy=-slide;p.y+=p.vy*dt;p.wallT+=dt;
   if(!o.blk)p.x=surf(o,p.y)+(p.side==='L'?R:-R);
   if(Math.random()<dt*10)G.parts.push({x:p.x+(p.side==='L'?-R:R),y:p.y-R,vx:0,vy:-20,l:.4,c:o.type==='ice'?'#cef':'#ccc',s:2});
  }
 }else if(p.st==='air'){
  p.vy-=GRAV*dt;p.vx+=G.wind*dt;
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  // 左右の壁
  const sL=segAt('L',p.y),sR=segAt('R',p.y);
  const xL=sL&&surf(sL,p.y),xR=sR&&surf(sR,p.y);
  if(sL&&p.x-R<=xL&&p.vx<=0)attach(sL,'L',xL+R);
  else if(sR&&p.x+R>=xR&&p.vx>=0)attach(sR,'R',xR-R);
  else if(sL&&p.x-R<xL)attach(sL,'L',xL+R);
  else if(sR&&p.x+R>xR)attach(sR,'R',xR-R);
  else if(p.x<R+2||p.x>W-R-2){p.x=clamp(p.x,R+2,W-R-2);p.vx=0;}
  // 空中ブロック
  if(p.st==='air')for(const b of G.blocks){const hs=b.s/2,dx=p.x-b.x,dy=p.y-b.y;

 else parts={head:[0,-17],body:[0,-9,0,4],arms:[[0,-6,-10,-2,-14,4],[0,-6,10,-2,14,4]],legs:[[0,4,-6,12,-8,20],[0,4,6,12,8,20]]};
 ctx.lineCap='round';ctx.lineJoin='round';
 const strokeAll=(w,c)=>{ctx.strokeStyle=c;ctx.lineWidth=w;limb(parts.body);parts.arms.forEach(limb);parts.legs.forEach(limb);ctx.fillStyle=c;ctx.beginPath();ctx.arc(parts.head[0],parts.head[1],7+w/2-2.5,0,7);ctx.fill();};
 if(S.eq.color==='shadow'){ctx.shadowColor='#9b5de5';ctx.shadowBlur=12;}
 strokeAll(9,LIGHT.includes(S.eq.color)?'#123':S.eq.color==='shadow'?'#c8a2ff':'#fff');ctx.shadowBlur=0;strokeAll(5,col);
 if(S.eq.color==='shadow'){ctx.fillStyle='#ff3b3b';ctx.fillRect(parts.head[0]+face*2-1,parts.head[1]-2,3,2);}
 // 帽子
 const hx=parts.head[0],hy=parts.head[1];
 if(S.eq.hat==='cap'){ctx.fillStyle='#e63946';ctx.beginPath();ctx.arc(hx,hy-2,8,Math.PI,0);ctx.fill();ctx.fillRect(hx+(face>0?0:-12),hy-3,12,3);}
 else if(S.eq.hat==='band'){ctx.strokeStyle='#e63946';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(hx-8,hy-3);ctx.lineTo(hx+8,hy-3);ctx.lineTo(hx-face*14,hy-6+Math.sin(G.t*20)*2);ctx.stroke();}
 else if(S.eq.hat==='helm'){ctx.fillStyle='#ffd23f';ctx.strokeStyle='#a87800';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(hx,hy-1,9,Math.PI,0);ctx.fill();ctx.stroke();}
 else if(S.eq.hat==='crown'){ctx.fillStyle='#ffd700';ctx.strokeStyle='#a87800';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(hx-8,hy-6);ctx.lineTo(hx-8,hy-15);ctx.lineTo(hx-4,hy-10);ctx.lineTo(hx,hy-16);ctx.lineTo(hx+4,hy-10);ctx.lineTo(hx+8,hy-15);ctx.lineTo(hx+8,hy-6);ctx.closePath();ctx.fill();ctx.stroke();}
 else if(S.eq.hat==='ribbon'){ctx.fillStyle='#ff5c8a';ctx.strokeStyle='#a0274c';ctx.lineWidth=1.2;const rx=hx-face*5,ry=hy-8;
  ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx-8,ry-6);ctx.lineTo(rx-8,ry+5);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx+8,ry-6);ctx.lineTo(rx+8,ry+5);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(rx,ry,2.5,0,7);ctx.fill();}
 else if(S.eq.hat==='cat'){ctx.fillStyle=col;ctx.strokeStyle='#fff';ctx.lineWidth=1.5;for(const sx of[-1,1]){ctx.beginPath();ctx.moveTo(hx+sx*3,hy-7);ctx.lineTo(hx+sx*8,hy-15);ctx.lineTo(hx+sx*9,hy-4);ctx.closePath();ctx.fill();ctx.stroke();}
  ctx.fillStyle='#ff9ab5';for(const sx of[-1,1]){ctx.beginPath();ctx.moveTo(hx+sx*5,hy-7);ctx.lineTo(hx+sx*8,hy-12);ctx.lineTo(hx+sx*8,hy-6);ctx.fill();}}
 else if(S.eq.hat==='oni'){ctx.fillStyle='#ffe066';ctx.strokeStyle='#8a6d00';ctx.lineWidth=1.2;for(const sx of[-1,1]){ctx.beginPath();ctx.moveTo(hx+sx*3,hy-6);ctx.quadraticCurveTo(hx+sx*7,hy-12,hx+sx*5,hy-17);ctx.lineTo(hx+sx*7,hy-6);ctx.closePath();ctx.fill();ctx.stroke();}}
 else if(S.eq.hat==='chef'){ctx.fillStyle='#fff';ctx.strokeStyle='#99a';ctx.lineWidth=1.2;ctx.fillRect(hx-7,hy-11,14,5);ctx.strokeRect(hx-7,hy-11,14,5);ctx.beginPath();ctx.arc(hx-4,hy-15,5,0,7);ctx.arc(hx+4,hy-15,5,0,7);ctx.arc(hx,hy-18,5,0,7);ctx.fill();ctx.stroke();ctx.fillRect(hx-6,hy-16,12,6);}
 else if(S.eq.hat==='ninja'){ctx.fillStyle='#2b2d42';ctx.beginPath();ctx.arc(hx,hy,9,Math.PI*1.05,Math.PI*1.95);ctx.fill();ctx.fillRect(hx-9,hy-3,18,4);ctx.strokeStyle='#2b2d42';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(hx-face*8,hy-1);ctx.quadraticCurveTo(hx-face*16,hy-4+Math.sin(G.t*18)*3,hx-face*22,hy+Math.sin(G.t*18+1)*4);ctx.stroke();
  ctx.fillStyle='#fff';ctx.fillRect(hx+face*2-2,hy-2,4,2);}
 else if(S.eq.hat==='propeller'){ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(hx,hy-6,6,Math.PI,0);ctx.fill();ctx.fillStyle='#e63946';ctx.fillRect(hx-1,hy-14,2,8);const w=Math.cos(G.t*30)*11;ctx.fillStyle='#3fa7f5';ctx.fillRect(hx-Math.abs(w),hy-16,Math.abs(w)*2,3);}
 else if(S.eq.hat==='wizard'){ctx.fillStyle='#5a189a';ctx.strokeStyle='#ffd23f';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(hx-11,hy-5);ctx.lineTo(hx+11,hy-5);ctx.lineTo(hx-face*6,hy-24);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#ffd23f';ctx.font='7px sans-serif';ctx.textAlign='center';ctx.fillText('★',hx-face*1,hy-10);}
 else if(S.eq.hat==='halo'){ctx.strokeStyle='#ffe066';ctx.lineWidth=2.5;ctx.shadowColor='#fff3a0';ctx.shadowBlur=8;ctx.beginPath();ctx.ellipse(hx,hy-14+Math.sin(G.t*4)*1.5,8,3,0,0,7);ctx.stroke();ctx.shadowBlur=0;}
 else if(S.eq.hat==='astro'){ctx.fillStyle='rgba(180,230,255,.35)';ctx.strokeStyle='#e8eef5';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(hx,hy,12,0,7);ctx.fill();ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(hx,hy,8,Math.PI*1.1,Math.PI*1.4);ctx.stroke();ctx.fillStyle='#e8eef5';ctx.fillRect(hx-6,hy+10,12,3);}
 if(p.shield){ctx.strokeStyle='rgba(120,220,255,'+(.6+.3*Math.sin(G.t*8))+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-4,22,0,7);ctx.stroke();}
 ctx.restore();
 // ためゲージ
}
function txt(t,x,y,size,align='center',col='#fff'){ctx.font='bold '+size+'px "Hiragino Maru Gothic ProN","Meiryo",sans-serif';ctx.textAlign=align;ctx.textBaseline='middle';ctx.lineWidth=4;ctx.strokeStyle='#123';ctx.strokeText(t,x,y);ctx.fillStyle=col;ctx.fillText(t,x,y);}
function drawHUD(){
 const m=toM(G.maxH);
 txt(fmtM(m),W/2,34,30);
 txt(areaOf(m).name,W/2,60,13);
 txt('● '+G.coinsGot,W-WALL-8,20,14,'right','#ffd23f');
 const nx=MILES[G.mile];if(nx)txt('つぎ：'+nx[1].replace('！','')+' '+fmtM(nx[0]),WALL+8,20,11,'left');
 let iy=H-20;if(G.p.dbl){txt('⇈×'+G.p.dbl,WALL+8,iy,14,'left','#7bd389');iy-=20;}
 if(G.combo>=3&&G.comboT>0)txt(G.combo+' COMBO',W/2,110,22+Math.min(G.combo,20)*.4,'center','#ffd23f');
 if(Math.abs(G.wind)>40){txt((G.wind>0?'風 →':'← 風'),W/2,H-24,14,'center','#cef');}
 if(G.popT>0){ctx.globalAlpha=clamp(G.popT,0,1);txt(G.popup,W/2,H*.32,26,'center','#ffd23f');ctx.globalAlpha=1;}
}

// ---------- タイトル画面の背景 ----------
function drawTitleBG(){const k=cv.width/W;ctx.setTransform(k,0,0,k,0,0);
 const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#5ab4f5');gr.addColorStop(1,'#d8f1ff');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
 const t=performance.now()/1000;
 for(let i=0;i<6;i++){const x=((i*131+t*12)%(W+160))-80,y=120+i*90;ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(x,y,24,0,7);ctx.arc(x+26,y-8,30,0,7);ctx.arc(x+56,y,22,0,7);ctx.fill();}
 const fakeG=G;G={p:{x:150,y:0,st:'air',vx:200,vy:300,dbl:0},t,cam:-H*.52,parts:[],trail:[]};
 drawWall({side:'L',type:'n',mat:'fence'},0,H);
 // ポーズの棒人間
 ctx.save();ctx.translate(W*.47-150,0);ctx.scale(1,1);
 const sc=3.2;ctx.translate(150,H*.66);ctx.scale(sc,sc);ctx.translate(-150,-H*.52);drawPlayer();ctx.restore();G=fakeG;
}

// ---------- ループ ----------
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.033,(ts-last)/1000||0);last=ts;
 try{if(state==='play'||state==='dying'){update(dt);draw();}
 else if(state==='title')drawTitleBG();}catch(e){console.error(e);}}

// ---------- 画面 ----------
const ovs=['title','over','shop','achs'];
function show(id){ovs.forEach(o=>$(o).classList.toggle('show',o===id));}
function refreshTitle(){$('bestT').textContent='じこベスト '+fmtM(S.best)+'　/　ごうけい '+fmtM(S.total);$('coinsTop').textContent='● '+S.coins;$('bSnd').textContent='音：'+(S.snd?'ON':'OFF');}
function start(){newGame();state='play';show(null);press=false;}
function gameOver(){
 state='over';const m=toM(G.maxH),newBest=m>S.best;
 S.total+=m;S.coins+=G.coinsGot;if(newBest)S.best=m;
 S.hist.push(Math.floor(m));S.hist.sort((a,b)=>b-a);S.hist=S.hist.slice(0,10);save();
 $('oCause').textContent=G.cause==='fall'?'落ちてしまった…':G.cause+'…';
 $('oH').textContent=fmtM(m);$('oArea').textContent=areaOf(m).name+' まで到達';
 $('oBest').textContent=newBest?'★ じこベスト更新！ ★':'じこベスト '+fmtM(S.best);
 $('oCoin').textContent='コイン +'+G.coinsGot+'（所持 '+S.coins+'）';
 $('oSend').textContent='';sendScore(Math.floor(m));
 show('over');
}
$('bStart').onclick=start;$('bRetry').onclick=start;
$('bBack').onclick=()=>{state='title';refreshTitle();show('title');};
$('bSnd').onclick=()=>{S.snd=!S.snd;save();refreshTitle();};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{state='title';refreshTitle();show('title');});

// きせかえ
let shopTab='color';
function renderShop(){const L=$('shopList');L.innerHTML='<div style="text-align:right;font-weight:bold">● '+S.coins+'</div>';
 for(const [id,name,price,c] of SHOP[shopTab]){const own=S.own[shopTab].includes(id),eq=S.eq[shopTab]===id;
  const d=document.createElement('div');d.className='item';
  d.innerHTML='<span>'+(c?'<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:'+({rainbow:'linear-gradient(90deg,red,orange,yellow,green,blue,violet)',ghost:'rgba(220,235,255,.6)',shadow:'radial-gradient(#000 55%,#9b5de5)'}[c]||c)+';border:1px solid #999;vertical-align:middle"></span> ':'')+name+'</span>';
  const b=document.createElement('button');
  if(eq){b.textContent='そうび中';b.className='on';}
  else if(own){b.textContent='つける';b.onclick=()=>{S.eq[shopTab]=id;save();renderShop();};}
  else{b.textContent='● '+price;b.disabled=S.coins<price;b.onclick=()=>{S.coins-=price;S.own[shopTab].push(id);S.eq[shopTab]=id;save();SE.coin();renderShop();};}
  d.appendChild(b);L.appendChild(d);}}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{shopTab=b.dataset.t;document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));renderShop();});
$('bShop').onclick=()=>{state='menu';renderShop();show('shop');};

// 実績
$('bAch').onclick=()=>{state='menu';$('achList').innerHTML=MILES.map(([m,n])=>'<div class="ach '+(S.ach.includes(m)?'':'no')+'">'+(S.ach.includes(m)?'🏅 ':'🔒 ')+n.replace('！','')+'<span style="float:right">'+fmtM(m)+'</span></div>').join('')+
 '<div class="ach">ごうけいの高さ<span style="float:right">'+fmtM(S.total)+'</span></div>';show('achs');};

// ランキング（ゲーム置き場共通）
const RID='teppen';
function sendScore(m){try{if(window.GAMES_RANK){GAMES_RANK.report(RID,m);$('oSend').textContent='記録をランキングに送ったよ';}}catch(e){}}
$('bRank').onclick=()=>{try{GAMES_RANK.show(RID);}catch(e){}};
resize();refreshTitle();requestAnimationFrame(loop);
})();
</script>
