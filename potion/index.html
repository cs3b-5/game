<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ポーション探検記</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root { --ink: #4a3426; --mute: #8a7262; --paper: #fbf1dc; --paper2: #f2e1bd; --line: rgba(74,52,38,.18); --accent: #c8553a; color-scheme: light; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #e8d4ac; color: var(--ink); font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif; user-select: none; -webkit-user-select: none; }
[hidden] { display: none !important; }
button { font-family: inherit; color: inherit; }
.btn { border: 2px solid rgba(74,52,38,.25); background: var(--paper); color: var(--ink); border-radius: 14px; padding: 9px 14px; font-weight: 900; font-size: .95rem; box-shadow: 0 4px 0 rgba(74,52,38,.25); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; justify-content: center; white-space: nowrap; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(74,52,38,.25); }
.btn.main { background: linear-gradient(180deg, #f08a5a, #c8553a); color: #fff; border-color: #a8402a; box-shadow: 0 4px 0 #8a3020; }
.btn:disabled { opacity: .4; pointer-events: none; }
.btn.sm { padding: 6px 10px; font-size: .85rem; border-radius: 12px; }

/* ===== 世界地図 ===== */
#world { position: fixed; inset: 0; overflow-y: auto; touch-action: pan-y; padding: calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom)); background: radial-gradient(circle at 20% 10%, #fbf1dc, #ecd9b2 70%); }
.wrap { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.head { display: grid; gap: 4px; justify-items: center; text-align: center; }
.head h1 { margin: 0; font-size: 1.6rem; color: #8a3a2a; letter-spacing: .05em; }
.head a { color: var(--mute); font-weight: 900; text-decoration: none; font-size: .85rem; justify-self: start; }
.region { border-radius: 22px; padding: 14px; border: 2px solid var(--line); box-shadow: 0 6px 16px rgba(74,52,38,.12); display: grid; gap: 10px; }
.region h2 { margin: 0; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
.region h2 small { margin-left: auto; font-size: .8rem; color: var(--mute); }
.region .who { font-size: .82rem; line-height: 1.55; }
.stages { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.st { aspect-ratio: 1.15; border-radius: 16px; border: 2px solid rgba(74,52,38,.25); background: #fffaf0; display: grid; place-items: center; align-content: center; cursor: pointer; font-weight: 900; font-size: 1.05rem; box-shadow: 0 3px 0 rgba(74,52,38,.2); }
.st .sr { font-size: .72rem; color: #e8a020; letter-spacing: 1px; min-height: 1em; }
.st.lock { opacity: .45; cursor: default; }
.st.next { border-color: var(--accent); box-shadow: 0 3px 0 var(--accent); }
.region.locked .stages, .region.locked .who { filter: grayscale(1); opacity: .5; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

/* ===== ステージ ===== */
#stage { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--paper); }
#bar { display: flex; gap: 6px; align-items: center; padding: calc(8px + env(safe-area-inset-top)) 8px 6px; }
#bar .ttl { font-weight: 900; font-size: 1rem; flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; }
#bar .moves { font-size: .76rem; color: var(--mute); font-weight: 700; display: block; overflow: hidden; text-overflow: ellipsis; }
#boardWrap { flex: 1; min-height: 0; position: relative; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#panel { background: #f6e6c4; border-top: 2px solid var(--line); padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); display: grid; gap: 7px; }
#mixRow { display: flex; gap: 8px; align-items: center; justify-content: center; }
#slots { display: flex; gap: 6px; }
#slots .s { width: 48px; height: 48px; border-radius: 13px; border: 2px dashed rgba(74,52,38,.35); display: grid; place-items: center; font-size: 1.5rem; background: rgba(255,255,255,.55); cursor: pointer; }
#slots .s.f { border-style: solid; background: #fff; }
#read { min-width: 92px; text-align: center; font-weight: 900; font-size: 1rem; line-height: 1.25; }
#read small { display: block; font-size: .7rem; color: var(--mute); font-weight: 700; }
#legend { display: flex; gap: 10px; justify-content: center; font-size: .74rem; font-weight: 900; color: var(--mute); flex-wrap: wrap; }
#shelf { display: flex; gap: 6px; overflow-x: auto; touch-action: pan-x; padding: 2px 2px 4px; }
.it { flex: 0 0 auto; width: 74px; border: 2px solid var(--line); background: #fffaf0; border-radius: 14px; padding: 5px 2px 4px; display: grid; justify-items: center; cursor: pointer; font-size: .7rem; font-weight: 700; position: relative; }
.it .e { font-size: 1.5rem; line-height: 1.15; }
.it .n { position: absolute; right: 3px; top: 1px; background: var(--accent); color: #fff; border-radius: 9px; padding: 0 6px; font-size: .7rem; font-weight: 900; }
.it .tg { font-size: .68rem; font-weight: 900; }
.it:disabled { opacity: .3; }

/* ===== メッセージ ===== */
.big { position: fixed; inset: 0; z-index: 50; background: rgba(60,40,24,.5); display: grid; place-items: center; padding: 16px; }
.card { width: min(390px, 100%); max-height: 100%; overflow: auto; background: var(--paper); border-radius: 24px; padding: 20px 18px; display: grid; gap: 12px; justify-items: center; text-align: center; border: 3px solid var(--line); box-shadow: 0 16px 40px rgba(60,40,24,.4); touch-action: pan-y; }
.card .e { font-size: 3.2rem; line-height: 1; }
.card h2 { margin: 0; font-size: 1.35rem; }
.card p { margin: 0; font-size: .9rem; line-height: 1.75; }
.card .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; }
.card .row .btn { flex: 1; }
.stars { color: #e8a020; font-size: 1.8rem; letter-spacing: 4px; }
.zk { display: grid; grid-template-columns: 46px 1fr auto; gap: 8px; align-items: center; text-align: left; width: 100%; background: #fffaf0; border: 2px solid var(--line); border-radius: 14px; padding: 6px 10px; }
.zk .e { font-size: 1.9rem; }
.zk small { display: block; color: var(--mute); font-size: .76rem; line-height: 1.4; }
.toast { position: fixed; left: 50%; top: calc(62px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 60; background: rgba(74,52,38,.92); color: #fff8ea; padding: 8px 16px; border-radius: 14px; font-weight: 900; font-size: .88rem; pointer-events: none; transition: opacity .3s; max-width: calc(100% - 30px); text-align: center; }
</style>
</head>
<body>
<section id="world">
  <div class="wrap">
    <div class="head"><a href="../index.html">← ゲーム一覧へ戻る</a><h1>🧙‍♀️ ポーション探検記</h1></div>
    <div class="region" style="background:#fffaf0">
      <div class="who" style="font-size:.88rem">素材を釜で調合すると、飲んだときに<b>とぶ方向ときょり</b>が決まる。<br><b>🍒火↑ 💧水↓ 🪨土← 🪶風→</b> の力を足し算して、相手のいるマスに<b>ぴったり着地</b>して回収しよう。動く相手は、着地するタイミングも合わせてね。</div>
    </div>
    <div id="regions" style="display:grid;gap:14px"></div>
    <div class="tools">
      <button class="btn" id="bZukan">📗 いきもの図鑑</button>
      <button class="btn" id="bFree">🎲 きまぐれステージ</button>
    </div>
  </div>
</section>

<section id="stage" hidden>
  <div id="bar">
    <button class="btn sm" id="bBack" aria-label="地図へ戻る">🗺️</button>
    <div class="ttl"><span id="ttl"></span><span class="moves" id="moves"></span></div>
    <button class="btn sm" id="bUndo" aria-label="1手もどす">↶</button>
    <button class="btn sm" id="bRetry" aria-label="さいしょから">⟲</button>
    <button class="btn sm" id="bHelp" aria-label="あそびかた">？</button>
  </div>
  <div id="boardWrap"><canvas id="board" aria-label="ステージの盤面"></canvas></div>
  <div id="panel">
    <div id="mixRow">
      <div id="slots"></div>
      <div id="read"></div>
      <button class="btn main" id="bDrink">🧪 飲む</button>
    </div>
    <div id="legend"></div>
    <div id="shelf"></div>
  </div>
</section>

<div class="big" id="msg" hidden><div class="card" id="msgCard"></div></div>
<div class="toast" id="toast" style="opacity:0"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const EF = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

  // ================= データ =================
  // 力：0火(↑) 1水(↓) 2土(←) 3風(→) 4光(きょり倍) 5闇(向きが反対)
  const EL = [
    { n: '火', c: '#e0583a', d: '↑' }, { n: '水', c: '#3a86d0', d: '↓' }, { n: '土', c: '#9a7036', d: '←' },
    { n: '風', c: '#3aa888', d: '→' }, { n: '光', c: '#d8a818', d: '×2' }, { n: '闇', c: '#7a4aa8', d: '反転' },
  ];
  const MAT = {
    berry: { nm: '赤い実', e: '🍒', v: [1, 0, 0, 0, 0, 0] },
    drop: { nm: 'しずく', e: '💧', v: [0, 1, 0, 0, 0, 0] },
    pebble: { nm: '小石', e: '🪨', v: [0, 0, 1, 0, 0, 0] },
    feather: { nm: '羽根', e: '🪶', v: [0, 0, 0, 1, 0, 0] },
    firestone: { nm: '火の石', e: '🔥', v: [2, 0, 0, 0, 0, 0] },
    sea: { nm: '海の水', e: '🌊', v: [0, 2, 0, 0, 0, 0] },
    clay: { nm: 'ねんど', e: '🧱', v: [0, 0, 2, 0, 0, 0] },
    gust: { nm: 'つむじ風', e: '🌀', v: [0, 0, 0, 2, 0, 0] },
    honey: { nm: 'はちみつ', e: '🍯', v: [1, 0, 0, 1, 0, 0] },
    clover: { nm: 'クローバー', e: '🍀', v: [0, 1, 0, 1, 0, 0] },
    mush: { nm: 'きのこ', e: '🍄', v: [0, 1, 1, 0, 0, 0] },
    acorn: { nm: 'どんぐり', e: '🌰', v: [1, 0, 1, 0, 0, 0] },
    glow: { nm: 'ほたる草', e: '🌟', v: [0, 0, 0, 0, 1, 0] },
    shadow: { nm: '影の実', e: '🫐', v: [0, 0, 0, 0, 0, 1] },
    comet: { nm: '流れ星', e: '☄️', v: [1, 0, 0, 2, 0, 0] },
    shell: { nm: '貝がら', e: '🐚', v: [0, 2, 1, 0, 0, 0] },
  };
  // 回収する相手
  const CRE = {
    snail: { nm: 'かたつむり', e: '🐌', d: 'じっとしている' },
    ladybug: { nm: 'てんとう虫', e: '🐞', d: 'じっとしている' },
    squirrel: { nm: 'りす', e: '🐿️', d: 'じっとしている' },
    hedgehog: { nm: 'はりねずみ', e: '🦔', d: 'じっとしている' },
    turtle: { nm: 'かめ', e: '🐢', d: 'じっとしている' },
    mouse: { nm: '雪ねずみ', e: '🐭', d: 'じっとしている' },
    owl: { nm: 'ふくろう', e: '🦉', d: 'じっとしている' },
    rabbit: { nm: 'うさぎ', e: '🐇', d: 'ジャンプのたびに、まっすぐ1マス進む。ぶつかると折り返す', mv: 1 },
    frog: { nm: 'カエル', e: '🐸', d: 'ジャンプのたびに、まっすぐ2マス跳ぶ。跳べないと折り返す', mv: 1 },
    penguin: { nm: 'ペンギン', e: '🐧', d: 'ジャンプのたびに、ななめに1マスすべる。ぶつかると折り返す', mv: 1 },
    fairy: { nm: '妖精', e: '🧚', d: '右→下→左→上…とくるくる回る（逆回りの子もいる）', mv: 1 },
  };
  const BASIC = ['berry', 'drop', 'pebble', 'feather'];
  const FIELD = BASIC.concat(['firestone', 'sea', 'clay', 'gust', 'honey', 'clover', 'mush', 'acorn']);
  const REGIONS = [
    { nm: 'はじまりの森', e: '🌳', bg: '#e3f0c8', col: ['#c4e3a0', '#b4d68e'], paper: '#eaf3d6', obs: { tree: 3, rock: 1 }, pool: BASIC, stat: ['snail', 'ladybug', 'squirrel'], mov: [],
      intro: ['🧙‍♀️', 'あそびかた', '下の素材をタップして<b>釜</b>（左の枠・3つまで）に入れると、魔女がとぶ<b>方向ときょり</b>が線で出る。<br><b>🍒火→上　💧水→下　🪨土→左　🪶風→右</b><br>混ぜると力が足し算になる（🍒🍒🪶なら「上2・右1」）。<br><b>🧪飲む</b>でジャンプ！ 相手のいるマスに<b>ぴったり着地</b>すると回収できて、相手が持っている素材ももらえる。<br>全員回収でクリア！ 木や岩には着地できないよ。'] },
    { nm: '花の野原', e: '🌼', bg: '#f4f0c8', col: ['#d8eba6', '#c8df94'], paper: '#f3f3d8', obs: { bush: 3, rock: 1, tree: 1 }, pool: FIELD, stat: ['snail', 'ladybug', 'hedgehog'], mov: ['rabbit'],
      intro: ['🐇', '新しい相手：うさぎ', '<b>うさぎ</b>は、あなたがジャンプするたびに<b>1マス進む</b>。ぶつかると折り返す。<br>うさぎの赤い矢印が「次に進む方向」。<b>着地したときに同じマス</b>にいれば回収できる。<br>新しい素材：<b>🔥🌊🧱🌀</b>は2マスぶん、<b>🍯🍀🍄🌰</b>はななめ！'] },
    { nm: 'かえる沼', e: '🪷', bg: '#dcecd8', col: ['#bcd9a8', '#acce98'], paper: '#e2efdc', obs: { water: 4, tree: 1 }, pool: FIELD.concat(['glow']), stat: ['turtle', 'snail'], mov: ['rabbit', 'frog'],
      intro: ['🐸', '新しい相手：カエル', '<b>カエル</b>は毎ターン<b>2マス</b>ぴょん。池には着地できないから気をつけて。<br>新しい素材：<b>🌟ほたる草</b>を混ぜると、とぶ<b>きょりが2倍</b>（2つで3倍）になる。'] },
    { nm: '雪の山', e: '🏔️', bg: '#eaf0f6', col: ['#f2f6fa', '#e0e9f2'], paper: '#eef3f8', obs: { rock: 2, snowtree: 2 }, pool: FIELD.concat(['glow', 'shadow']), stat: ['mouse', 'hedgehog'], mov: ['frog', 'penguin'],
      intro: ['🐧', '新しい相手：ペンギン', '<b>ペンギン</b>は<b>ななめ</b>にすべる。<br>新しい素材：<b>🫐影の実</b>を混ぜると、<b>向きがぜんぶ反対</b>になる（上→下、右→左）。'] },
    { nm: '星の空', e: '🌌', bg: '#dfe6f6', col: ['#d2e2f6', '#c2d4ee'], paper: '#e4ebf7', obs: { cloud: 3 }, pool: FIELD.concat(['glow', 'shadow', 'comet', 'shell']), stat: ['owl'], mov: ['rabbit', 'frog', 'penguin', 'fairy'],
      intro: ['🧚', '新しい相手：妖精', '<b>妖精</b>は右→下→左→上…と<b>くるくる回る</b>（逆回りの子もいる）。<br>新しい素材：<b>☄️流れ星</b>（上1・右2）、<b>🐚貝がら</b>（下2・左1）。'] },
  ];
  const NEWPOOL = REGIONS.map((R, r) => r ? R.pool.filter(m => !REGIONS[r - 1].pool.includes(m)) : R.pool);
  function params(r, s) {
    if (r === 0) return { N: s < 4 ? 5 : 6, k: s < 3 ? 1 : s < 6 ? 2 : 3, mpp: [1, s < 1 ? 1 : 2], decoy: s < 2 ? 0 : 1, obs: .12, mov: 0 };
    if (r === 1) return { N: s < 4 ? 6 : 7, k: 2 + (s >> 2) + (s > 5 ? 1 : 0), mpp: [1, 2], decoy: 1, obs: .14, mov: .55 };
    if (r === 2) return { N: 7, k: 3 + (s >> 2), mpp: [1, 3], decoy: 1, obs: .2, mov: .55 };
    if (r === 3) return { N: 7, k: 3 + (s >> 2) + (s > 6 ? 1 : 0), mpp: [1, 3], decoy: 2, obs: .16, mov: .6 };
    return { N: 8, k: 4 + (s >> 2) + (s > 6 ? 1 : 0), mpp: [1, 3], decoy: 2, obs: .15, mov: .7 };
  }

  // ================= ルール =================
  function vec(list) {
    const s = [0, 0, 0, 0, 0, 0];
    for (const m of list) MAT[m].v.forEach((x, i) => s[i] += x);
    let dx = s[3] - s[2], dy = s[1] - s[0];
    const mul = 1 + s[4], flip = s[5] % 2 === 1;
    if (flip) { dx = -dx; dy = -dy; }
    return { dx: dx * mul, dy: dy * mul, mul, flip };
  }
  const initDirs = t => t === 'fairy' ? [0, 1, 2, 3].flatMap(ix => [{ ix, cw: 1 }, { ix, cw: -1 }])
    : t === 'penguin' ? [[1, 1], [1, -1], [-1, 1], [-1, -1]].map(([dx, dy]) => ({ dx, dy }))
    : [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => ({ dx, dy }));
  const FD = [[1, 0], [0, 1], [-1, 0], [0, -1]];
  function stepCre(c, walk) {
    if (!CRE[c.type].mv) return;
    if (c.type === 'fairy') {
      const d = FD[c.ix];
      if (walk(c.x + d[0], c.y + d[1])) { c.x += d[0]; c.y += d[1]; }
      c.ix = (c.ix + c.cw + 4) % 4; return;
    }
    const k = c.type === 'frog' ? 2 : 1;
    if (walk(c.x + c.dx * k, c.y + c.dy * k)) { c.x += c.dx * k; c.y += c.dy * k; return; }
    c.dx = -c.dx; c.dy = -c.dy;
    if (walk(c.x + c.dx * k, c.y + c.dy * k)) { c.x += c.dx * k; c.y += c.dy * k; }
  }
  function rngOf(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // ステージ自動生成：先に「答えのジャンプ」を決めて、着地点に相手を置く（動く相手は逆算して出発点を決める）
  function generate(r, s, seed) {
    const R = REGIONS[r], P = params(r, s), N = P.N, NP = NEWPOOL[r];
    for (let att = 0; att < 800; att++) {
      const rnd = rngOf(seed * 31 + att * 7919 + 1), ri = n => Math.floor(rnd() * n), pick = a => a[ri(a.length)];
      const K = (x, y) => x + ',' + y;
      const start = { x: ri(N), y: ri(N) }, used = new Set([K(start.x, start.y)]);
      const steps = []; let p = start, ok = true;
      for (let i = 0; i < P.k; i++) {
        let f = null;
        for (let tr = 0; tr < 120 && !f; tr++) {
          const n = P.mpp[0] + ri(P.mpp[1] - P.mpp[0] + 1), mats = [];
          for (let j = 0; j < n; j++) mats.push(rnd() < .45 ? pick(NP) : pick(R.pool));
          const v = vec(mats); if (!v.dx && !v.dy) continue;
          const L = { x: p.x + v.dx, y: p.y + v.dy };
          if (L.x < 0 || L.y < 0 || L.x >= N || L.y >= N || used.has(K(L.x, L.y))) continue;
          f = { mats, L };
        }
        if (!f) { ok = false; break; }
        steps.push(f); used.add(K(f.L.x, f.L.y)); p = f.L;
      }
      if (!ok) continue;
      const grid = Array.from({ length: N }, () => Array(N).fill(null));
      const ow = Object.entries(R.obs), tot = ow.reduce((a, b) => a + b[1], 0);
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        if (used.has(K(x, y)) || rnd() >= P.obs) continue;
        let q = rnd() * tot; for (const [t, w] of ow) if ((q -= w) < 0) { grid[y][x] = t; break; }
      }
      const walk = (x, y) => x >= 0 && y >= 0 && x < N && y < N && !grid[y][x];
      const cre = [], init = new Set([K(start.x, start.y)]);
      for (let i = 0; i < steps.length && ok; i++) {
        const L = steps[i].L; let c = null;
        if (R.mov.length && i > 0 && rnd() < P.mov) {
          const type = pick(R.mov), cands = [];
          for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
            if (!walk(x, y) || init.has(K(x, y)) || (x === L.x && y === L.y)) continue;
            for (const d of initDirs(type)) {
              const sim = { type, x, y, ...d };
              for (let t = 0; t < i; t++) stepCre(sim, walk);
              if (sim.x === L.x && sim.y === L.y) cands.push({ type, x, y, ...d });
            }
          }

      if (cr.drop) { cx.fillStyle = '#fffaf0'; cx.strokeStyle = 'rgba(74,52,38,.4)'; cx.lineWidth = 1.5; cx.beginPath(); cx.arc(X + c * .3, Y - c * .28 + hop, c * .15, 0, 7); cx.fill(); cx.stroke(); emoji(MAT[cr.drop].e, X + c * .3, Y - c * .27 + hop, c * .19); }
    }
    // 魔女
    let mx = G.x, my = G.y, lift = 0;
    if (anim && anim.k === 'jump') {
      const q = Math.min(1, (now - anim.t0) / anim.dur), e = q < .5 ? 2 * q * q : 1 - Math.pow(-2 * q + 2, 2) / 2;
      mx = anim.from.x + (anim.to.x - anim.from.x) * e; my = anim.from.y + (anim.to.y - anim.from.y) * e;
      lift = Math.sin(Math.PI * q) * c * (.6 + .12 * Math.hypot(anim.to.x - anim.from.x, anim.to.y - anim.from.y));
      if (Math.random() < .5) { const [X, Y] = ctr(mx, my); parts.push({ x: X, y: Y - lift, vx: Math.random() - .5, vy: Math.random(), l: .7, c: '#c8a0f0' }); }
      if (q >= 1) afterJump();
    } else if (anim && anim.k === 'cre' && k >= 1) afterCre();
    {
      const [X, Y] = ctr(mx, my);
      cx.fillStyle = 'rgba(74,52,38,.22)'; cx.beginPath(); cx.ellipse(X, Y + c * .3, c * .26 * (1 - Math.min(.5, lift / c * .3)), c * .08, 0, 0, 7); cx.fill();
      if (!anim) { cx.strokeStyle = '#c8553a'; cx.lineWidth = Math.max(2, c * .05); cx.beginPath(); cx.ellipse(X, Y + c * .3, c * .32, c * .1, 0, 0, 7); cx.stroke(); }
      emoji('🧙‍♀️', X, Y - lift - c * .04 + (anim ? 0 : Math.sin(time * 4) * c * .02), c * .7);
    }
    // 着地の予告
    const L = !busy && landing();
    if (L) {
      const [X1, Y1] = ctr(G.x, G.y), [X2, Y2] = ctr(L.x, L.y), col = L.ok ? 'rgba(110,60,180,.85)' : 'rgba(200,60,50,.85)';
      arrowTo(X1, Y1 - c * .2, X2, Y2, col, Math.max(2.5, c * .06), [c * .14, c * .1], c * (.6 + .1 * Math.hypot(L.dx, L.dy)));
      if (L.ok) {
        cx.strokeStyle = col; cx.lineWidth = Math.max(2.5, c * .06); cx.beginPath(); cx.arc(X2, Y2, c * (.38 + Math.sin(time * 6) * .03), 0, 7); cx.stroke();
        cx.globalAlpha = .35; emoji('🧙‍♀️', X2, Y2 - c * .04, c * .6); cx.globalAlpha = 1;
      } else {
        cx.strokeStyle = col; cx.lineWidth = Math.max(3, c * .08); const s = c * .2;
        cx.beginPath(); cx.moveTo(X2 - s, Y2 - s); cx.lineTo(X2 + s, Y2 + s); cx.moveTo(X2 + s, Y2 - s); cx.lineTo(X2 - s, Y2 + s); cx.stroke();
      }
    }
    parts = parts.filter(p => (p.l -= .022) > 0);
    for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += .12; cx.globalAlpha = p.l; cx.fillStyle = p.c; cx.beginPath(); cx.arc(p.x, p.y, c * .05, 0, 7); cx.fill(); }
    cx.globalAlpha = 1;
  }

  // ================= 小物 =================
  let tt = null;
  function toast(t) { const el = $('toast'); el.textContent = t; el.style.opacity = 1; clearTimeout(tt); tt = setTimeout(() => el.style.opacity = 0, 2400); }
  function card(html, acts) {
    $('msgCard').innerHTML = html; $('msg').hidden = false;
    const close = () => { $('msg').hidden = true; };
    $('msgCard').querySelectorAll('[data-ok]').forEach(b => b.onclick = close);
    for (const id in acts || {}) { const b = $(id); if (b) b.onclick = () => { close(); acts[id](); }; }
  }
  let ac = null;
  function A() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); return ac; }
  function tone(f0, f1, dur, type = 'sine', v = .12, t = 0) { const a = A(); if (!a) return; const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f0, a.currentTime + t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), a.currentTime + t + dur); g.gain.setValueAtTime(v, a.currentTime + t); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + t + dur); o.connect(g).connect(a.destination); o.start(a.currentTime + t); o.stop(a.currentTime + t + dur + .02); }
  const sfx = {
    drop() { tone(520, 320, .12, 'sine', .14); },
    pop() { tone(400, 600, .08, 'triangle', .08); },
    gulp() { for (let i = 0; i < 3; i++) tone(260 + i * 60, 160, .1, 'sine', .1, i * .08); },
    land() { tone(220, 160, .1, 'triangle', .1); },
    catch() { [660, 880, 1180].forEach((f, i) => tone(f, f, .14, 'triangle', .1, i * .07)); },
    win() { [523, 659, 784, 1046].forEach((f, i) => tone(f, f, .28, 'triangle', .12, i * .12)); },
  };

  function loop(now) { requestAnimationFrame(loop); if (!$('stage').hidden) draw(now); }
  renderWorld();
  requestAnimationFrame(loop);
  // テスト用
  window.POTION = { generate, startStage, get G() { return G; }, get LV() { return LV; }, get busy() { return busy; }, setSlots(a) { slots = a.slice(); renderPanel(); }, drink, SV: () => SV };
})();
