<style>
:root{--ink:#5d4b57;--ink2:#8f7d88;--line:#6d5866;--pink:#f4a7b9;--pinkd:#e4879f;--cream:#fffaf3;--sky:#dcecf8;--card:rgba(255,255,255,.82);--cell:40px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Hiragino Maru Gothic ProN","Zen Maru Gothic","M PLUS Rounded 1c","Yu Gothic UI","Meiryo",sans-serif;color:var(--ink);
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
body{background:linear-gradient(180deg,#fdeef2 0%,#fff8ef 48%,#e6f1fa 100%)}
body::before{content:"";position:fixed;left:0;right:0;bottom:0;height:34vh;pointer-events:none;opacity:.55;
  background:radial-gradient(ellipse 60% 100% at 70% 100%,#cfe2f3 0 60%,transparent 61%),radial-gradient(ellipse 50% 80% at 15% 100%,#d9e9f5 0 60%,transparent 61%)}
button{font-family:inherit;color:inherit;touch-action:manipulation}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);z-index:1}
.screen.active{display:flex}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
.btn{border:none;border-radius:999px;padding:14px 22px;font-size:17px;font-weight:700;background:#fff;box-shadow:0 4px 0 #ead7de,0 6px 16px rgba(160,120,140,.15);cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #ead7de}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--pinkd),0 6px 16px rgba(228,135,159,.3)}
.btn.sky{background:#a9d1ef;color:#fff;box-shadow:0 4px 0 #86b6dc,0 6px 16px rgba(120,170,210,.3)}
.btn.small{padding:9px 14px;font-size:14px}
.btn:disabled{opacity:.45}
.iconbtn{border:none;background:var(--card);width:42px;height:42px;border-radius:50%;font-size:20px;box-shadow:0 2px 8px rgba(160,120,140,.15);cursor:pointer;flex:none}
.card{background:var(--card);border-radius:22px;box-shadow:0 6px 24px rgba(160,120,140,.14);padding:20px}
/* 桜 */
#sakura{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.petal{position:absolute;top:-20px;width:12px;height:10px;background:#f7c4d0;border-radius:12px 0 12px 0;opacity:.75;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,-20px) rotate(0)}50%{transform:translate(40px,50vh) rotate(180deg)}100%{transform:translate(-20px,105vh) rotate(360deg)}}
/* タイトル */
.title-wrap{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.logo{display:flex;align-items:flex-end;justify-content:center;gap:0;margin-bottom:2px}
.logo svg{filter:drop-shadow(0 6px 10px rgba(110,80,100,.18))}
h1{margin:0;font-size:46px;letter-spacing:.08em;color:var(--line);text-shadow:3px 3px 0 #fff,0 6px 14px rgba(244,167,185,.5)}
.sub{color:var(--ink2);font-size:14px;margin-top:-6px}
.menu{display:flex;flex-direction:column;gap:14px;width:100%;max-width:300px;margin-top:8px}
.menu .btn{width:100%}
.player{font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.net{font-size:11px;padding:2px 8px;border-radius:99px;background:#d6efd9;color:#4f8a5c}
.net.off{background:#eee;color:#999}
.linkbtn{background:none;border:none;color:var(--ink2);text-decoration:underline;font-size:13px;cursor:pointer;padding:4px}
.daily-status{font-size:13px;color:var(--ink2);text-align:center;min-height:1.3em}

#map-scroll{flex:1;width:100%;min-height:0}
#map-list{position:relative;width:100%;max-width:520px;margin:0 auto}

.cell{position:relative;display:flex;align-items:center;justify-content:center;border:0 solid rgba(109,88,102,.18);cursor:pointer}

@keyframes glow{0%,100%{box-shadow:inset 0 0 0 3px #fff,0 0 0 2px #ffcf4d}50%{box-shadow:inset 0 0 0 3px #fff,0 0 10px 6px #ffcf4d}}
.cell.boom{animation:boom .5s}
@keyframes boom{0%,60%{background:#ff8c8c!important}100%{}}
.shake{animation:shake .45s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}

.msg{min-height:2.6em;font-size:13px;color:var(--ink2);text-align:center;flex:none;padding:0 8px;display:flex;align-items:center;justify-content:center;line-height:1.35}
.bottom{width:100%;display:flex;gap:8px;flex:none;align-items:stretch}

.modes button.on{background:var(--pink);color:#fff}
.hintbtn{border:none;border-radius:16px;background:#ffe9a8;color:#8a6a1e;font-weight:800;font-size:14px;padding:0 14px;box-shadow:0 3px 0 #efd27d;cursor:pointer;white-space:nowrap}
.hintbtn:disabled{opacity:.45}
/* エフェクト */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.spark{position:absolute;width:10px;height:10px;border-radius:50%;animation:spark .6s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.bang{position:absolute;transform:translate(-50%,-50%);font-size:46px;animation:bang .6s ease-out forwards}
@keyframes bang{0%{transform:translate(-50%,-50%) scale(.3)}40%{transform:translate(-50%,-50%) scale(1.3)}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.flash{position:fixed;inset:0;background:rgba(255,120,120,.25);animation:fl .4s forwards;pointer-events:none;z-index:49}
@keyframes fl{to{opacity:0}}
/* モーダル */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(93,75,87,.28);padding:20px}
.modal .card{width:100%;max-width:360px;text-align:center;animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
.modal h3{margin:4px 0 10px;font-size:22px}
.modal p{margin:6px 0;font-size:14px;line-height:1.6;color:var(--ink2)}
.modal .bigtime{font-size:38px;font-weight:800;color:var(--line);font-variant-numeric:tabular-nums}
.modal .btns{display:flex;flex-direction:column;gap:10px;margin-top:16px}
#loading{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:rgba(255,248,240,.6);font-size:15px;color:var(--ink2)}
#loading div{animation:pulse2 1s infinite alternate}
@keyframes pulse2{to{opacity:.4}}
@media (max-height:640px){h1{font-size:38px}.btn{padding:11px 20px}.hearts{font-size:18px}}
</style>

<body>

<script>
// ===== GEN START =====
function xmur3(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return function(){h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);return (h^=h>>>16)>>>0;};}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^(a>>>15),1|a);t=t+Math.imul(t^(t>>>7),61|t)^t;return((t^(t>>>14))>>>0)/4294967296;};}
function makeRng(seedStr){return mulberry32(xmur3(seedStr)());}
function shuffle(a,rng){for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}

function sizeForLevel(lv){return lv<=15?5:lv<=35?6:lv<=65?7:lv<=100?8:lv<=150?9:10;}
function difficultyT(lv){
  const b=[[1,15],[16,35],[36,65],[66,100],[101,150]];
  for(const [s,e] of b) if(lv<=e) return (lv-s)/(e-s);
  return Math.min(1,0.35+(lv-151)/200);
}

const GEO={};
function geo(N){
  if(GEO[N]) return GEO[N];
  const NN=N*N, att=new Uint8Array(NN*NN), attList=[], rows=[], cols=[], nb4=[];
  for(let r=0;r<N;r++){rows.push([]);cols.push([]);}
  for(let i=0;i<NN;i++){
    const r=(i/N)|0,c=i%N; rows[r].push(i); cols[c].push(i);
    const L=[];
    for(let j=0;j<NN;j++){ if(j===i) continue; const rj=(j/N)|0,cj=j%N;
      if(rj===r||cj===c||(Math.abs(rj-r)<=1&&Math.abs(cj-c)<=1)){att[i*NN+j]=1;L.push(j);} }
    attList.push(L);
    const n=[]; if(r>0)n.push(i-N); if(r<N-1)n.push(i+N); if(c>0)n.push(i-1); if(c<N-1)n.push(i+1); nb4.push(n);
  }
  return GEO[N]={N,NN,att,attList,rows,cols,nb4};
}

function randomPlacement(N,rng){
  const cols=new Array(N), used=new Array(N).fill(false);
  (function bt(r){
    if(r===N) return true;
    const order=shuffle([...Array(N).keys()],rng);
    for(const c of order){
      if(used[c]) continue; if(r>0&&Math.abs(cols[r-1]-c)<=1) continue;
      used[c]=true; cols[r]=c; if(bt(r+1)) return true; used[c]=false;
    }
    return false;
  })(0);
  return cols;
}

function growRegions(N,cols,rng,t){
  const G=geo(N), NN=G.NN, reg=new Int8Array(NN).fill(-1);
  for(let r=0;r<N;r++) reg[r*N+cols[r]]=r;
  let filled=N; const compact=0.85-0.7*t;
  const fr=[];
  while(filled<NN){
    fr.length=0;
    for(let i=0;i<NN;i++){ if(reg[i]>=0) continue; for(const j of G.nb4[i]) if(reg[j]>=0) fr.push(i,reg[j]); }
    const cnt=fr.length/2; let pick;
    if(rng()<compact){
      let bs=-1; pick=0;
      for(let k=0;k<cnt;k++){ const i=fr[2*k],g=fr[2*k+1]; let s=0; for(const j of G.nb4[i]) if(reg[j]===g) s++; s+=rng()*1.2; if(s>bs){bs=s;pick=k;} }
    } else pick=Math.floor(rng()*cnt);
    reg[fr[2*pick]]=fr[2*pick+1]; filled++;
  }
  return reg;
}

function countSolutions(N,reg,limit){
  limit=limit||2; let count=0; const uc=new Uint8Array(N), ug=new Uint8Array(N);
  (function bt(r,prev){
    if(r===N){count++;return count>=limit;}
    for(let c=0;c<N;c++){
      if(uc[c]||Math.abs(c-prev)<=1) continue; const g=reg[r*N+c]; if(ug[g]) continue;
      uc[c]=ug[g]=1; if(bt(r+1,c)) return true; uc[c]=ug[g]=0;
    }
    return false;
  })(0,-9);
  return count;
}

// 論理ソルバー（ヒントと難易度判定に使う）
// lvl1: 置ける場所が1つだけ / lvl2: 置くと他のエリアが詰む / lvl3: 1つの囲い込み / lvl4: 2〜3個の囲い込み
function logicSolve(N,reg,cats){
  const G=geo(N), NN=G.NN;
  const regs=[]; for(let g=0;g<N;g++) regs.push([]); for(let i=0;i<NN;i++) regs[reg[i]].push(i);
  const units=[];
  for(let r=0;r<N;r++) units.push({k:'row',n:r,cells:G.rows[r]});
  for(let c=0;c<N;c++) units.push({k:'col',n:c,cells:G.cols[c]});
  for(let g=0;g<N;g++) units.push({k:'reg',n:g,cells:regs[g]});
  const st=new Uint8Array(NN); let catCount=0;
  const isAtt=(i,j)=>G.att[i*NN+j]===1||reg[i]===reg[j];
  function place(i){ st[i]=1; catCount++; for(const j of G.attList[i]) if(st[j]===0) st[j]=2; for(const j of regs[reg[i]]) if(j!==i&&st[j]===0) st[j]=2; }
  for(const i of cats) if(st[i]===0) place(i);
  const steps=[], lvCount=[0,0,0,0,0]; let maxLvl=0;
  const rec=(s)=>{steps.push(s); if(s.lvl>maxLvl)maxLvl=s.lvl; lvCount[s.lvl]++;};
  const hasCat=u=>u.cells.some(j=>st[j]===1);
  const cands=u=>u.cells.filter(j=>st[j]===0);
  const idxOf=(k,i)=>k==='row'?((i/N)|0):k==='col'?i%N:reg[i];
  const cellsOf=(k,x)=>k==='row'?G.rows[x]:k==='col'?G.cols[x]:regs[x];
  const PAIRS=[['reg','row'],['reg','col'],['row','reg'],['col','reg'],['row','col'],['col','row']];
  function combos(arr,k,cb){ const cur=[]; (function rc(s){ if(cur.length===k) return cb(cur); for(let i=s;i<arr.length;i++){cur.push(arr[i]); if(rc(i+1)) return true; cur.pop();} return false; })(0); }
  outer: while(catCount<N){
    for(const u of units){
      if(hasCat(u)) continue; const cs=cands(u);
      if(cs.length===0) return {solved:false,contradiction:true,steps,maxLvl,lvCount};
      if(cs.length===1){ place(cs[0]); rec({lvl:1,type:'cat',cells:[cs[0]],unit:u}); continue outer; }
    }
    for(let i=0;i<NN;i++){
      if(st[i]!==0) continue;
      for(const u of units){
        if(hasCat(u)||u.cells.includes(i)) continue;
        const cs=cands(u);
        if(cs.every(j=>isAtt(i,j))){ st[i]=2; rec({lvl:2,type:'x',cells:[i],unit:u}); continue outer; }
      }
    }
    for(let k=1;k<=3;k++){
      const lvl=k===1?3:4;
      for(const [sk,dk] of PAIRS){
        const open=units.filter(u=>u.k===sk&&!hasCat(u));
        if(open.length<=k) continue;
        let found=null;
        combos(open,k,(sel)=>{
          const set=new Set(); const inSel=new Set();
          for(const u of sel) for(const j of u.cells){ inSel.add(j); if(st[j]===0) set.add(idxOf(dk,j)); }
          if(set.size!==k) return false;
          const ex=[];
          for(const x of set) for(const j of cellsOf(dk,x)) if(st[j]===0&&!inSel.has(j)) ex.push(j);
          if(ex.length){ found={sel:sel.slice(),dk,dst:[...set],ex}; return true; }
          return false;
        });
        if(found){ for(const j of found.ex) st[j]=2; rec({lvl,type:'x',cells:found.ex,src:found.sel,sk,dk:found.dk,dst:found.dst}); continue outer; }
      }
    }
    break;
  }
  return {solved:catCount===N,steps,maxLvl,lvCount};
}

const PALETTE=['#F6B8C4','#FFCFA3','#FFE9A3','#D9EDA4','#B5E3B9','#A8E0D8','#B3D8F5','#BFC8F2','#D3BFF0','#EBC0E6','#F2C6B6','#DCD2C0'];
function hexRgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function assignColors(N,reg,rng){
  const G=geo(N), adj=new Set();
  for(let i=0;i<G.NN;i++) for(const j of G.nb4[i]) if(reg[i]!==reg[j]) adj.add(Math.min(reg[i],reg[j])*16+Math.max(reg[i],reg[j]));
  const rgb=PALETTE.map(hexRgb); let best=null,bs=-1;
  for(let a=0;a<60;a++){
    const p=shuffle([...Array(PALETTE.length).keys()],rng).slice(0,N);
    let m=1e9; for(const k of adj){const x=rgb[p[(k/16)|0]],y=rgb[p[k%16]]; const d=Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2]); if(d<m)m=d;}
    if(m>bs){bs=m;best=p;}
  }
  return best.map(i=>PALETTE[i]);
}

function findOtherSolution(N,reg,sol){
  const uc=new Uint8Array(N), ug=new Uint8Array(N), cur=new Array(N); let out=null, nodes=0;
  (function bt(r,prev){
    if(++nodes>200000) return true;
    if(r===N){ for(let k=0;k<N;k++) if(cur[k]!==sol[k]){ out=cur.slice(); return true; } return false; }
    for(let c=0;c<N;c++){
      if(uc[c]||Math.abs(c-prev)<=1) continue; const g=reg[r*N+c]; if(ug[g]) continue;
      uc[c]=ug[g]=1; cur[r]=c; if(bt(r+1,c)) return true; uc[c]=ug[g]=0;
    }
    return false;
  })(0,-9);
  return out;
}
function regionConnected(N,reg,g,seed){
  const G=geo(N); let total=0; for(let i=0;i<G.NN;i++) if(reg[i]===g) total++;
  const seen=new Uint8Array(G.NN), st=[seed]; seen[seed]=1; let n=0;
  while(st.length){ const i=st.pop(); n++; for(const j of G.nb4[i]) if(!seen[j]&&reg[j]===g){seen[j]=1;st.push(j);} }
  return n===total;
}
// 答えが2つ以上あるとき、別解のマスを隣のエリアに移して別解をつぶす
function repairUnique(N,reg,cols,rng){
  const G=geo(N), seedOf=cols.map((c,r)=>r*N+c), isSeed=new Uint8Array(G.NN);
  for(const s of seedOf) isSeed[s]=1;
  for(let it=0;it<60;it++){
    const other=findOtherSolution(N,reg,cols);
    if(!other) return true;
    const cells=shuffle(other.map((c,r)=>r*N+c).filter(i=>!isSeed[i]),rng);
    let moved=false;
    for(const x of cells){
      const g=reg[x]; const hs=shuffle(G.nb4[x].map(j=>reg[j]).filter(h=>h!==g),rng);
      for(const h of hs){
        reg[x]=h;
        if(regionConnected(N,reg,g,seedOf[g])){moved=true;break;}
        reg[x]=g;
      }
      if(moved) break;
    }
    if(!moved) return false;
  }
  return false;
}

function generatePuzzle(seedStr,N,t){
  const rng=makeRng(seedStr);
  const target=t<0.25?1:t<0.5?2:t<0.8?3:4;
  const MAX=N<=6?60:N<=8?40:35;
  let best=null,bestScore=1e9;
  for(let a=0;a<MAX||!best;a++){
    const cols=randomPlacement(N,rng);
    const reg=growRegions(N,cols,rng,t);
    if(!repairUnique(N,reg,cols,rng)) continue;
    const res=logicSolve(N,reg,[]);
    if(!res.solved) continue;
    const hard=res.lvCount[2]*0.4+res.lvCount[3]+res.lvCount[4]*2;
    let score=Math.abs(Math.min(res.maxLvl,4)-target)*10;
    score+= target>=3 ? -Math.min(hard,6) : hard*0.3;
    if(score<bestScore){bestScore=score;best={reg,cols,maxLvl:res.maxLvl,hard};}
    if(res.maxLvl===target&&(target<3||hard>=3)) break;
    if(a>MAX*10) break;
  }
  if(countSolutions(N,best.reg,2)!==1) throw new Error('not unique');
  const sol=best.cols.map((c,r)=>r*N+c);
  return {N,reg:Array.from(best.reg),sol,colors:assignColors(N,best.reg,rng),maxLvl:best.maxLvl,hard:best.hard};
}

let game=null, timerId=null;
const puzzleCache={};
function getPuzzle(opts){
  const key=opts.mode==='daily'?'d:'+opts.date:'l:'+opts.level;
  if(puzzleCache[key]) return puzzleCache[key];
  const p=opts.mode==='daily'
    ? generatePuzzle(SEED_VER+'-daily-'+opts.date,7,0.6)
    : generatePuzzle(SEED_VER+'-level-'+opts.level,sizeForLevel(opts.level),difficultyT(opts.level));
  return puzzleCache[key]=p;
}
function startGame(opts){
  $('#loading').classList.remove('hidden');
  setTimeout(()=>{

    $('#loading').classList.add('hidden');
    const N=p.N;
    game={...opts,p,N,marks:new Uint8Array(N*N),hearts:3,hints:3,start:performance.now(),over:false,lastTap:null,mode2:'normal',solSet:new Set(p.sol)};
    $('#hud-lv').textContent=opts.mode==='daily'?'デイリー '+opts.date.slice(5).replace('-','/'):'レベル '+opts.level;

}

function onTap(i){
  clearHint();
  const now=performance.now(), m=game.marks[i];
  if(game.mode2==='x'){ if(m!==2){ game.marks[i]=m===1?0:1; drawCell(i);} return; }
  if(game.mode2==='cat'){ if(m!==2) tryCat(i); return; }
  const lt=game.lastTap;
  if(lt&&lt.i===i&&now-lt.t<300){ game.lastTap=null; if(game.marks[i]!==2){ game.marks[i]=lt.prev; drawCell(i); tryCat(i);} return; }
  game.lastTap={i,t:now,prev:m};
  if(m!==2){ game.marks[i]=m===1?0:1; drawCell(i); }
}
function tryCat(i){
  if(game.solSet.has(i)){
    game.marks[i]=2; drawCell(i);
    const cats=game.marks.reduce((a,v)=>a+(v===2?1:0),0);
    if(cats===game.N) win();
    return;
  }
  // ミス
  game.hearts--; renderHearts(game.hearts); explode(i);
  if(game.hearts<=0) lose(); else setMsg('💥 そこには置けないみたい…（残りハート '+game.hearts+'）');
}

  for(let k=0;k<14;k++){ const s=document.createElement('div'); s.className='spark'; const a=fxRng()*Math.PI*2, d=40+fxRng()*60;

}

};

// ===== ヒント =====
const UNIT_NAME={row:'行',col:'列',reg:'色のエリア'};
$('#btn-hint').onclick=()=>{
  if(!game||game.over||game.hints<=0) return;
  clearHint();
  const {N,p,marks}=game, cats=[]; for(let i=0;i<N*N;i++) if(marks[i]===2) cats.push(i);
  const res=logicSolve(N,p.reg,cats);
  let pick=null;
  for(const s of res.steps){
    const targets=s.type==='cat'?s.cells:s.cells.filter(i=>marks[i]!==1);
    if(targets.length){ pick={s,targets}; break; }
  }
  game.hints--; updateHint();
  if(!pick){ const i=p.sol.find(j=>marks[j]!==2); cellEl(i).classList.add('hint'); setMsg('💡 ここに猫がいるよ'); return; }
  const {s,targets}=pick;
  targets.forEach(i=>cellEl(i).classList.add('hint'));
  let text;
  if(s.lvl===1){ s.unit.cells.forEach(i=>cellEl(i).classList.add('hint-area')); text=`💡 この${UNIT_NAME[s.unit.k]}で猫を置けるのはここだけ`; }
  else if(s.lvl===2){ s.unit.cells.forEach(i=>cellEl(i).classList.add('hint-area')); text=`💡 ここに猫を置くと、光っている${UNIT_NAME[s.unit.k]}に猫を置ける場所がなくなる → ×`; }
  else{
    s.src.forEach(u=>u.cells.forEach(i=>cellEl(i).classList.add('hint-area')));
    const k=s.src.length;
    text=k===1?`💡 光っている${UNIT_NAME[s.sk]}の猫は、必ずこの${UNIT_NAME[s.dk]}に入る → 同じ${UNIT_NAME[s.dk]}の他のマスは×`
              :`💡 光っている${k}つの${UNIT_NAME[s.sk]}の猫は、${k}つの${UNIT_NAME[s.dk]}に収まる → その${UNIT_NAME[s.dk]}の他のマスは×`;
  }
  setMsg(text);
};

// ===== デイリー =====
async function startDailyFlow(){
  const d=todayStr(); resolveAbandoned();
  const rec=save.daily[d];
  if(rec){
    if(rec.status==='clear') await modal('本日のデイリー',`<div class="stamp" style="margin:6px auto 10px">本日の<br>デイリー<br>クリア済</div><div class="bigtime">${fmtTime(rec.time)}</div><p>また明日も挑戦してね</p>`,[{label:'OK',cls:'pink'}]);
    else await modal('本日のデイリー','<p>今日の挑戦は終わりました（失敗）。<br>また明日！</p>',[{label:'OK',cls:'pink'}]);
    return;
  }
  const i=await modal('デイリーパズル',`<p>${d} の問題（7×7）<br>挑戦できるのは<b>1日1回</b>だけ。<br>途中でやめたりページを閉じると失敗になるよ。</p>`,[{label:'挑戦する',cls:'pink'},{label:'やめる'}]);
  if(i!==0) return;
  save.daily[d]={status:'playing',ts:Date.now()}; persist();
  startGame({mode:'daily',date:d});
}

// ===== ランキングボタン（🏆・ゲーム置き場 共通） =====
if(window.GAMES_RANK) GAMES_RANK.mount(RK_LEVEL,{right:'max(10px, env(safe-area-inset-right))',bottom:'max(10px, env(safe-area-inset-bottom))'},()=>$('#scr-play').classList.contains('active'));

// ===== 起動 =====
save=loadLocal()||{cleared:0,daily:{}};
resolveAbandoned();
if(window.GAMES_RANK&&save.cleared) GAMES_RANK.report(RK_LEVEL,save.cleared,null,{old:true});
gotoTitle();
</script>
