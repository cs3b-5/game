<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゲーム置き場</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&family=Bebas+Neue&display=swap">
<style>
/* Layout: a home-screen grid of app icons. Name appears in a tooltip on hover or keyboard focus. */
:root { --bg: #111318; --bg2: #1b1f27; --ink: #f4f1ea; --muted: #8b90a0; --tip: #f4f1ea; --tipink: #111318; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: radial-gradient(1200px 600px at 50% -10%, #2a2f3d, var(--bg) 60%); background-color: var(--bg); color: var(--ink); font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 56px 16px 80px; display: grid; gap: 40px; justify-items: center; }
h1 { margin: 0; font-family: "Bebas Neue", "Noto Sans JP", sans-serif; font-weight: 400; font-size: 2.6rem; letter-spacing: .3em; color: var(--muted); padding-left: .3em; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, 112px); gap: 36px 32px; justify-content: center; width: 100%; }
a.app { position: relative; display: block; width: 112px; height: 112px; border-radius: 26px; outline: none; transition: transform .15s ease; }
a.app svg { display: block; width: 100%; height: 100%; border-radius: 26px; box-shadow: 0 10px 26px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.08); }
a.app:hover, a.app:focus-visible { transform: translateY(-4px) scale(1.04); }
a.app:focus-visible svg { box-shadow: 0 0 0 3px var(--ink), 0 10px 26px rgba(0,0,0,.45); }
a.app::after { content: attr(data-name); position: absolute; left: 50%; top: calc(100% + 12px); transform: translate(-50%, -4px); background: var(--tip); color: var(--tipink); font-weight: 900; font-size: .9rem; padding: 6px 12px; border-radius: 8px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; z-index: 5; }
a.app::before { content: ""; position: absolute; left: 50%; top: calc(100% + 4px); transform: translate(-50%, -4px); border: 6px solid transparent; border-bottom-color: var(--tip); opacity: 0; transition: opacity .15s, transform .15s; z-index: 5; }
a.app:hover::after, a.app:focus-visible::after, a.app:hover::before, a.app:focus-visible::before { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { a.app, a.app::after, a.app::before { transition: none; } }


/* スマホ：アイコンを小さく、名前は常に下に出す */
@media (hover: none), (max-width: 520px) {
  main { padding: calc(64px + env(safe-area-inset-top, 0px)) 14px 60px; gap: 28px; }
  .grid { grid-template-columns: repeat(auto-fill, 84px); gap: 40px 22px; }
  a.app, a.app svg { width: 84px; height: 84px; border-radius: 20px; }
  a.app::before { display: none; }
  a.app::after { opacity: 1; transform: translate(-50%, 0); top: calc(100% + 6px); background: none; color: var(--ink, #fff); font-size: .72rem; font-weight: 700; padding: 0; white-space: normal; width: 104px; text-align: center; line-height: 1.3; }
  a.app:hover, a.app:focus-visible { transform: none; }
}
/* スマホ共通 */
[hidden] { display: none !important; }

/* アカウント（ユーザー名だけ） */
.rkAll { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; z-index: 20; display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: rgba(27,31,39,.85); border: 1px solid rgba(255,255,255,.1); color: var(--ink); font: 700 .85rem "Noto Sans JP", sans-serif; cursor: pointer; backdrop-filter: blur(6px); }
.rkDlg { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(4,6,14,.7); padding: 14px; }
.rkBox { width: min(520px, 100%); max-height: 90vh; overflow: auto; background: #171b24; border: 1px solid rgba(255,255,255,.12); border-radius: 18px; padding: 16px; color: var(--ink); font-family: "Noto Sans JP", sans-serif; }
.rkBox h2 { margin: 0 0 4px; text-align: center; font-size: 1.2rem; } .rkBox .sub { text-align: center; font-size: .78rem; opacity: .7; margin-bottom: 10px; }
.rkG { display: block; width: 100%; text-align: left; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 8px 12px; margin: 6px 0; color: inherit; font: inherit; cursor: pointer; }
.rkG b { display: block; font-size: .92rem; margin-bottom: 2px; } .rkG div { display: flex; justify-content: space-between; font-size: .8rem; opacity: .9; } .rkG em { font-style: normal; opacity: .6; font-size: .78rem; }
.rkX { display: block; width: 100%; margin-top: 10px; padding: 10px; border-radius: 10px; border: 0; background: rgba(255,255,255,.1); color: inherit; font: 700 .95rem "Noto Sans JP", sans-serif; cursor: pointer; }
.acc { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 20; display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; background: rgba(27,31,39,.85); border: 1px solid rgba(255,255,255,.1); color: var(--ink); font: 700 .85rem "Noto Sans JP", sans-serif; cursor: pointer; backdrop-filter: blur(6px); max-width: calc(100vw - 24px); }
.acc .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: #3a4152; font-size: .95rem; flex: none; }
.acc .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acc.on .av { background: linear-gradient(135deg, #ff9ec4, #8fd8ff); color: #111318; font-weight: 900; }
.accDlg { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(5,6,10,.6); padding: 16px; }
.accBox { width: min(380px, 100%); background: var(--bg2); border: 1px solid rgba(255,255,255,.1); border-radius: 18px; padding: 22px 20px 18px; display: grid; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.accBox h2 { margin: 0; font-size: 1.1rem; font-weight: 900; }
.accBox p { margin: 0; color: var(--muted); font-size: .8rem; line-height: 1.6; }
.accBox input { width: 100%; font: 900 1.15rem "Noto Sans JP", sans-serif; padding: 10px 12px; border-radius: 10px; border: 1px solid #3a4152; background: #0d0f14; color: var(--ink); outline: none; }
.accBox input:focus { border-color: #8fd8ff; }
.accRow { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.accRow button { font: 900 .9rem "Noto Sans JP", sans-serif; padding: 10px 16px; border-radius: 10px; border: 0; cursor: pointer; background: #2a3040; color: var(--ink); }
.accRow button.main { background: #8fd8ff; color: #111318; }
.accRow button:disabled { opacity: .5; cursor: default; }
.accMsg { min-height: 1.3em; font-size: .82rem; font-weight: 700; }
.accMsg.ng { color: #ff8a8a; } .accMsg.ok { color: #8fe8a8; }
.accNote { font-size: .72rem !important; }
html { -webkit-text-size-adjust: 100%; }
button, a, [role=button] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<button class="rkAll" id="rkAll" type="button" aria-label="みんなのランキング">🏆<span>ランキング</span></button>
<button class="acc" id="acc" type="button" aria-haspopup="dialog"><span class="av" id="accAv">👤</span><span class="nm" id="accNm">名前をつける</span></button>
<div class="accDlg" id="accDlg" hidden role="dialog" aria-modal="true" aria-labelledby="accTtl">
  <form class="accBox" id="accForm" autocomplete="off">
    <h2 id="accTtl">プレイヤー名</h2>
    <p>ここで決めた名前が、オンライン対戦などの名前に入ります。同じ名前はほかの人と使えません。</p>
    <input id="accIn" maxlength="10" placeholder="名前（10文字まで）" spellcheck="false" autocapitalize="off">
    <div class="accMsg" id="accMsg"></div>
    <div class="accRow"><button type="button" id="accOut">名前を消す</button><button type="button" id="accX">とじる</button><button type="submit" class="main" id="accGo">決める</button></div>
    <p class="accNote">集めるのは、この名前だけ。メールアドレス・本名・パスワードなどは使いません。名前はほかの人にも見えるので、本名や個人がわかる名前はやめておこう。</p>

</div>

<script src="rank.js"></script>
<script>
// ユーザー名だけのアカウント。
// claude.ai で開いたとき：共有の名簿（db）で「名前のダブり」を防ぐ。保存するのは 名前 と 中のID（ランダムな記号）だけ。
// GitHub などで開いたとき：この端末だけに保存。
(() => {
  const $ = id => document.getElementById(id);
  const K = GAMES_ACC.KEY;
  let db = null, uid = null, busy = false;
  const local = () => GAMES_ACC.get();
  const saveLocal = a => { try { a ? localStorage.setItem(K, JSON.stringify(a)) : localStorage.removeItem(K); } catch (e) {} };
  // 同じ名前の判定：全角半角・大文字小文字・空白をそろえる
  const norm = s => (s || '').normalize('NFKC').toLowerCase().replace(/\s+/g, '');
  const clean = s => (s || '').normalize('NFKC').replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 10);
  const hex = s => Array.from(new TextEncoder().encode(s), b => b.toString(16).padStart(2, '0')).join('');
  const ok = s => /^[\p{L}\p{N}_\-・ー〜!?！？☆★♪.]+$/u.test(s.replace(/\s/g, ''));

  function paint() {
    const a = local();
    $('acc').classList.toggle('on', !!(a && a.name));
    $('accNm').textContent = a && a.name ? a.name : '名前をつける';
    $('accAv').textContent = a && a.name ? [...a.name][0] : '👤';
    $('accOut').hidden = !(a && a.name);
  }
  function msg(t, cls) { $('accMsg').textContent = t || ''; $('accMsg').className = 'accMsg' + (cls ? ' ' + cls : ''); }
  function open() { const a = local(); $('accIn').value = a ? a.name : ''; msg(db && uid || (window.GAMES_RANK && GAMES_RANK.kind === 'firebase') ? '' : 'この画面では名前はこの端末だけに保存されます'); $('accDlg').hidden = false; setTimeout(() => $('accIn').focus(), 30); }
  function close() { $('accDlg').hidden = true; }

  async function claim(name) {
    const key = norm(name);
    if (!db || !uid) {
      // claude.ai の外（GitHub など）：Firebase の名簿にのせる
      if (window.GAMES_RANK && GAMES_RANK.kind === 'firebase') { const r = await GAMES_RANK.claim(name); if (!r.ok) return r; saveLocal({ name, key, shared: true }); return { ok: true }; }
      saveLocal({ name, key, shared: false }); return { ok: true };
    }
    const lock = db.doc('locks/' + hex(key));
    const L = await lock.acquire({ holder: uid, ttlMs: 8000 });
    if (!L.acquired) return { ok: false, why: 'いま同じ名前をだれかが登録中。少し待ってね' };
    const q = await db.collection('accounts').where('key', '==', key).get();
    if (q.docs.some(d => d.id !== uid)) return { ok: false, why: 'その名前はもう使われています' };
    await db.doc('accounts/' + uid).set({ name, key, at: Date.now() });
    saveLocal({ name, key, shared: true });
    return { ok: true };
  }

  $('acc').onclick = open;
  $('accX').onclick = close;
  $('accDlg').addEventListener('click', e => { if (e.target === $('accDlg')) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('accDlg').hidden) close(); });
  $('accForm').onsubmit = async e => {
    e.preventDefault(); if (busy) return;
    const name = clean($('accIn').value);
    if (!name) return msg('名前を入れてね', 'ng');
    if (!ok(name)) return msg('使えない記号が入っています', 'ng');
    const a = local();
    if (a && a.name === name && a.shared) { close(); return; }
    busy = true; $('accGo').disabled = true; msg('たしかめ中…');
    try {
      const r = await claim(name);
      if (r.ok) { msg('決まり！', 'ok'); paint(); setTimeout(close, 500); }
      else msg(r.why, 'ng');
    } catch (err) {
      // 書けない人（閲覧だけの共有など）はこの端末だけに保存
      saveLocal({ name, key: norm(name), shared: false }); paint();
      msg('名簿に書きこめなかったので、この端末だけに保存しました', 'ng');
    } finally { busy = false; $('accGo').disabled = false; }
  };
  $('accOut').onclick = async () => {
    if (busy) return; busy = true;
    try { if (db && uid) await db.doc('accounts/' + uid).delete(); } catch (e) {}
    saveLocal(null); paint(); busy = false; close();
  };

  paint();
  // GitHub など：Firebase の名簿の名前に合わせる
  if (window.GAMES_RANK && GAMES_RANK.kind === 'firebase') GAMES_RANK.myName().then(n => { if (n) paint(); }).catch(() => {});
  // みんなのランキング（全部のゲームの上位3人）
  $('rkAll').onclick = async () => {
    if (!window.GAMES_RANK) return;
    const d = document.createElement('div'); d.className = 'rkDlg';
    d.innerHTML = '<div class="rkBox"><h2>🏆 みんなのランキング</h2><div class="sub">ゲームを押すと、そのゲームのランキングが見られる</div><div class="rkList"><p style="text-align:center;opacity:.7">読みこみ中…</p></div><button class="rkX" type="button">とじる</button></div>';
    const close = () => d.remove(); d.querySelector('.rkX').onclick = close; d.addEventListener('click', e => { if (e.target === d) close(); });
    document.body.appendChild(d);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    let all = null; try { if (await GAMES_RANK.on()) all = await GAMES_RANK.top(3); } catch (e) {}
    const box = d.querySelector('.rkList');
    if (!all) { box.innerHTML = `<p style="text-align:center;opacity:.8">ランキングにつながらなかった（コード ${GAMES_RANK.why || '?'}）</p>`; return; }
    box.innerHTML = Object.entries(GAMES_RANK.META).map(([g, m]) => { const rows = all[g] || []; return `<button class="rkG" data-g="${g}"><b>${esc(m.t)} <em>${esc(m.sub || 'ベストスコア')}</em></b>${rows.length ? rows.map((r, i) => `<div><span>${['🥇', '🥈', '🥉'][i]} ${esc(r.name)}</span><span>${esc(GAMES_RANK.fmt(g, r.score))}</span></div>`).join('') : '<div><em>まだ記録なし</em></div>'}</button>`; }).join('');
    box.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { close(); GAMES_RANK.show(b.dataset.g); });
  };
  // claude.ai の中なら共有の名簿をつなぐ
  (async () => {
    for (let i = 0; i < 20 && !(window.claude && claude.use); i++) await new Promise(r => setTimeout(r, 100));
    if (!window.claude || !claude.use) return;
    try {
      const [d, u] = await Promise.all([claude.use('db'), claude.use('user')]);
      if (!d || !u) return;
      const id = await u.id(); if (!id) return;
      db = d; uid = id;
      // 名簿の自分の名前に合わせる（ほかの端末で変えたとき用）
      const me = await db.doc('accounts/' + uid).get();
      const a = local();
      if (me.exists) { const v = me.data(); if (!a || a.name !== v.name || !a.shared) { saveLocal({ name: v.name, key: v.key, shared: true }); paint(); } }
      else if (a && a.name && !a.shared) {
        // この端末だけの名前を、空いていれば名簿にのせる
        try { await claim(a.name); } catch (e) {}
      }
    } catch (e) { /* つながらなければこの端末だけ */ }
  })();
})();
</script>
