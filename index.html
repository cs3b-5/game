<!doctype html>

<style>
/* Layout: a home-screen grid of app icons. Name appears in a tooltip on hover or keyboard focus. */
:root { --bg: #111318; --bg2: #1b1f27; --ink: #f4f1ea; --muted: #8b90a0; --tip: #f4f1ea; --tipink: #111318; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: radial-gradient(1200px 600px at 50% -10%, #2a2f3d, var(--bg) 60%); background-color: var(--bg); color: var(--ink); font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 56px 16px 80px; display: grid; gap: 40px; justify-items: center; }
h1 { margin: 0; font-family: "Bebas Neue", "Noto Sans JP", sans-serif; font-weight: 400; font-size: 2.6rem; letter-spacing: .3em; color: var(--muted); padding-left: .3em; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, 112px); gap: 36px 32px; justify-content: center; width: 100%; }
a.app { position: relative; display: block; width: 112px; height: 112px; border-radius: 26px; outline: none; transition: transform .15s ease; }
a.app svg { display: block; width: 100%; height: 100%; border-radius: 26px; box-shadow: 0 10px 26px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.08); }
a.app:hover, a.app:focus-visible { transform: translateY(-4px) scale(1.04); }
a.app:focus-visible svg { box-shadow: 0 0 0 3px var(--ink), 0 10px 26px rgba(0,0,0,.45); }
a.app::after { content: attr(data-name); position: absolute; left: 50%; top: calc(100% + 12px); transform: translate(-50%, -4px); background: var(--tip); color: var(--tipink); font-weight: 900; font-size: .9rem; padding: 6px 12px; border-radius: 8px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; z-index: 5; }
a.app::before { content: ""; position: absolute; left: 50%; top: calc(100% + 4px); transform: translate(-50%, -4px); border: 6px solid transparent; border-bottom-color: var(--tip); opacity: 0; transition: opacity .15s, transform .15s; z-index: 5; }
a.app:hover::after, a.app:focus-visible::after, a.app:hover::before, a.app:focus-visible::before { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { a.app, a.app::after, a.app::before { transition: none; } }
</style>
</head>
