<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script src="../perf.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>うぱカートGP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&family=Dela+Gothic+One&display=swap">
<style>
:root { --pink: #ff5c8a; --gold: #ffd23a; --ink: #14172a; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: "M PLUS Rounded 1c", sans-serif; user-select: none; }
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
[hidden] { display: none !important; }
.f { font-family: "Dela Gothic One", sans-serif; font-weight: 400; }
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
.tl { position: absolute; left: 22px; top: 18px; }
.lap { font-family: "Dela Gothic One"; font-size: 34px; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }
.time { font-family: "Dela Gothic One"; font-size: 24px; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; margin-top: 2px; }
.trk { font-weight: 900; font-size: 13px; opacity: .85; text-shadow: 0 1px 3px #000; }
.item { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); text-align: center; }
#hItem { width: 96px; height: 96px; border-radius: 22px; background: rgba(10,14,30,.6); border: 4px solid #fff; box-shadow: 0 0 0 4px var(--ink), 0 8px 20px rgba(0,0,0,.4); display: grid; place-items: center; font-size: 56px; position: relative; }
#hItem b { position: absolute; right: 6px; bottom: 2px; font: 900 18px "Dela Gothic One"; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
#hItem.spin { animation: sp .1s infinite; } @keyframes sp { 50% { transform: scale(1.06); } }
#hItemName { margin-top: 8px; font-weight: 900; font-size: 13px; text-shadow: 0 1px 3px #000; }
.pos { position: absolute; right: 26px; bottom: 18px; font-family: "Dela Gothic One"; font-size: 120px; line-height: 1; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 8px 0 var(--ink); }
.pos small { font-size: 46px; margin-left: 2px; }
.pos.p1 { color: #ffd23a; } .pos.p2 { color: #dfe6ef; } .pos.p3 { color: #ffa86a; } .pos.p4 { color: #fff; }
.spd { position: absolute; left: 236px; bottom: 26px; font-family: "Dela Gothic One"; font-size: 40px; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
.spd small { font-size: 16px; margin-left: 4px; }
#mini { position: absolute; left: 18px; bottom: 18px; width: 200px; height: 200px; background: rgba(0,0,0,.25); border-radius: 18px; }
#hList { position: absolute; right: 22px; top: 18px; display: grid; gap: 3px; font-weight: 900; font-size: 13px; }
#hList div { background: rgba(0,0,0,.4); padding: 3px 10px; border-radius: 8px; min-width: 120px; } #hList div.me { background: var(--pink); }
#hList b { display: inline-block; width: 18px; }
#hDrift { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); width: 220px; height: 12px; border-radius: 6px; background: rgba(0,0,0,.5); border: 2px solid #fff; overflow: hidden; transition: opacity .2s; }
#hDrift u { display: block; height: 100%; width: 0; }
#hWrong { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-family: "Dela Gothic One"; font-size: 46px; color: #ff4d5a; -webkit-text-stroke: 3px #fff; paint-order: stroke fill; animation: bl .5s infinite alternate; } @keyframes bl { to { opacity: .4; } }
#speedlines { position: fixed; inset: 0; pointer-events: none; z-index: 4; opacity: 0; transition: opacity .3s; background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.0) 0deg 4deg, rgba(255,255,255,.12) 4deg 5deg); -webkit-mask: radial-gradient(circle at 50% 50%, transparent 32%, #000 70%); mask: radial-gradient(circle at 50% 50%, transparent 32%, #000 70%); }
#big { position: fixed; left: 50%; top: 38%; z-index: 7; transform: translate(-50%, -50%) scale(.4); font-family: "Dela Gothic One"; font-size: 110px; color: #fff; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; text-shadow: 0 10px 0 var(--pink); opacity: 0; pointer-events: none; white-space: nowrap; }
#big.on { animation: pop .9s cubic-bezier(.2,1.6,.4,1) forwards; } @keyframes pop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); } 25% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); } 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.1); } }
#toast { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); z-index: 8; background: rgba(0,0,0,.7); padding: 8px 18px; border-radius: 999px; font-weight: 900; opacity: 0; transition: opacity .2s; pointer-events: none; } #toast.on { opacity: 1; }
.scr { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 24px; overflow: auto; }
#title { background: linear-gradient(90deg, rgba(8,10,30,.85) 0%, rgba(8,10,30,.55) 40%, rgba(0,0,0,0) 65%); place-items: center start; padding-left: 7vw; }
.col { display: grid; gap: 12px; width: min(440px, 100%); }
.logo { margin: 0 0 6px; line-height: .95; }
.logo span { display: block; font-family: "Dela Gothic One"; font-size: 84px; background: linear-gradient(180deg, #fff 10%, #ffd0e0 45%, #ff5c8a 85%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 3px var(--ink); filter: drop-shadow(0 7px 0 var(--ink)) drop-shadow(0 16px 24px rgba(0,0,0,.5)); }
.logo small { display: inline-block; margin-top: 12px; font: 900 13px "M PLUS Rounded 1c"; letter-spacing: .25em; background: var(--gold); color: var(--ink); padding: 4px 14px; border-radius: 999px; }
.btn { width: 100%; padding: 15px 20px; border-radius: 16px; font-weight: 900; font-size: 19px; text-align: left; background: linear-gradient(180deg, #fff, #e8ecf4); color: var(--ink); box-shadow: 0 5px 0 #8a94a8, 0 12px 24px rgba(0,0,0,.35); display: flex; align-items: center; gap: 12px; }
.btn:hover { transform: translateY(-2px); } .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #8a94a8; }
.btn.pk { background: linear-gradient(180deg, #ff8ab0, #ff5c8a); color: #fff; box-shadow: 0 5px 0 #a8204a, 0 12px 24px rgba(0,0,0,.35); }
.btn small { display: block; font-size: 12px; opacity: .75; font-weight: 800; }
.btn .e { font-size: 28px; }
.card { background: rgba(10,14,30,.72); border: 1px solid rgba(255,255,255,.15); border-radius: 16px; padding: 12px 16px; font-size: 13px; line-height: 1.7; backdrop-filter: blur(8px); }
.card kbd { font: 900 11px monospace; background: #fff; color: #000; border-radius: 5px; padding: 1px 5px; }
.stat { display: grid; grid-template-columns: 1fr auto; gap: 1px 12px; } .stat b { text-align: right; }
.row3 { display: flex; gap: 6px; } .row3 button { flex: 1; padding: 7px; border-radius: 10px; background: rgba(255,255,255,.1); font-weight: 900; font-size: 13px; } .row3 button.on { background: var(--gold); color: var(--ink); }
#menuSel { background: rgba(8,10,30,.55); }
.panel { width: min(1100px, 100%); display: grid; gap: 14px; }
.panel h2 { margin: 0; font-family: "Dela Gothic One"; font-weight: 400; font-size: 34px; }
.chars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.ch { text-align: left; padding: 12px; border-radius: 16px; background: rgba(10,14,30,.75); border: 3px solid transparent; display: grid; gap: 3px; }
.ch.on { border-color: var(--gold); background: rgba(60,40,10,.8); } .ch:hover { border-color: rgba(255,255,255,.4); }
.ch b { font-size: 18px; } .ch i { font-style: normal; font-size: 11px; opacity: .7; }
.ch .dot { width: 22px; height: 22px; border-radius: 50%; border: 3px solid #fff; }
.ch .st { display: grid; gap: 2px; margin-top: 4px; } .ch em { font-style: normal; font-size: 10px; display: grid; grid-template-columns: 52px 1fr; align-items: center; opacity: .9; }
.ch em u { display: block; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #7ff0ff, #ff5c8a); }
.tracks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tk { text-align: left; padding: 14px; border-radius: 16px; background: rgba(10,14,30,.75); border: 3px solid transparent; display: grid; gap: 3px; } .tk.on { border-color: var(--gold); }
.tk b { font-size: 18px; } .tk i { font-style: normal; font-size: 12px; opacity: .75; } .tk span { font-size: 12px; color: var(--gold); font-weight: 900; }
.bar { display: flex; gap: 12px; align-items: center; } .bar .sp { flex: 1; }
.go { padding: 16px 40px; border-radius: 16px; font-weight: 900; font-size: 22px; background: linear-gradient(180deg, #ff8ab0, #ff5c8a); box-shadow: 0 5px 0 #a8204a; }
.ghost { padding: 14px 24px; border-radius: 16px; font-weight: 900; background: rgba(255,255,255,.1); }
#result { background: rgba(5,6,20,.6); }
.res { width: min(560px, 100%); background: rgba(10,14,30,.9); border: 1px solid rgba(255,255,255,.15); border-radius: 22px; padding: 20px; display: grid; gap: 12px; }
.res h2 { margin: 0; font-family: "Dela Gothic One"; font-weight: 400; font-size: 28px; } .res h3 { margin: 6px 0 0; font-size: 16px; }
.rows { display: grid; gap: 4px; } .rows div { display: grid; grid-template-columns: 34px 1fr auto auto; gap: 10px; align-items: center; padding: 7px 12px; border-radius: 10px; background: rgba(255,255,255,.06); font-weight: 900; }
.rows div.me { background: var(--pink); } .rows i { font-style: normal; } .rows em { font-style: normal; color: var(--gold); min-width: 34px; text-align: right; }
.rows.small div { padding: 4px 12px; font-size: 13px; }
.podium { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; align-items: end; text-align: center; }
.pd { background: rgba(255,255,255,.08); border-radius: 14px; padding: 10px; font-weight: 900; } .pd .emoji { font-size: 44px; } .pd.p1 { order: 2; padding-bottom: 34px; background: rgba(255,210,58,.25); } .pd.p2 { order: 1; } .pd.p3 { order: 3; }
.pd span { display: block; color: var(--gold); }
#load { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #2a1030, #05050c 70%); transition: opacity .4s; } #load.done { opacity: 0; pointer-events: none; }
#nopc { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: #0a0c1a; padding: 24px; text-align: center; line-height: 1.8; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="speedlines"></div>

<div id="hud" hidden>
  <div class="tl"><div class="lap" id="hLap">LAP 1/3</div><div class="time" id="hTime">0'00.00"</div><div class="trk" id="hTrack"></div></div>
  <div class="item"><div id="hItem"></div><div id="hItemName"></div></div>
  <div id="hList"></div>
  <canvas id="mini" width="400" height="400"></canvas>
  <div class="spd" id="hSpd">0</div>
  <div class="pos p4" id="hPos"></div>
  <div id="hDrift"><u></u></div>
  <div id="hWrong" hidden>逆走中！</div>
</div>
<div id="big"></div>
<div id="fps" style="position:fixed;left:50%;bottom:6px;transform:translateX(-50%);z-index:9;font:900 12px monospace;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:6px;pointer-events:none"></div>
<div id="toast"></div>

<div class="scr" id="title" hidden>
  <div class="col">
    <h1 class="logo"><span>うぱカート</span><span>GP</span><small>DRIFT · ITEM · RACE</small></h1>
    <button class="btn pk" id="tGP"><span class="e">🏆</span><span>グランプリ<small>3コース連続でポイントを競う</small></span></button>
    <button class="btn" id="tRace"><span class="e">🏁</span><span>フリーレース<small>好きなコースで1レース</small></span></button>
    <button class="btn" id="tTT"><span class="e">⏱</span><span>タイムアタック<small>ひとりでベストタイム（ランキングあり）</small></span></button>
    <div class="card">
      <b>操作</b>　<kbd>W</kbd><kbd>↑</kbd> アクセル　<kbd>S</kbd><kbd>↓</kbd> ブレーキ　<kbd>A</kbd><kbd>D</kbd> ハンドル<br>
      <kbd>Space</kbd> ドリフト（曲がりながら長押し → 離すとミニターボ）　<kbd>Shift</kbd>/<kbd>E</kbd> アイテム<br>
      <kbd>C</kbd> うしろを見る　<kbd>Esc</kbd> ポーズ　<kbd>M</kbd> 音　<kbd>F</kbd> FPS表示　🎮 ゲームパッドも使える<br>
      <span style="opacity:.75">スタートのコツ：「1」が出たらアクセルでロケットスタート</span>
    </div>
    <div class="card stat" id="tBest"></div>
    <div class="card"><b>画質</b>（変えると読みこみ直し）<div id="gpuName" style="font-size:11px;opacity:.7"></div><div class="row3" id="gfx" style="margin-top:6px"><button data-g="0">ひくい</button><button data-g="1">ふつう</button><button data-g="2">たかい</button></div></div>
    <a href="../index.html" style="color:#fff;opacity:.7;font-size:13px;font-weight:900">← GAMES にもどる</a>
  </div>
</div>

<div class="scr" id="menuSel" hidden>
  <div class="panel">
    <h2 id="selTitle"></h2>
    <div class="chars" id="chars"></div>
    <div class="tracks" id="selTracks"><div id="tracks" class="tracks" style="grid-column:1/-1"></div></div>
    <div class="bar">
      <div id="selLevel" class="card"><b>CPUの強さ</b><div class="row3" id="levels" style="margin-top:6px;min-width:300px"><button data-l="0">やさしい</button><button data-l="1">ふつう</button><button data-l="2">つよい</button></div></div>
      <div class="sp"></div>
      <button class="ghost" id="selBack">もどる</button>
      <button class="go" id="selGo">スタート！</button>
    </div>
  </div>
</div>

<div class="scr" id="pause" hidden style="background:rgba(0,0,0,.55)">
  <div class="col" style="width:320px">
    <h2 class="f" style="margin:0;font-size:40px;text-align:center">ポーズ</h2>
    <button class="btn pk" id="pResume">つづける</button>
    <button class="btn" id="pRetry">やりなおす</button>
    <button class="btn" id="pQuit">タイトルへ</button>
  </div>
</div>

<div class="scr" id="result" hidden>
  <div class="res"><div id="resBody"></div><div class="bar"><button class="ghost" id="resMenu">タイトルへ</button><div class="sp"></div><button class="go" id="resNext">つぎへ</button></div></div>
</div>

<div id="load"><div style="text-align:center"><div class="f" style="font-size:56px;color:#ff8ab0">うぱカートGP</div><div id="loadTxt" style="font-weight:900;margin-top:10px">よみこみ中…</div></div></div>
<script>
(function () {
  window.__loadDone = function () { var l = document.getElementById('load'); if (l) { l.classList.add('done'); setTimeout(function () { if (l.parentNode) l.remove(); }, 500); } };
  addEventListener('error', function (e) { var x = document.getElementById('loadTxt'); if (x && document.getElementById('load') && (e.target && e.target.tagName === 'SCRIPT' || /kart|three|tsuki/.test(e.filename || ''))) x.textContent = '読みこみに失敗：' + (e.message || e.target.src); }, true);
  var touchOnly = matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;
  if (touchOnly && !/bot/.test(location.search)) { document.addEventListener('DOMContentLoaded', function () { var d = document.createElement('div'); d.id = 'nopc'; d.innerHTML = '<div><div style="font-size:48px">🖥️</div><b>うぱカートGP は PC 専用です</b><br>キーボードかゲームパッドで遊んでね<br><a href="../index.html" style="color:#ff8ab0">← GAMES にもどる</a></div>'; document.body.appendChild(d); }); }
})();
</script>
<script type="importmap">{ "imports": { "three": "../upa/vendor/three.module.min.js" } }</script>
<script src="../account.js"></script>
<script src="../rank.js"></script>
<script type="module" src="game.js?v=3"></script>
</body>
</html>
