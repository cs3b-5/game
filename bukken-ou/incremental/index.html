<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>物件王 プロトタイプ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one screen. HUD (money, per-second, chapter bar) on top, the pixel office in the middle, a 4-button dock at the bottom, bottom sheets for buying. Single dark game-frame look by choice. */
:root {
  --frame: #1c2029;
  --panel: #283040;
  --panel-2: #353f53;
  --edge: #0e1118;
  --ink: #f4efe4;
  --muted: #a9b0c0;
  --gold: #f2c14e;
  --red: #e5533d;
  --green: #5cc27a;
  --blue: #5b9be0;
  --pink: #ff7ab6;
  --pix: "DotGothic16", "Hiragino Sans", "Yu Gothic", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--frame); color: var(--ink); font-family: var(--pix); font-size: 15px; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
[hidden] { display: none !important; }
img.ic { image-rendering: pixelated; image-rendering: crisp-edges; display: block; flex: none; }
#app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.hud { display: grid; gap: 6px; padding-block: 10px 6px; }
.hud-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.money { display: flex; align-items: center; gap: 8px; font-size: 1.7rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.money.fever { color: var(--pink); text-shadow: 0 0 10px rgba(255,122,182,.6); }
.persec { color: var(--green); font-size: .95rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.spacer { flex: 1; }
.chipbtn { font: inherit; color: var(--ink); display: inline-flex; align-items: center; gap: 5px; min-height: 36px; padding: 3px 10px; background: var(--panel-2); border: 2px solid var(--edge); box-shadow: inset 0 -3px 0 rgba(0,0,0,.3); cursor: pointer; font-variant-numeric: tabular-nums; }
.chipbtn:disabled { opacity: .45; cursor: default; }
.chipbtn:active:not(:disabled) { transform: translateY(2px); }
.stat { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.goal { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); }
.goal .bar { flex: 1; height: 10px; background: var(--edge); border: 2px solid var(--panel-2); }
.goal .bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .4s; }
.fevertag { color: var(--pink); font-size: .95rem; }

.stage { position: relative; min-height: 0; display: grid; place-items: center; overflow: hidden; }
#office { image-rendering: pixelated; image-rendering: crisp-edges; display: block; touch-action: manipulation; cursor: pointer; border: 3px solid var(--edge); box-shadow: 0 0 0 2px var(--panel-2); }
.fx { position: fixed; inset: 0; pointer-events: none; z-index: 15; }
.float { position: absolute; font-size: .95rem; color: var(--ink); text-shadow: 0 2px 0 var(--edge), 2px 0 0 var(--edge), -2px 0 0 var(--edge), 0 -2px 0 var(--edge); animation: up .9s ease-out forwards; white-space: nowrap; transform: translateX(-50%); font-variant-numeric: tabular-nums; }
.float.gold { color: var(--gold); font-size: 1.2rem; animation-duration: 1.3s; }
.float.pink { color: var(--pink); font-size: 1.4rem; animation-duration: 1.6s; }
@keyframes up { to { transform: translate(-50%, -44px); opacity: 0; } }
.news { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); max-width: min(92%, 420px); display: flex; align-items: center; gap: 8px; background: var(--panel); border: 2px solid var(--edge); box-shadow: inset 0 0 0 2px var(--panel-2); padding: 6px 12px; font-size: .9rem; z-index: 5; white-space: nowrap; }

.dock { display: flex; justify-content: center; gap: 10px; padding-block: 8px 12px; }
.dock button { position: relative; font: inherit; font-size: .75rem; color: var(--ink); width: 68px; height: 62px; display: grid; place-items: center; align-content: center; gap: 2px; background: var(--panel); border: 2px solid var(--edge); box-shadow: inset 0 0 0 2px var(--panel-2), inset 0 -4px 0 rgba(0,0,0,.3); cursor: pointer; }
.dock .count { position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; padding: 0 5px; background: var(--green); border: 2px solid var(--edge); font-size: .8rem; line-height: 18px; color: var(--edge); }
.dock .count.red { background: var(--gold); }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.back { position: fixed; inset: 0; background: rgba(8,10,14,.45); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; max-height: 74%; overflow-y: auto; background: var(--panel); border-top: 3px solid var(--gold); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px calc(16px + env(safe-area-inset-bottom, 0px)); animation: rise .18s ease-out; }
@keyframes rise { from { transform: translateY(30px); opacity: 0; } }
.sheet-in { max-width: 600px; margin: 0 auto; display: grid; gap: 12px; }
.sheet-close { position: absolute; top: 8px; right: max(12px, env(safe-area-inset-right, 0px)); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; background: var(--edge); font-size: .85rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.good { color: var(--green); }
.pbtn { font: inherit; font-size: .95rem; color: var(--ink); min-height: 44px; padding: 4px 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--panel-2); border: 2px solid var(--edge); box-shadow: inset 0 -4px 0 rgba(0,0,0,.3); cursor: pointer; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pbtn.ok { background: #2f7d4b; }
.pbtn.no { background: #7a3328; }
.pbtn.on { background: var(--gold); color: var(--edge); }
.pbtn:disabled { opacity: .4; cursor: not-allowed; }
.pbtn:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0,0,0,.3); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.tier { display: grid; grid-template-columns: 48px 1fr auto; gap: 6px 10px; align-items: center; background: var(--frame); border: 2px solid var(--edge); padding: 8px 10px; }
.tier.dim { opacity: .45; }
.tier .meta { display: grid; gap: 4px; min-width: 0; }
.tier .meta .nm { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.tier .meta .nm b { font-weight: 400; font-size: 1.1rem; }
.tier .btns { display: grid; gap: 6px; }
.ms { display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); }
.ms .bar { width: 90px; height: 6px; background: var(--edge); }
.ms .bar i { display: block; height: 100%; background: var(--gold); }
.ups { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.up { background: var(--frame); border: 2px solid var(--edge); padding: 10px; display: grid; gap: 6px; justify-items: center; text-align: center; }
.up .x3 { font-size: 1.3rem; color: var(--gold); }
.up .pbtn { width: 100%; }
.big { font-size: 2rem; color: var(--gold); font-variant-numeric: tabular-nums; }
.arrow { color: var(--muted); }
.medals { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.medal { background: var(--frame); border: 2px solid var(--edge); padding: 8px; display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: center; font-size: .8rem; }
.medal.off { opacity: .45; }
.medal b { display: block; font-weight: 400; font-size: .85rem; }
.medal small { color: var(--muted); }
textarea { width: 100%; min-height: 60px; font: 12px ui-monospace, monospace; background: var(--edge); color: var(--ink); border: 2px solid var(--panel-2); padding: 6px; user-select: text; -webkit-user-select: text; }
details summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
.modal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(8,10,14,.7); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.modal .in { background: var(--panel); border: 3px solid var(--gold); padding: 22px; max-width: 380px; width: 100%; display: grid; gap: 14px; justify-items: center; text-align: center; }
.modal h3 { margin: 0; font-weight: 400; font-size: 1.7rem; color: var(--gold); }
@media (max-width: 520px) { .money { font-size: 1.35rem; } .dock button { width: 62px; } .tier { grid-template-columns: 40px 1fr; } .tier .btns { grid-column: 1 / -1; grid-template-columns: 1fr 1fr; } }
@media (prefers-reduced-motion: reduce) { .float, .sheet { animation: none; } .goal .bar i { transition: none; } }


/* 閉じるボタンと中身が重ならないように */
@media (max-width: 720px) { .sheet-in { padding-top: 40px; } }
/* スマホ共通 */
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
button, a, [role=button] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>

<div id="app">
  <header class="hud">
    <div class="hud-row">
      <div class="money" id="moneyBox"><img class="ic" data-ic="coin" width="28" height="28" alt=""><span id="hMoney">0</span></div>
      <span class="persec" id="hPerSec"></span>
      <span class="fevertag" id="hFever" hidden></span>
      <span class="spacer"></span>
      <button class="chipbtn" data-act="ticket" id="ticketBtn" title="時短チケット：10分ぶんの収益をすぐもらう" aria-label="時短チケットを使う"><img class="ic" data-ic="ticket" width="20" height="20" alt=""><b id="hTicket">0</b></button>
      <span class="stat" id="hKnowBox" title="経営ノウハウ（収益アップ）" hidden><img class="ic" data-ic="star" width="20" height="20" alt=""><b id="hKnow">0</b></span>
    </div>
    <div class="goal" title="章の目標（総売上）"><img class="ic" data-ic="flag" width="20" height="20" alt=""><span id="goalCh">1</span><div class="bar"><i id="goalBar"></i></div><span id="goalNext"></span></div>
  </header>
  <div class="stage" id="stage">
    <canvas id="office" width="224" height="192" aria-label="オフィス。デスクをタップすると契約が進む。"></canvas>
    <div class="news" id="news" hidden></div>
  </div>
  <nav class="dock" aria-label="メニュー">
    <button data-act="buy" aria-label="物件と社員"><img class="ic" data-ic="bldg" width="32" height="32" alt="">物件<span class="count" id="cBuy" hidden></span></button>
    <button data-act="ups" aria-label="投資"><img class="ic" data-ic="toolbox" width="32" height="32" alt="">投資<span class="count" id="cUps" hidden></span></button>
    <button data-act="sell" aria-label="会社売却"><img class="ic" data-ic="sold" width="32" height="32" alt="">売却<span class="count red" id="cSell" hidden></span></button>
    <button data-act="records" aria-label="記録"><img class="ic" data-ic="trophy" width="32" height="32" alt="">記録</button>
  </nav>
</div>
<div class="fx" id="fx"></div>
<div id="sheetRoot"></div>
<div id="modalRoot"></div>

<script>
(() => {
'use strict';
// CORE-START
// =============================================================
//  経済コア（画面に依存しない）
// =============================================================
const TIERS = [
  { id: 'room',    name: 'ワンルーム', cost: 4e4,      r: 1.07, rev: 1e4,       time: 0.6,   mgr: 1e7 },
  { id: 'apart',   name: '古アパート', cost: 60e4,     r: 1.15, rev: 60e4,      time: 3,     mgr: 15e7 },
  { id: 'house',   name: '戸建て',     cost: 720e4,    r: 1.14, rev: 540e4,     time: 6,     mgr: 1e9 },
  { id: 'mansion', name: 'マンション', cost: 8640e4,   r: 1.13, rev: 4320e4,    time: 12,    mgr: 5e9 },
  { id: 'bldg',    name: '商業ビル',   cost: 1.0368e9, r: 1.12, rev: 5.184e8,   time: 24,    mgr: 1.2e10 },
  { id: 'hotel',   name: 'ホテル',     cost: 1.24416e10, r: 1.11, rev: 6.2208e9, time: 96,   mgr: 1e11 },
  { id: 'tower',   name: 'タワマン',   cost: 1.49299e11, r: 1.10, rev: 7.46496e10, time: 384, mgr: 1.11e12 },
  { id: 'resort',  name: 'リゾート',   cost: 1.79159e12, r: 1.09, rev: 8.95795e11, time: 1536, mgr: 5.55e12 },
  { id: 'island',  name: '人工島',     cost: 2.14991e13, r: 1.08, rev: 1.07495e13, time: 6144, mgr: 1e14 },
  { id: 'moon',    name: '月面都市',   cost: 2.57989e14, r: 1.07, rev: 2.96687e14, time: 36864, mgr: 1e15 },
];
const SPEED_MS = [25, 50, 100, 200, 300, 400];          // 到達ごとに契約時間が半分
const REV_MS = [500, 600, 700, 800, 900, 1000];         // 到達ごとに収益×3
const CHAPTERS = [
  { goal: 1e10, name: '駅裏の小さな店' },
  { goal: 1e14, name: '街の不動産屋' },
  { goal: 1e18, name: '業界の大手' },
  { goal: 1e24, name: '物件王' },
];
const KNOW_DIV = 1e14;      // 会社売却で得られる経営ノウハウの基準
const KNOW_BONUS = 0.02;    // ノウハウ1つにつき収益+2%
const OFFLINE_MAX = 3600;   // 留守中の進行は最大1時間

// 投資（一度きりのアップグレード）
const UPGRADES = (() => {
  const base = [250e3, 500e3, 1e6, 5e6, 10e6, 25e6, 500e6, 1e9, 5e9, 7e9].map(v => v * 1e4);
  const rounds = [1, 1e3, 1e6, 1e9, 1e12, 1e15];
  const list = [];
  rounds.forEach((k, ri) => {
    base.forEach((c, ti) => list.push({ id: `u${ri}-${ti}`, tier: ti, mult: 3, cost: c * k }));
    list.push({ id: `u${ri}-all`, tier: -1, mult: 3, cost: 1e10 * 1e4 * k });
  });
  return list.sort((a, b) => a.cost - b.cost);
})();

function newCore() {
  return {
    v: 2,
    money: 0, run: 0, total: 0,
    know: 0, knowClaimed: 0,
    tiers: TIERS.map((t, i) => ({ n: i === 0 ? 1 : 0, mgr: false, prog: 0, run: false })),
    ups: {},
    fever: 0, feverMult: 1,
    tickets: 0,
    stats: { taps: 0, events: 0, prestiges: 0, playT: 0, cycles: 0 },
    trophies: {},
    chapter: 0,
    savedAt: Date.now(),
  };
}
function speedSteps(n) { let k = 0; for (const m of SPEED_MS) if (n >= m) k++; return k; }
function nextMilestone(n) { for (const m of [...SPEED_MS, ...REV_MS]) if (n < m) return m; return null; }
function tierTime(S, i) { return TIERS[i].time / Math.pow(2, speedSteps(S.tiers[i].n)); }
function globalMult(S) {
  let m = 1 + KNOW_BONUS * S.know;
  for (const u of UPGRADES) if (u.tier === -1 && S.ups[u.id]) m *= u.mult;
  if (S.fever > 0) m *= S.feverMult;
  return m;
}
function tierMult(S, i) {
  let m = 1;
  for (const u of UPGRADES) if (u.tier === i && S.ups[u.id]) m *= u.mult;
  for (const r of REV_MS) if (S.tiers[i].n >= r) m *= 3;
  return m;
}
function tierRev(S, i) { return TIERS[i].rev * S.tiers[i].n * tierMult(S, i) * globalMult(S); }
function tierPerSec(S, i) { return S.tiers[i].n ? tierRev(S, i) / tierTime(S, i) : 0; }
function incomePerSec(S) { let s = 0; for (let i = 0; i < TIERS.length; i++) if (S.tiers[i].mgr) s += tierPerSec(S, i); return s; }
function costOf(S, i, k) {
  const t = TIERS[i], n = S.tiers[i].n;
  return t.cost * Math.pow(t.r, n) * (Math.pow(t.r, k) - 1) / (t.r - 1);
}
function maxBuy(S, i) {
  const t = TIERS[i], n = S.tiers[i].n;
  const k = Math.floor(Math.log(S.money * (t.r - 1) / (t.cost * Math.pow(t.r, n)) + 1) / Math.log(t.r));
  return Math.max(0, k);
}
function earn(S, v) { S.money += v; S.run += v; S.total += v; }
function buyTier(S, i, k) {
  if (k <= 0) return false;
  const c = costOf(S, i, k);
  if (S.money < c) return false;
  S.money -= c;
  S.tiers[i].n += k;
  return true;
}
function hireMgr(S, i) {
  const T = S.tiers[i];
  if (T.mgr || S.money < TIERS[i].mgr || !T.n) return false;
  S.money -= TIERS[i].mgr;
  T.mgr = true;
  return true;
}
function buyUpgrade(S, id) {
  const u = UPGRADES.find(x => x.id === id);
  if (!u || S.ups[id] || S.money < u.cost) return false;
  S.money -= u.cost;
  S.ups[id] = true;
  return true;
}
// 手動の契約をスタート
function startCycle(S, i) {
  const T = S.tiers[i];
  if (!T.n || T.mgr || T.run) return false;
  T.run = true; T.prog = 0;
  return true;
}
// 社長の手伝い：0.5秒ぶん進める（1回で最大1/4周）
function boostCycle(S, i) {
  const T = S.tiers[i];
  if (!T.n || !(T.mgr || T.run)) return 0;
  const add = Math.min(0.25, 0.5 / tierTime(S, i));
  T.prog += add;
  return add;
}
// 時間を進める。戻り値は各段階で完了した契約数
function step(S, dt) {
  const done = new Array(TIERS.length).fill(0);
  S.stats.playT += dt;
  if (S.fever > 0) S.fever = Math.max(0, S.fever - dt);
  for (let i = 0; i < TIERS.length; i++) {
    const T = S.tiers[i];
    if (!T.n || !(T.mgr || T.run)) continue;
    T.prog += dt / tierTime(S, i);
    if (T.prog >= 1) {
      const c = T.mgr ? Math.floor(T.prog) : 1;
      earn(S, tierRev(S, i) * c);
      done[i] = c;
      S.stats.cycles += c;
      if (T.mgr) T.prog -= c; else { T.prog = 0; T.run = false; }
    }
  }
  while (S.chapter < CHAPTERS.length && S.total >= CHAPTERS[S.chapter].goal) S.chapter++;
  return done;
}
function knowPotential(S) { return Math.floor(150 * Math.sqrt(S.total / KNOW_DIV)); }
function knowGain(S) { return Math.max(0, knowPotential(S) - S.knowClaimed); }
function prestige(S) {
  const g = knowGain(S);
  if (g <= 0) return false;
  S.know += g; S.knowClaimed += g;
  S.money = 0; S.run = 0;
  S.tiers = TIERS.map((t, i) => ({ n: i === 0 ? 1 : 0, mgr: false, prog: 0, run: false }));
  S.ups = {};
  S.fever = 0;
  S.stats.prestiges++;
  return g;
}
function offline(S, sec) {
  const s = Math.min(OFFLINE_MAX, Math.max(0, sec));
  const v = incomePerSec(S) * s;
  earn(S, v);
  while (S.chapter < CHAPTERS.length && S.total >= CHAPTERS[S.chapter].goal) S.chapter++;
  return { sec: s, v };
}
// CORE-END


// =============================================================
//  ユーティリティ
// =============================================================
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const UNITS = [[1e48, '極'], [1e44, '載'], [1e40, '正'], [1e36, '澗'], [1e32, '溝'], [1e28, '穣'], [1e24, '秭'], [1e20, '垓'], [1e16, '京'], [1e12, '兆'], [1e8, '億'], [1e4, '万']];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  const neg = n < 0; n = Math.abs(n);
  let s;
  if (n < 1e4) s = Math.floor(n).toLocaleString('ja-JP');
  else if (n >= 1e52) s = n.toExponential(2);
  else {
    const [u, name] = UNITS.find(([u]) => n >= u);
    const v = n / u;
    s = (v >= 1000 ? Math.floor(v).toLocaleString('ja-JP') : v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2)) + name;
  }
  return (neg ? '−' : '') + s;
}
function fmtTime(sec) {
  if (sec < 1) return sec.toFixed(2) + '秒';
  if (sec < 60) return sec.toFixed(sec < 10 ? 1 : 0) + '秒';
  if (sec < 3600) return Math.floor(sec / 60) + '分';
  return (sec / 3600).toFixed(1) + '時間';
}

// =============================================================
//  ドット絵（コードで描く）
// =============================================================
function px(g, c, x, y, w = 1, h = 1) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function disc(g, c, cx, cy, r) {
  for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++)

const staff = new Map();   // tier -> agent
let customer = null, nextCustomer = rand(40, 80);
function syncStaff(dt, instant) {
  for (let i = 0; i < TIERS.length; i++) {
    const T = S.tiers[i];
    if (T.mgr && !staff.has(i)) {
      const seat = SEAT(i);
      const a = instant ? { x: seat.x, y: seat.y, path: [] } : { x: DOOR.x, y: DOOR.y, path: bfs(DOOR, seat) };
      Object.assign(a, { dir: 'up', anim: 0, moving: false, id: i * 37 + 11 });
      staff.set(i, a);
    }
    if (!T.mgr && staff.has(i)) staff.delete(i);
  }
  for (const a of staff.values()) { if (stepMove(a, dt)) a.dir = 'up'; }
  // 掘り出し物の客
  if (!customer) {
    nextCustomer -= dt;
    if (nextCustomer <= 0) {
      const slot = { x: pick([2, 3, 4, 5, 9, 10, 11]), y: LOBBY_Y };
      customer = { x: DOOR.x, y: DOOR.y, path: bfs(DOOR, slot), dir: 'up', anim: 0, moving: false, stay: 15, leaving: false, id: Math.floor(rand(0, 999)) };
    }
  } else {
    const c = customer;
    const arrived = stepMove(c, dt, c.leaving ? 5 : 3.5);
    if (!c.leaving && arrived) { c.dir = 'down'; c.stay -= dt; if (c.stay <= 0) { c.leaving = true; c.path = bfs(c, DOOR); } }
    if (c.leaving && arrived) { customer = null; nextCustomer = rand(70, 140); }
  }
}

  const c = customer;

  S.stats.events++;

  if (r < 0.5) {
    S.fever = 20; S.feverMult = 7;
    news('fire', 'フィーバー！ 20秒間 収益×7', 3500);
    float(p.cx, p.cy, '×7', 'pink');
  } else if (r < 0.85) {

  }
  // デスク（吹き出し・机・椅子・ゲージのあたり）

    const d = DESKS[i];

    tapDesk(i, cx, cy);

}

    case 'buyTier': {
      const was = S.tiers[i].n, k = +b.dataset.k;
      if (buyTier(S, i, k)) {
        const d = DESKS[i]; burst(d.x * TS + 8, d.y * TS, Math.min(12, 3 + k));
        const nm = [...SPEED_MS, ...REV_MS].find(m => was < m && S.tiers[i].n >= m);
        if (nm) news(SPEED_MS.includes(nm) ? 'clock' : 'coin', `${TIERS[i].name} ${nm}棟！ ${SPEED_MS.includes(nm) ? '速さ×2' : '収益×3'}`);
        checkTrophies();
      }
      renderSheet(); break;
    }
    case 'mgr': if (hireMgr(S, i)) { news('person', `${TIERS[i].name}に社員が来た`); checkTrophies(); } renderSheet(); break;
    case 'up': if (buyUpgrade(S, b.dataset.id)) checkTrophies(); renderSheet(); break;
    case 'prestige':
      if (!sheet.arm) { sheet.arm = true; renderSheet(); break; }
      if (S.fever > 0) S.trophies.fever = S.trophies.fever || Date.now();
      { const g = prestige(S); staff.clear(); closeSheet(); if (g) { news('star', `経営ノウハウ +${fmt(g)}`, 4500); checkTrophies(); save(); } }
      break;
    case 'ticket': {
      if (!S.tickets) break;
      const v = incomePerSec(S) * 600;
      if (!v) break;
      S.tickets--; earn(S, v);
      news('ticket', `10分ぶん +${fmt(v)}`);
      dirty(); break;
    }
    case 'export': $('saveText').value = exportSave(); break;
    case 'copy': {
      const ta = $('saveText'); if (!ta.value) ta.value = exportSave();
      const fb = () => { ta.focus(); ta.select(); news('floppy', '選択したのでコピーしてね'); };
      try { navigator.clipboard.writeText(ta.value).then(() => news('floppy', 'コピーした'), fb); } catch (err) { fb(); }
      break;
    }
    case 'import': importSave($('saveText').value); break;
    case 'reset':
      if (!sheet.arm) { sheet.arm = true; renderSheet(); break; }
      S = newCore(); staff.clear(); customer = null; save(); closeSheet(); news('floppy', '最初からスタート');
      break;
  }
});
addEventListener('keydown', e => { if (e.key === 'Escape' && sheet) closeSheet(); });

// =============================================================
//  章クリア
// =============================================================
let shownChapter = -1;
function checkChapter() {
  if (shownChapter < 0) { shownChapter = S.chapter; return; }
  if (S.chapter > shownChapter) {
    shownChapter = S.chapter;
    checkTrophies();
    const c = CHAPTERS[S.chapter - 1];
    const last = S.chapter >= CHAPTERS.length;
    $('modalRoot').innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="clrT"><div class="in">
      ${ic(last ? 'trophy' : 'flag', 64)}<h3 id="clrT">${last ? 'エンディング' : `第${S.chapter}章クリア`}</h3>
      <div>${esc(c.name)}</div>
      <div class="row" style="justify-content:center;gap:6px"><span class="chip">${ic('clock', 16)}${fmtTime(S.stats.playT)}</span><span class="chip">${ic('coin', 16)}${fmt(S.total)}</span></div>
      <button class="pbtn ok" id="clrOk">${ic('check', 22)}つづける</button></div></div>`;
    $('clrOk').addEventListener('click', () => { $('modalRoot').innerHTML = ''; });
    $('clrOk').focus();
  }
}

// =============================================================
//  セーブ
// =============================================================
function save() { S.savedAt = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function exportSave() { S.savedAt = Date.now(); return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function normalize(data) {
  const s = Object.assign(newCore(), data);
  s.stats = Object.assign(newCore().stats, data.stats || {});
  s.tiers = TIERS.map((t, i) => Object.assign({ n: 0, mgr: false, prog: 0, run: false }, (data.tiers || [])[i] || {}));
  return s;
}
function importSave(text) {
  try {
    const data = JSON.parse(decodeURIComponent(escape(atob(text.trim()))));
    if (!data || data.v !== 2) throw new Error('bad');
    S = normalize(data); staff.clear(); customer = null; shownChapter = -1; syncStaff(0, true); save(); closeSheet(); news('floppy', '読み込んだ');
  } catch (e) { news('cross', '読み込めなかった'); }
}
function load() {
  let data = null;
  try { data = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) {}
  if (data && data.v === 2) {
    S = normalize(data);
    const away = (Date.now() - (S.savedAt || Date.now())) / 1000;
    if (away > 30) {
      const r = offline(S, away);
      if (r.v > 0) setTimeout(() => news('clock', `留守中 ${fmtTime(r.sec)}  +${fmt(r.v)}`, 5000), 300);
    }
  } else S = newCore();
}

// =============================================================
//  ループ
// =============================================================
buildIcons();
load();
syncStaff(0, true);
fitCanvas();
updateLive();
addEventListener('resize', fitCanvas);
if ('ResizeObserver' in window) new ResizeObserver(fitCanvas).observe($('stage'));
let last = performance.now(), saveT = 0, liveT = 0, trophyT = 0, sheetT = 0, held = false;
addEventListener('pointerdown', () => { held = true; }, true);
addEventListener('pointerup', () => { held = false; }, true);
addEventListener('pointercancel', () => { held = false; }, true);
function frame(now) {
  const dt = Math.min(0.25, (now - last) / 1000);
  last = now;
  const done = step(S, dt);
  for (let i = 0; i < done.length; i++) {
    if (!done[i]) continue;
    accum[i] += tierRev(S, i) * done[i];
    if (now - lastFloat[i] > 1100) {
      const d = DESKS[i];
      float(d.x * TS + 8, d.y * TS - 14, '+' + fmt(accum[i]));
      if (tierTime(S, i) >= 0.5) burst(d.x * TS + 8, d.y * TS - 4, 3);
      accum[i] = 0; lastFloat[i] = now;
    }
  }
  syncStaff(dt, false);
  drawOffice(now, dt);
  saveT += dt; liveT += dt; trophyT += dt; sheetT += dt;
  if (trophyT > 1) { checkTrophies(); checkChapter(); trophyT = 0; }
  if (needRender) { if (sheet && sheet.kind !== 'records') renderSheet(); else updateLive(); needRender = false; }
  else if (liveT > 0.25) { updateLive(); liveT = 0; }
  // シートの数字は1秒ごとに作り直す（押している最中は待つ）
  if (sheet && sheet.kind !== 'records' && sheetT > 1 && !held) { renderSheet(); sheetT = 0; }
  if (saveT > 5) { save(); saveT = 0; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);
})();
</script>
</body>
</html>
