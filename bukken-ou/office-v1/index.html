<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>物件王 プロトタイプ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: sticky ledger header (money / goal / tabs) over a grid of property "flyer" cards. Real-estate flyer vernacular: big price type, spec chips, red contract stamp. */
:root {
  --paper: #f3f5f1;
  --card: #ffffff;
  --ink: #1d2733;
  --muted: #5f6a76;
  --line: #d6dbd3;
  --stamp: #cf3b26;
  --profit: #23764e;
  --loss: #b8402e;
  --rare-r: #2f6fb3;
  --rare-sr: #b07d0c;
  --tint: #e8ece4;
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12161b; --card: #1a2027; --ink: #e8ebe5; --muted: #9ba4ad; --line: #2d353e;
    --stamp: #ff6b52; --profit: #4fc28a; --loss: #ff7a63; --rare-r: #6ea8ea; --rare-sr: #e3b544; --tint: #222a32;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12161b; --card: #1a2027; --ink: #e8ebe5; --muted: #9ba4ad; --line: #2d353e;
  --stamp: #ff6b52; --profit: #4fc28a; --loss: #ff7a63; --rare-r: #6ea8ea; --rare-sr: #e3b544; --tint: #222a32;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 14px;
  line-height: 1.55;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card);
}
.wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- header ---------- */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--card);
  border-bottom: 1px solid var(--line);
}
.top .wrap { padding-block: 10px 0; display: grid; gap: 8px; }
.ledger {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 20px;
}
.brand { font-family: var(--display); font-size: 1.1rem; letter-spacing: .04em; margin-right: auto; }
.brand span { color: var(--stamp); }
.stat { display: grid; }
.stat .k { font-size: .7rem; color: var(--muted); letter-spacing: .08em; }
.stat .v { font-family: var(--display); font-size: 1.05rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat.money .v { font-size: 1.5rem; }
.neg { color: var(--loss); }
.goal { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: .78rem; color: var(--muted); }
.goal .bar { height: 6px; background: var(--tint); border-radius: 3px; overflow: hidden; }
.goal .bar i { display: block; height: 100%; background: var(--stamp); width: 0; transition: width .3s; }
.ticker { font-size: .8rem; color: var(--muted); min-height: 1.4em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs button {
  font: inherit; font-weight: 700; color: var(--muted); background: none; border: 0;
  padding: 10px 14px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--stamp); }
.tabs .badge { display: inline-block; min-width: 1.4em; padding: 0 .35em; margin-left: 4px; border-radius: 999px; background: var(--stamp); color: var(--card); font-size: .7rem; line-height: 1.5; }

main .wrap { padding-block: 18px 48px; display: grid; gap: 22px; }
h2 { margin: 0; font-size: 1rem; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
h2 small { font-weight: 400; color: var(--muted); font-size: .8rem; }
.section { display: grid; gap: 12px; }
.empty { padding: 28px 20px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); display: grid; gap: 12px; justify-items: start; }

/* ---------- cards ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); gap: 12px; }
.card {
  position: relative;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px;
  display: grid;
  gap: 8px;
  align-content: start;
  min-width: 0;
}
.flyer-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ptype { font-family: var(--display); font-size: 1.05rem; }
.parea { font-size: .78rem; color: var(--muted); white-space: nowrap; }
.trend-up { color: var(--profit); }
.trend-down { color: var(--loss); }
.specs { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: .72rem; padding: 1px 7px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cond { height: 4px; background: var(--tint); border-radius: 2px; overflow: hidden; }
.cond i { display: block; height: 100%; background: var(--muted); }
.trait { font-size: .8rem; font-weight: 700; }
.trait.unknown { color: var(--muted); font-weight: 400; }
.trait.good { color: var(--profit); }
.trait.bad { color: var(--loss); }
.price { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.price .k { font-size: .72rem; color: var(--muted); }
.price b { font-family: var(--display); font-weight: 400; font-size: 1.45rem; color: var(--stamp); font-variant-numeric: tabular-nums; }
.deal { font-size: .78rem; color: var(--muted); }
.deal em { font-style: normal; font-weight: 700; margin-left: 4px; }
.deal em.cheap { color: var(--profit); }
.deal em.dear { color: var(--loss); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; font-size: .82rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.foot { font-size: .72rem; color: var(--muted); }

.task { display: grid; gap: 6px; padding-top: 4px; border-top: 1px dashed var(--line); }
.tlabel { display: flex; justify-content: space-between; font-size: .8rem; font-weight: 700; }
.tlabel span { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--tint); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--ink); }
.actions { display: grid; gap: 6px; padding-top: 4px; border-top: 1px dashed var(--line); }

button.btn, .btn {
  font: inherit; font-weight: 700; font-size: .85rem;
  color: var(--ink); background: var(--card);
  border: 1px solid var(--ink); border-radius: 7px;
  padding: 8px 12px; cursor: pointer;
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  text-align: left; touch-action: manipulation;
}
.btn small { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.btn.primary { background: var(--ink); color: var(--card); }
.btn.primary small { color: color-mix(in srgb, var(--card) 70%, transparent); }
.btn.work { background: var(--stamp); border-color: var(--stamp); color: #fff; justify-content: center; padding: 10px; user-select: none; -webkit-user-select: none; }
.btn.work small { color: rgba(255,255,255,.8); }
.btn.work:active { transform: scale(.97); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn:focus-visible, .tabs button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--rare-r); outline-offset: 2px; }
.btn.ghost { border-color: var(--line); }
.row-btns { display: flex; flex-wrap: wrap; gap: 6px; }

[hidden] { display: none !important; }
.stamp {
  position: absolute; top: 40px; right: 12px;
  font-family: var(--display); color: var(--stamp);
  border: 2px solid var(--stamp); border-radius: 6px; padding: 0 6px;
  transform: rotate(-8deg); font-size: .8rem; opacity: .9;
}

/* office */
.office { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; }
.office-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.office-canvas { overflow: hidden; border-radius: 6px; background: #3a3530; }
.office canvas { display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 256 / 160; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: manipulation; cursor: pointer; }
.legend { font-size: .78rem; color: var(--muted); }
.btn.on { background: var(--rare-sr); border-color: var(--rare-sr); color: #fff; }

/* staff & upgrades */
.list { display: grid; gap: 8px; }
.item {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
.item .name { font-weight: 700; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.item .desc { font-size: .8rem; color: var(--muted); grid-column: 1; }
.item .btn { grid-row: 1 / span 2; grid-column: 2; }
.rar { font-family: var(--display); font-size: .78rem; padding: 0 6px; border-radius: 4px; border: 1px solid currentColor; }
.rar.N { color: var(--muted); }
.rar.R { color: var(--rare-r); }
.rar.SR { color: var(--rare-sr); }
.lv { font-size: .75rem; color: var(--muted); font-weight: 400; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; }
.field { display: grid; gap: 4px; font-size: .85rem; }
.field label { font-weight: 700; }
select, input[type="number"], textarea {
  font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; max-width: 100%;
}
.check { display: flex; gap: 8px; align-items: center; font-size: .85rem; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stats .stat .v { font-size: 1.15rem; }

/* records */
.trophies { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.trophy { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.trophy .medal { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: .7rem; color: #fff; }
.trophy.locked { opacity: .55; }
.trophy.locked .medal { background: var(--line) !important; color: var(--muted); }
.trophy b { display: block; font-size: .88rem; }
.trophy span { font-size: .75rem; color: var(--muted); }
.medal.bronze { background: #a8693a; }
.medal.silver { background: #8a949e; }
.medal.gold { background: #c49a1c; }
.chart-box { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.chart-box canvas { width: 100%; height: 160px; display: block; }
.log { display: grid; gap: 4px; font-size: .82rem; max-height: 280px; overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.log .d { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 8px; }
textarea { width: 100%; min-height: 70px; font-size: .75rem; font-family: ui-monospace, monospace; }

/* toast & modal */
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 20; max-width: min(340px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: var(--card); border-radius: 10px; padding: 10px 14px; font-size: .85rem; box-shadow: 0 6px 20px rgba(0,0,0,.18); animation: tin .25s ease; }
.toast b { color: var(--rare-sr); }
@keyframes tin { from { transform: translateY(10px); opacity: 0; } }
.pop { position: fixed; pointer-events: none; font-family: var(--display); color: var(--stamp); font-size: 1rem; z-index: 30; animation: pop .6s ease-out forwards; }
@keyframes pop { to { transform: translateY(-36px); opacity: 0; } }
.modal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(10,14,18,.55); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; }
.modal .box { background: var(--card); border-radius: 14px; padding: 24px; max-width: 420px; width: 100%; display: grid; gap: 14px; }
.modal h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.6rem; color: var(--stamp); }
@media (prefers-reduced-motion: reduce) { .toast, .pop { animation: none; } .goal .bar i { transition: none; } }
@media (max-width: 520px) {
  .stat.money .v { font-size: 1.25rem; }
  .brand { width: 100%; }
}

/* スマホ共通 */
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
button, a, [role=button] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="ledger">
      <div class="brand">物件<span>王</span> <small style="font-family:var(--body);font-size:.7rem;color:var(--muted)">プロトタイプ</small></div>
      <div class="stat money"><span class="k">資金</span><span class="v" id="hMoney">0</span></div>
      <div class="stat"><span class="k">総資産</span><span class="v" id="hAssets">0</span></div>
      <div class="stat"><span class="k">信用</span><span class="v" id="hCredit">0</span></div>
      <div class="stat"><span class="k">日付</span><span class="v" id="hDay">1日目</span></div>
    </div>
    <div class="goal"><span id="goalLabel">第1章 目標：総資産 1億円</span><div class="bar"><i id="goalBar"></i></div><span id="goalPct">0%</span></div>
    <div class="ticker" id="ticker"></div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="work" aria-selected="true">業務<span class="badge" id="bWork" hidden></span></button>
      <button role="tab" data-tab="market" aria-selected="false">物件市場</button>
      <button role="tab" data-tab="staff" aria-selected="false">社員</button>
      <button role="tab" data-tab="upgrade" aria-selected="false">効率化</button>
      <button role="tab" data-tab="record" aria-selected="false">記録</button>
    </nav>
  </div>
</header>

<main><div class="wrap" id="view"></div></main>
<div class="toasts" id="toasts"></div>
<div id="modalRoot"></div>

<script>
(() => {
'use strict';
// =============================================================
//  データ定義
// =============================================================
const DAY_SEC = 10;            // ゲーム内1日 = 10秒
const SAVE_KEY = 'bukkenou-proto-v1';
const GOAL_CH1 = 1e8;
const OFFLINE_MAX = 1800;      // 留守中の進行は最大30分

const TYPES = {
  room:    { name: 'ワンルーム',     base: 400e4,  tier: 1.0, credit: 0,  layout: '1K' },
  house:   { name: '戸建て',         base: 1800e4, tier: 1.6, credit: 5,  layout: '3LDK' },
  apart:   { name: 'アパート一棟',   base: 6000e4, tier: 2.4, credit: 15, layout: '8戸' },
  mansion: { name: 'マンション一棟', base: 2.4e8,  tier: 3.5, credit: 35, layout: '24戸' },
};
const AREAS = {
  ura:    { name: '駅裏の下町', mult: 0.85, credit: 0 },
  jutaku: { name: '住宅街',     mult: 1.0,  credit: 8 },
  ekimae: { name: '駅前',       mult: 1.45, credit: 25 },
};
const TRAITS = {
  none:     { name: '特になし',   mult: 1.0,  w: 48 },
  view:     { name: '眺望良し',   mult: 1.2,  w: 10, good: true },
  corner:   { name: '角地',       mult: 1.1,  w: 12, good: true },
  basement: { name: '地下室あり', mult: 1.35, w: 4,  good: true },
  leak:     { name: '雨漏り（リフォームで直る）', mult: 0.75, w: 12, bad: true },
  haunted:  { name: '曰く付き（お祓いで解決）',   mult: 0.45, w: 6,  bad: true },
  rebuild:  { name: '再建築不可', mult: 0.6,  w: 8,  bad: true },
};
const ROLES = {
  appraise: { name: '査定士',   task: '査定' },
  renovate: { name: '内装職人', task: 'リフォーム' },
  sell:     { name: '営業',     task: '販売' },
};
const RARITY = {
  N:  { rate: 0.6, hire: 30e4,  salary: 2e4, w: 70 },
  R:  { rate: 1.0, hire: 90e4,  salary: 4e4, w: 25 },
  SR: { rate: 1.7, hire: 280e4, salary: 8e4, w: 5 },
};
const SEI = ['佐藤','鈴木','高橋','田中','伊藤','渡辺','山本','中村','小林','加藤','吉田','山田','松本','井上','木村','林','清水','山崎','森','池田','橋本','阿部','石川','前田','藤田','岡田','後藤','長谷川','村上','近藤'];
const MEI = ['翔太','美咲','大輝','陽菜','蓮','結衣','颯太','さくら','健一','真由','拓海','七海','悠斗','葵','誠','彩花','直樹','莉子','和也','玲奈','修','千尋','亮','麻衣','剛','楓'];

const UPGRADES = [
  { id: 'tpl',    name: '書類テンプレート', desc: 'クリック1回の作業量 +1', max: 5, cost: l => 50e4 * Math.pow(2.3, l) },
  { id: 'net',    name: '物件情報網',       desc: '市場の掲載数と新着ペースが増える', max: 4, cost: l => 150e4 * Math.pow(2.4, l) },
  { id: 'desk',   name: 'デスク増設',       desc: 'オフィスにデスクを1台追加（雇える人数 +1）', max: 8, cost: l => 100e4 * Math.pow(1.8, l) },
  { id: 'manual', name: '査定マニュアル',   desc: '査定に必要な作業量 -15%', max: 3, cost: l => 120e4 * Math.pow(2.5, l) },
  { id: 'tool',   name: '電動工具',         desc: 'リフォームの作業量 -15%', max: 3, cost: l => 150e4 * Math.pow(2.5, l) },
  { id: 'flyer',  name: 'チラシ広告',       desc: '売値 +4%', max: 5, cost: l => 80e4 * Math.pow(2.2, l) },
  { id: 'train',  name: '社員研修',         desc: '全社員の作業スピード +10%', max: 5, cost: l => 400e4 * Math.pow(2.1, l) },
  { id: 'policy', name: '業務マニュアル',   desc: '査定後の動き（売る・貸す・リフォーム）を社員に任せられる', max: 1, cost: () => 300e4 },
  { id: 'autobuy',name: '仕入れルート開拓', desc: '割安な物件を自動で仕入れられる', max: 1, cost: () => 2000e4, req: 'policy' },
];

const TROPHIES = [
  { id: 'first',    name: '初めての契約',   desc: '最初の物件を売る',                     grade: 'bronze' },
  { id: 'hire',     name: '一人じゃない',   desc: '最初の社員を雇う',                     grade: 'bronze' },
  { id: 'meki',     name: '目利き',         desc: '1件で利益率50%以上を出す',             grade: 'silver' },
  { id: 'team',     name: 'チーム結成',     desc: '社員を5人そろえる',                    grade: 'bronze' },
  { id: 'auto10',   name: '社長はお茶でも', desc: '社長が一度も手伝わずに10件成約する',   grade: 'silver' },
  { id: 'click',    name: '腱鞘炎注意',     desc: '1000回手伝う',                         grade: 'bronze' },
  { id: 'mansion',  name: '大家さん',       desc: '賃貸物件を5件同時に持つ',              grade: 'bronze' },
  { id: 'oharai',   name: 'お祓い済み',     desc: '曰く付き物件を買値の2倍以上で売る',    grade: 'silver', hidden: true },
  { id: 'leak',     name: '雨漏りも個性',   desc: '雨漏り物件を直して利益を出す',         grade: 'bronze', hidden: true },
  { id: 'basement', name: '地下に眠るもの', desc: '地下室あり物件を引き当てる',           grade: 'bronze', hidden: true },
  { id: 'ch1',      name: '物件王への第一歩', desc: '総資産1億円を達成する',             grade: 'gold' },
];

// =============================================================
//  ユーティリティ
// =============================================================
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const wpick = obj => {
  const ents = Object.entries(obj);
  let t = ents.reduce((s, [, v]) => s + v.w, 0) * Math.random();
  for (const [k, v] of ents) { t -= v.w; if (t <= 0) return k; }
  return ents[0][0];
};

function migrate() {

  const want = 2 + lv('desk');
  while (deskCap() < want) {

    if (!spot) break;
    S.office.items.push({ id: 'desk' + S.nextId++, kind: 'desk', x: spot.x, y: spot.y });
  }
  const used = new Set();
  for (const s of S.staff) {

  }
  for (const s of S.staff) if (!s.deskId) s.deskId = freeDesk();
  for (const p of S.props) {

const lv = id => S.up[id] || 0;

function rawValue(p, withTrait = true) {
  const T = TYPES[p.type], A = AREAS[p.area];
  let v = T.base * A.mult * S.trends[p.area] * (0.45 + 0.55 * p.cond / 100) * (1 - p.age * 0.006);
  if (withTrait) v *= TRAITS[p.trait].mult;

}

const renoCost = p => TYPES[p.type].base * AREAS[p.area].mult * 0.06 * (1 + (100 - p.cond) / 100);

  if (S.money < l.ask) return;

    work: 0, workMax: 0, boughtT: S.playT || 0, touched: false, auto,

}

  S.money -= pay;
  // 相場

    let t = S.trends[k] * Math.exp(rand(-0.035, 0.035));
    t += (1 - t) * 0.04;
    S.trends[k] = Math.min(1.8, Math.max(0.6, t));
  }
  if (Math.random() < 0.05) {
    const k = pick(unlockedAreas());
    const up = Math.random() < 0.55;
    S.trends[k] *= up ? 1.22 : 0.82;
    const msg = up ? `ニュース：${AREAS[k].name}に大型商業施設の計画。相場が上昇！` : `ニュース：${AREAS[k].name}の工場が撤退。相場が下落…`;
    log(msg);

  S.listings = S.listings.filter(l => l.expires > S.day);

// =============================================================
//  オフィス（レイアウト・経路探索）
// =============================================================
const GW = 16, GH = 10, TS = 16;
const DOOR = { x: 8, y: 9 }, DOOR_USE = { x: 8, y: 8 };
const KIND = {
  desk:  { w: 1, h: 1, name: 'デスク',       use: true },
  shelf: { w: 1, h: 1, name: '書類棚',       use: true },
  meet:  { w: 2, h: 2, name: '応接テーブル', use: true },
  plant: { w: 1, h: 1, name: '観葉植物',     use: false },
  boss:  { w: 2, h: 1, name: '社長席',       use: false },
};
function defaultOffice() {
  return { items: [
    { id: 'shelf', kind: 'shelf', x: 2, y: 1 },
    { id: 'boss',  kind: 'boss',  x: 7, y: 1 },
    { id: 'meet',  kind: 'meet',  x: 12, y: 2 },
    { id: 'plant1', kind: 'plant', x: 1, y: 7 },
    { id: 'plant2', kind: 'plant', x: 14, y: 7 },
    { id: 'desk1', kind: 'desk', x: 4, y: 4 },
    { id: 'desk2', kind: 'desk', x: 6, y: 4 },
  ] };
}
const itemById = id => S.office.items.find(i => i.id === id);
function useTile(it) {
  const k = KIND[it.kind];
  return k.use ? { x: it.x, y: it.y + k.h } : null;
}
const inside = (x, y) => x >= 1 && x <= GW - 2 && y >= 1 && y <= GH - 2;
function blockMap(items) {
  const m = new Uint8Array(GW * GH);
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) if (!inside(x, y)) m[y * GW + x] = 1;
  for (const it of items) {
    const k = KIND[it.kind];
    for (let dy = 0; dy < k.h; dy++) for (let dx = 0; dx < k.w; dx++) {
      const x = it.x + dx, y = it.y + dy;
      if (x >= 0 && x < GW && y >= 0 && y < GH) m[y * GW + x] = 1;
    }
  }
  return m;
}
let BMAP = null;
function bfs(from, to, map = BMAP) {
  const sx = Math.round(from.x), sy = Math.round(from.y);
  if (sx === to.x && sy === to.y) return [];
  const prev = new Int16Array(GW * GH).fill(-1);
  const start = sy * GW + sx;
  prev[start] = start;
  const q = [start];
  const goal = to.y * GW + to.x;
  while (q.length) {
    const c = q.shift();
    if (c === goal) break;
    const cx = c % GW, cy = (c / GW) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
      const n = ny * GW + nx;
      if (prev[n] !== -1 || map[n]) continue;
      prev[n] = c; q.push(n);
    }
  }
  if (prev[goal] === -1) return null;
  const path = [];
  for (let c = goal; c !== start; c = prev[c]) path.push({ x: c % GW, y: (c / GW) | 0 });
  return path.reverse();
}
function validLayout(items) {
  const m = blockMap(items);
  if (m[DOOR_USE.y * GW + DOOR_USE.x]) return false;
  for (const it of items) {
    const k = KIND[it.kind];
    if (it.x < 1 || it.y < 1 || it.x + k.w - 1 > GW - 2 || it.y + k.h - 1 > GH - 2) return false;
    const u = useTile(it);
    if (u && (!inside(u.x, u.y) || m[u.y * GW + u.x] || !bfs(DOOR_USE, u, m))) return false;
  }
  // 重なりチェック
  const seen = new Set();
  for (const it of items) {
    const k = KIND[it.kind];
    for (let dy = 0; dy < k.h; dy++) for (let dx = 0; dx < k.w; dx++) {
      const key = (it.y + dy) * GW + it.x + dx;
      if (seen.has(key)) return false;
      seen.add(key);
    }
  }
  return true;
}
function findDeskSpot() {
  for (let y = 2; y <= GH - 3; y++) for (let x = 1; x <= GW - 2; x++) {
    const trial = [...S.office.items, { id: '_', kind: 'desk', x, y }];
    if (validLayout(trial)) return { x, y };
  }
  return null;
}
function freeDesk() {
  const used = new Set(S.staff.map(s => s.deskId));
  const d = S.office.items.find(i => i.kind === 'desk' && !used.has(i.id));
  return d ? d.id : null;
}
function locTile(id) {
  const it = itemById(id);
  return it ? useTile(it) : DOOR_USE;
}
function invalidatePaths() {
  BMAP = blockMap(S.office.items);
  for (const a of agents.values()) if (a.target) a.path = bfs(a, a.target) || [];
}

// =============================================================
//  社員エージェント（書類を運ぶ）
// =============================================================
const agents = new Map();
const walkSpeed = () => 3.2 * (1 + 0.05 * lv('train'));
function agentFor(s) {
  let a = agents.get(s.id);
  if (!a) {
    a = { sid: s.id, x: DOOR_USE.x, y: DOOR_USE.y, path: [], target: null, state: 'idle', job: null, dir: 'down', moving: false, anim: 0, hidden: false };
    agents.set(s.id, a);
  }
  return a;
}
function releaseAgent(sid) {
  const a = agents.get(sid);
  if (!a) return;
  if (a.job) {
    const p = S.props.find(x => x.id === a.job.pid);
    if (p) { if (p.carried === sid) { p.carried = null; p.at = 'shelf'; } if (p.claim === sid) p.claim = null; }
  }
  agents.delete(sid);
}
function goTo(a, tile) {
  a.target = tile;
  a.path = bfs(a, tile) || [];
}
function stepMove(a, dt) {
  let dist = walkSpeed() * dt;
  a.moving = false;
  while (dist > 0 && a.path.length) {
    const t = a.path[0];
    const dx = t.x - a.x, dy = t.y - a.y;
    const d = Math.hypot(dx, dy);
    a.moving = true;
    if (Math.abs(dy) > Math.abs(dx)) a.dir = dy < 0 ? 'up' : 'down';
    else if (dx) a.dir = dx < 0 ? 'left' : 'right';
    if (d <= dist) { a.x = t.x; a.y = t.y; a.path.shift(); dist -= d; }
    else { a.x += dx / d * dist; a.y += dy / d * dist; dist = 0; }
  }
  if (a.moving) a.anim += dt;
  return a.path.length === 0 && a.target && Math.round(a.x) === a.target.x && Math.round(a.y) === a.target.y;
}
function dropFile(a, p, at) {
  if (p) { if (p.carried === a.sid) p.carried = null; if (p.claim === a.sid) p.claim = null; p.at = at; p.waitT = 0; }

function updateAgents(dt) {
  if (!BMAP) BMAP = blockMap(S.office.items);
  for (const s of S.staff) {
    const a = agentFor(s);
    const myDesk = s.deskId && itemById(s.deskId) ? s.deskId : null;
    const p = a.job ? S.props.find(x => x.id === a.job.pid) : null;
    const valid = p && p.task === a.job?.task;
    switch (a.state) {
      case 'idle': {
        a.hidden = false;
        // 一番近い書類を探す
        let best = null, bestLen = 1e9;
        for (const q of S.props) {
          if (q.task !== s.role || q.claim || q.carried || !q.at) continue;
          const path = bfs(a, locTile(q.at));
          if (path && path.length < bestLen) { best = q; bestLen = path.length; }
        }
        if (best) {
          best.claim = s.id;
          a.job = { pid: best.id, task: s.role };
          goTo(a, locTile(best.at));
          a.state = 'toPick';
        } else if (myDesk) {
          const t = locTile(myDesk);
          if (!a.target || a.target.x !== t.x || a.target.y !== t.y) goTo(a, t);
          stepMove(a, dt);
          if (!a.moving) a.dir = 'up';
        }
        break;
      }
      case 'toPick': {
        if (!valid) { dropFile(a, p, p ? p.at : null); break; }
        if (stepMove(a, dt)) {
          p.carried = s.id; p.at = null;
          if (s.role === 'renovate') goTo(a, DOOR_USE);
          else if (s.role === 'sell') goTo(a, locTile('meet'));
          else goTo(a, myDesk ? locTile(myDesk) : DOOR_USE);
          a.state = 'toWork';
        }
        break;
      }
      case 'toWork': {
        if (!valid) { dropFile(a, p, myDesk || 'shelf'); break; }
        if (stepMove(a, dt)) {
          a.state = s.role === 'renovate' ? 'offsite' : 'working';
          a.hidden = s.role === 'renovate';
          a.dir = 'up';
        }
        break;
      }
      case 'working':
      case 'offsite': {
        if (!valid) {
          if (a.state === 'offsite' && p) { a.hidden = false; a.state = 'return'; goTo(a, myDesk ? locTile(myDesk) : locTile('shelf')); }
          else dropFile(a, p, myDesk || 'shelf');
          break;
        }
        p.work += staffRate(s) * dt;
        if (p.work >= p.workMax) {
          const task = p.task;
          finishTask(p);
          const still = S.props.includes(p);
          if (!still) { a.job = null; a.state = 'idle'; a.hidden = false; }
          else if (task === 'renovate') { a.hidden = false; a.state = 'return'; goTo(a, myDesk ? locTile(myDesk) : locTile('shelf')); }
          else dropFile(a, p, myDesk || 'shelf');
        }
        break;
      }
      case 'return': {
        if (!p) { a.job = null; a.state = 'idle'; break; }
        if (stepMove(a, dt)) dropFile(a, p, myDesk || 'shelf');
        break;
      }
    }
  }
  // 解雇された社員のエージェントを消す
  for (const sid of [...agents.keys()]) if (!S.staff.some(s => s.id === sid)) releaseAgent(sid);
}
function fileStatus(p) {
  if (p.state !== 'task') return '';
  const a = [...agents.values()].find(x => x.job && x.job.pid === p.id);
  const s = a && S.staff.find(x => x.id === a.sid);
  if (a && s) {
    const n = s.name.split(' ')[0];
    if (a.state === 'toPick') return `${n}さんが書類を取りに向かっている`;
    if (a.state === 'toWork') return `${n}さんが書類を運搬中`;
    if (a.state === 'working') return `${n}さんが${ROLES[s.role].task}中`;
    if (a.state === 'offsite') return `${n}さんが現場でリフォーム中`;
    if (a.state === 'return') return `${n}さんが現場から戻っている`;
  }
  const has = S.staff.some(x => x.role === p.task);
  const where = p.at ? (itemById(p.at)?.kind === 'desk' ? 'デスク' : KIND[itemById(p.at)?.kind]?.name || '書類棚') : '';
  if (!has) return `担当の${ROLES[p.task].name}がいない。社長が手伝おう`;
  return `${where}で待機中（担当者が手いっぱい）`;
}

const LEGS = [['.ppp..ppp.', '.kk....kk.'], ['..pp..ppp.', '..kk...kk.'], ['.ppp..pp..', '.kk...kk..']];
const sprCache = new Map();
function sprite(key, rows, pal) {

  return `<article class="card">

    <div class="flyer-top"><span class="ptype">${T.name}</span><span class="parea">${A.name} ${trendMark(p.area)}</span></div>
    ${specChips(p)}
    ${traitLine(p)}
    <dl class="kv"><dt>仕入れ値</dt><dd>${yen(p.buyPrice)}</dd>${p.spent ? `<dt>追加費用</dt><dd>${yen(p.spent)}</dd>` : ''}<dt>評価額</dt><dd>${val}</dd></dl>
    ${body}
  </article>`;
}

function viewMarket() {
  const ls = S.listings;
  let h = `<section class="section"><h2>物件市場 <small>掲載 ${ls.length}/${maxListings()}件 ・ 毎日${1 + lv('net')}件まで新着</small></h2>`;
  h += `<div class="foot" style="font-size:.8rem">相場目安は見た目からの推定。隠れた特性（当たりもハズレも）は買って査定するまでわからない。</div>`;
  if (!ls.length) h += `<div class="empty">今は掲載がありません。明日また新着が入ります。</div>`;
  else h += `<div class="grid">${ls.map(listingCard).join('')}</div>`;
  const next = unlockNext();
  if (next) h += `<div class="foot" style="font-size:.8rem">次の解放：${next}</div>`;
  h += `</section>`;
  return h;
}
function unlockNext() {
  const items = [];
  for (const [k, a] of Object.entries(AREAS)) if (S.credit < a.credit) items.push({ c: a.credit, t: `信用${a.credit}で「${a.name}」エリア` });
  for (const [k, t] of Object.entries(TYPES)) if (S.credit < t.credit) items.push({ c: t.credit, t: `信用${t.credit}で「${t.name}」` });
  items.sort((a, b) => a.c - b.c);
  return items.length ? items[0].t : '';
}
function listingCard(l) {
  const mid = rawValue(l, false);
  const ratio = l.ask / mid - 1;
  const pct = Math.round(ratio * 100);
  const cls = pct <= -10 ? 'cheap' : pct >= 10 ? 'dear' : '';
  return `<article class="card">
    <div class="flyer-top"><span class="ptype">${TYPES[l.type].name}</span><span class="parea">${AREAS[l.area].name} ${trendMark(l.area)}</span></div>
    ${specChips(l)}
    <div class="price"><span class="k">売主希望</span><b>${yen(l.ask)}</b></div>
    <div class="deal">相場目安 ${yen(mid * 0.88)}〜${yen(mid * 1.12)}<em class="${cls}">${pct > 0 ? '+' : ''}${pct}%</em></div>
    <button class="btn primary" data-act="buy" data-id="${l.id}" data-cost="${l.ask}">購入する <small>${yen(l.ask)}</small></button>
    <div class="foot">掲載あと${Math.max(1, l.expires - S.day)}日</div>
  </article>`;
}

function viewStaff() {
  const cap = deskCap();
  const pay = S.staff.reduce((s, x) => s + x.salary, 0);
  let h = `<section class="section"><h2>社員 <small>席 ${S.staff.length}/${cap} ・ 給料 ${yen(pay)}/日</small></h2>`;
  if (!S.staff.length) h += `<div class="empty">まだ社員がいません。下の応募者から雇うと、その職種の作業を自動でやってくれます。</div>`;
  else h += `<div class="list">${S.staff.map(s => `
    <div class="item">
      <div class="name"><span class="rar ${s.rar}">${s.rar}</span>${esc(s.name)}<span class="lv">${ROLES[s.role].name}</span></div>
      <div class="desc">${ROLES[s.role].task}を ${staffRate(s).toFixed(2)}/秒 ・ 給料 ${yen(s.salary)}/日</div>
      <button class="btn ghost" data-act="fire" data-id="${s.id}">解雇</button>
    </div>`).join('')}</div>`;
  h += `</section>`;
  const full = S.staff.length >= cap;
  h += `<section class="section"><h2>応募者 <small>3日ごとに入れ替わる${full ? ' ・ 席が満員（効率化でデスク増設）' : ''}</small></h2>`;
  h += `<div class="list">${S.cands.map(c => `
    <div class="item">
      <div class="name"><span class="rar ${c.rar}">${c.rar}</span>${esc(c.name)}<span class="lv">${ROLES[c.role].name}</span></div>
      <div class="desc">${ROLES[c.role].task}を ${(RARITY[c.rar].rate * (1 + 0.1 * lv('train'))).toFixed(2)}/秒 ・ 給料 ${yen(c.salary)}/日</div>
      <button class="btn primary" data-act="hire" data-id="${c.id}" ${full ? 'disabled data-lock="1"' : `data-cost="${c.hire}"`}>採用 <small>${yen(c.hire)}</small></button>
    </div>`).join('') || '<div class="empty">今日の応募者は全員採用済み。数日後に新しい応募が来ます。</div>'}</div>`;
  h += `<div class="foot" style="font-size:.8rem">採用面接ミニゲームと人材ガチャは次のステップで追加予定。</div></section>`;
  return h;
}

function viewUpgrade() {
  let h = `<section class="section"><h2>効率化への投資</h2><div class="list">`;
  for (const u of UPGRADES) {
    const l = lv(u.id);
    const maxed = l >= u.max;
    const locked = u.req && !lv(u.req);
    const c = u.cost(l);
    h += `<div class="item">
      <div class="name">${esc(u.name)}${u.max > 1 ? `<span class="lv">Lv ${l}/${u.max}</span>` : maxed ? '<span class="lv">導入済み</span>' : ''}</div>
      <div class="desc">${esc(u.desc)}${locked ? '（業務マニュアルが必要）' : ''}</div>
      ${maxed ? `<button class="btn ghost" disabled data-lock="1">完了</button>` :
        locked ? `<button class="btn" disabled data-lock="1">未解放 <small>${yen(c)}</small></button>` :
        `<button class="btn primary" data-act="upgrade" data-id="${u.id}" data-cost="${c}">導入 <small>${yen(c)}</small></button>`}
    </div>`;
  }
  h += `</div></section>`;

  if (lv('policy')) {
    const P = S.policy;
    h += `<section class="section"><h2>自動方針 <small>社員が査定後にどう動くか</small></h2><div class="panel">
      <div class="field"><label for="pAfter">査定が終わったら</label>
        <select id="pAfter" data-pol="after">
          <option value="manual" ${P.after === 'manual' ? 'selected' : ''}>社長の判断を待つ</option>
          <option value="sell" ${P.after === 'sell' ? 'selected' : ''}>すぐ売りに出す</option>
          <option value="rent" ${P.after === 'rent' ? 'selected' : ''}>賃貸に出す</option>
        </select></div>
      <label class="check"><input type="checkbox" id="pReno" data-pol="reno" ${P.reno ? 'checked' : ''}>状態70%未満と雨漏りは先にリフォームする</label>
      <label class="check"><input type="checkbox" id="pOharai" data-pol="oharai" ${P.oharai ? 'checked' : ''}>曰く付きは自動でお祓いを依頼する</label>
      ${lv('autobuy') ? `
      <label class="check"><input type="checkbox" id="pAuto" data-pol="autobuy" ${P.autobuy ? 'checked' : ''}>割安な物件を自動で仕入れる</label>
      <div class="field"><label for="pLine">自動仕入れの基準</label>
        <select id="pLine" data-pol="line">
          ${[0.95, 0.9, 0.85, 0.8].map(v => `<option value="${v}" ${P.line === v ? 'selected' : ''}>相場目安の${Math.round(v * 100)}%以下</option>`).join('')}
        </select></div>
      <div class="field"><label for="pRes">手元に残しておく資金</label>
        <select id="pRes" data-pol="reserve">
          ${[0, 100e4, 500e4, 2000e4, 1e8].map(v => `<option value="${v}" ${P.reserve === v ? 'selected' : ''}>${v ? yen(v) : 'なし'}</option>`).join('')}
        </select></div>` : ''}
    </div></section>`;
  }

  const ts = S.stats.times;
  const avg = ts.length ? ts.reduce((a, b) => a + b, 0) / ts.length : 0;
  const ratio = S.stats.firstTime && avg ? S.stats.firstTime / avg : 0;
  h += `<section class="section"><h2>効率の記録</h2><div class="stats">
    <div class="stat"><span class="k">1件あたりの処理時間（直近10件）</span><span class="v">${avg ? avg.toFixed(1) + '秒' : '―'}</span></div>
    <div class="stat"><span class="k">最初の1件と比べて</span><span class="v">${ratio ? ratio.toFixed(1) + '倍速' : '―'}</span></div>
    <div class="stat"><span class="k">成約数</span><span class="v">${S.stats.sold}件</span></div>
    <div class="stat"><span class="k">累計利益</span><span class="v ${S.stats.profit < 0 ? 'neg' : ''}">${yen(S.stats.profit)}</span></div>
    <div class="stat"><span class="k">社長が手伝った回数</span><span class="v">${S.stats.clicks.toLocaleString('ja-JP')}回</span></div>
    <div class="stat"><span class="k">全自動で成約</span><span class="v">${S.stats.autoSold}件</span></div>
  </div></section>`;
  return h;
}

function viewRecord() {
  const got = Object.keys(S.trophies).length;
  let h = `<section class="section"><h2>トロフィー <small>${got}/${TROPHIES.length}</small></h2><div class="trophies">`;
  for (const t of TROPHIES) {
    const has = S.trophies[t.id];
    const label = { bronze: '銅', silver: '銀', gold: '金' }[t.grade];
    h += `<div class="trophy ${has ? '' : 'locked'}"><div class="medal ${t.grade}">${label}</div><div>
      <b>${!has && t.hidden ? '？？？' : esc(t.name)}</b>
      <span>${!has && t.hidden ? 'ヒント：変わった物件と向き合ってみよう' : esc(t.desc)}${has ? `（${has}日目）` : ''}</span></div></div>`;
  }
  h += `</div></section>`;
  h += `<section class="section"><h2>総資産の推移</h2><div class="chart-box"><canvas id="chart" height="160"></canvas></div></section>`;
  h += `<section class="section"><h2>できごと</h2><div class="log">${S.log.map(l => `<div><span class="d">${l.d}日目</span>${esc(l.m)}</div>`).join('') || '<div>まだ何も起きていません</div>'}</div></section>`;
  h += `<section class="section"><h2>セーブデータ</h2><div class="panel">
    <div class="foot" style="font-size:.82rem">自動でこのブラウザに保存しています。別の端末に移すときは、書き出した文字をコピーして、移動先で読み込んでください。</div>
    <div class="row-btns"><button class="btn" data-act="export">書き出す</button><button class="btn" data-act="copy">コピー</button></div>
    <textarea id="saveText" aria-label="セーブデータ" placeholder="ここに書き出し／貼り付け"></textarea>
    <div class="row-btns"><button class="btn" data-act="import">貼り付けたデータを読み込む</button>
    <button class="btn ghost" data-act="reset" id="resetBtn">最初からやり直す</button></div>
  </div></section>`;
  return h;
}

function drawChart() {
  const cv = $('chart');
  if (!cv) return;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const w = cv.clientWidth, hgt = 160;
  cv.width = w * dpr; cv.height = hgt * dpr;
  const c = cv.getContext('2d');
  c.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const ink = cs.getPropertyValue('--stamp').trim(), grid = cs.getPropertyValue('--line').trim(), muted = cs.getPropertyValue('--muted').trim();
  const d = S.hist;
  c.font = '11px sans-serif';
  if (d.length < 2) { c.fillStyle = muted; c.fillText('日がたつと推移が表示されます', 8, 20); return; }
  const max = Math.max(...d, 1), padL = 64, padB = 18, padT = 10;
  c.strokeStyle = grid; c.fillStyle = muted; c.lineWidth = 1;
  for (let i = 0; i <= 3; i++) {
    const y = padT + (hgt - padT - padB) * (1 - i / 3);
    c.beginPath(); c.moveTo(padL, y); c.lineTo(w - 8, y); c.stroke();
    c.fillText(yen(max * i / 3), 4, y + 4);
  }
  const X = i => padL + (w - padL - 8) * i / (d.length - 1);
  const Y = v => padT + (hgt - padT - padB) * (1 - v / max);
  c.beginPath(); d.forEach((v, i) => i ? c.lineTo(X(i), Y(v)) : c.moveTo(X(i), Y(v)));
  c.strokeStyle = ink; c.lineWidth = 2; c.stroke();
  c.lineTo(X(d.length - 1), Y(0)); c.lineTo(X(0), Y(0)); c.closePath();
  c.globalAlpha = .12; c.fillStyle = ink; c.fill(); c.globalAlpha = 1;
  c.beginPath(); c.arc(X(d.length - 1), Y(d.at(-1)), 3.5, 0, Math.PI * 2); c.fillStyle = ink; c.fill();
  c.fillStyle = muted; c.fillText(`${S.day - d.length + 1}日目`, padL, hgt - 4);
  c.textAlign = 'right'; c.fillText(`${S.day}日目`, w - 8, hgt - 4);
}

function render() {
  needRender = false;
  const views = { work: viewWork, market: viewMarket, staff: viewStaff, upgrade: viewUpgrade, record: viewRecord };
  const keepText = $('saveText') ? $('saveText').value : '';
  $('view').innerHTML = views[tab]();
  if (tab === 'record') { drawChart(); if (keepText && $('saveText')) $('saveText').value = keepText; }
  updateLive();
}
function updateProg(p) {
  const bar = $('prog-' + p.id), tw = $('tw-' + p.id);
  if (bar) bar.style.width = Math.min(100, p.work / p.workMax * 100) + '%';
  if (tw) tw.textContent = `${p.work.toFixed(1)} / ${p.workMax.toFixed(0)}`;
}
function updateLive() {
  const m = $('hMoney');
  m.textContent = yen(S.money);
  m.classList.toggle('neg', S.money < 0);
  const a = assets();
  $('hAssets').textContent = yen(a);
  $('hCredit').textContent = S.credit;
  $('hDay').textContent = `${S.day}日目`;
  const pct = Math.min(100, a / GOAL_CH1 * 100);
  $('goalBar').style.width = pct + '%';
  $('goalPct').textContent = S.ch1 ? 'クリア' : Math.floor(pct) + '%';
  $('goalLabel').textContent = S.ch1 ? '第1章クリア！ 引き続き会社を大きくしよう' : '第1章 目標：総資産 1億円';
  const waiting = S.props.filter(p => p.state === 'idle').length + S.props.filter(p => p.state === 'task' && !S.staff.some(s => s.role === p.task)).length;
  const b = $('bWork');
  b.hidden = !waiting || tab === 'work';
  b.textContent = waiting;
  for (const p of S.props) if (p.task) {
    updateProg(p);
    const st = $('st-' + p.id);
    if (st) st.textContent = fileStatus(p);
  }
  document.querySelectorAll('[data-cost]').forEach(el => { el.disabled = S.money < +el.dataset.cost; });
}

// =============================================================
//  入力
// =============================================================
function popAt(x, y, text) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const s = document.createElement('span');
  s.className = 'pop'; s.textContent = text;
  s.style.left = (x - 10) + 'px'; s.style.top = (y - 24) + 'px';
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 650);
}
document.addEventListener('pointerdown', e => {
  const w = e.target.closest('[data-work]');
  if (!w) return;
  e.preventDefault();
  doWork(+w.dataset.work, clickPow(), e);
});
document.addEventListener('keydown', e => {
  const w = e.target.closest && e.target.closest('[data-work]');
  if (w && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); const r = w.getBoundingClientRect(); doWork(+w.dataset.work, clickPow(), { clientX: r.left + r.width / 2, clientY: r.top }); }
});
let resetArmed = false;
document.addEventListener('click', e => {
  if (e.target.id === 'office') { officeClick(e); return; }
  const t = e.target.closest('[data-tab]');
  if (t && t.closest('#tabs, [data-act="goto"]')) { setTab(t.dataset.tab); return; }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const id = +b.dataset.id;
  const p = S.props.find(x => x.id === id);
  switch (b.dataset.act) {
    case 'goto': setTab(b.dataset.tab); break;
    case 'edit': editMode = !editMode; officeSel = null; if (!editMode) save(); render(); break;
    case 'buy': buy(id); break;
    case 'sell': if (p) { startTask(p, 'sell'); dirty(); } break;
    case 'reno': if (p) startReno(p); break;
    case 'oharai': if (p) doOharai(p); break;
    case 'rent': if (p) startRent(p); break;
    case 'sellrent': if (p) { startTask(p, 'sell'); dirty(); } break;
    case 'hire': hire(id); break;
    case 'fire': fire(id); break;
    case 'upgrade': buyUpgrade(b.dataset.id); break;
    case 'export': $('saveText').value = exportSave(); break;
    case 'copy': {
      const ta = $('saveText');
      if (!ta.value) ta.value = exportSave();
      const done = () => toast('セーブデータをコピーした');
      const fallback = () => { ta.focus(); ta.select(); toast('選択したので、そのままコピーしてね'); };
      try { navigator.clipboard.writeText(ta.value).then(done, fallback); } catch (err) { fallback(); }
      break;
    }
    case 'import': importSave($('saveText').value); break;
    case 'reset':
      if (!resetArmed) { resetArmed = true; b.innerHTML = 'もう一度押すとリセット'; setTimeout(() => { resetArmed = false; if (b.isConnected) b.innerHTML = '最初からやり直す'; }, 3000); }
      else { resetArmed = false; S = newState(); migrate(); initFresh(); save(); setTab('work'); toast('最初からやり直した'); }
      break;
  }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-pol]');
  if (!el) return;
  const k = el.dataset.pol;
  if (el.type === 'checkbox') S.policy[k] = el.checked;
  else if (k === 'after') S.policy.after = el.value;
  else S.policy[k] = +el.value;
  if (k === 'after' || k === 'reno' || k === 'oharai') S.props.forEach(applyPolicy);
  save();
});
function setTab(t) {
  tab = t;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  render();
  scrollTo({ top: 0 });
}

// =============================================================
//  クリア演出
// =============================================================
function showClear() {
  const root = $('modalRoot');
  root.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="clrT"><div class="box">
    <h3 id="clrT">第1章クリア</h3>
    <div>駅裏の小さな店が、総資産1億円の会社になった。<br>${S.day}日目、成約${S.stats.sold}件、社員${S.staff.length}人。</div>
    <div class="foot" style="font-size:.85rem">プロトタイプはここまで。このまま続けて、全自動化やトロフィー集めもできるよ。</div>
    <button class="btn primary" id="clrOk" style="justify-content:center">続ける</button>
  </div></div>`;
  $('clrOk').addEventListener('click', () => { root.innerHTML = ''; });
  $('clrOk').focus();
}

// =============================================================
//  セーブ／ロード
// =============================================================
function save() {
  S.savedAt = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
}
function exportSave() {
  S.savedAt = Date.now();
  return btoa(unescape(encodeURIComponent(JSON.stringify(S))));
}
function importSave(text) {
  try {
    const data = JSON.parse(decodeURIComponent(escape(atob(text.trim()))));
    if (!data || data.v !== 1) throw new Error('bad');
    S = Object.assign(newState(), data);
    migrate();
    save();
    setTab('work');
    toast('セーブデータを読み込んだ');
  } catch (e) {
    toast('読み込めなかった。書き出した文字を全部貼り付けたか確認してね');
  }
}
function initFresh() {
  refillListings(4);
  // チュートリアル用：最初の1件は必ず割安なワンルーム
  const first = S.listings[0];
  first.type = 'room'; first.area = 'ura'; first.trait = 'none'; first.cond = 72; first.age = 18;
  first.ask = Math.round(rawValue(first) * 0.8 / 1e4) * 1e4;
  S.listings.forEach(l => { if (l.ask > S.money * 1.6) l.ask = Math.round(rawValue(l) * 0.95 / 1e4) * 1e4; });
  refreshCands();
  log('駅裏に小さな不動産屋を開業した');
}
function load() {
  let data = null;
  try { data = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) {}
  if (data && data.v === 1) {
    S = Object.assign(newState(), data);
    migrate();
    const away = Math.min(OFFLINE_MAX, Math.max(0, (Date.now() - (S.savedAt || Date.now())) / 1000));
    if (away > 20) {
      const before = S.money;
      S.simulating = true;
      for (let t = 0; t < away; t++) tick(1);
      S.simulating = false;
      const diff = S.money - before;
      setTimeout(() => toast(`留守中に${Math.round(away / 60)}分ぶん進んだ（資金 ${diff >= 0 ? '+' : ''}${yen(diff)}）`, 5000), 400);
    }
  } else {
    S = newState();
    initFresh();
  }
}

// =============================================================
//  ループ
// =============================================================
load();
render();
let last = performance.now(), saveT = 0, liveT = 0;
function frame(now) {
  const dt = Math.min(0.25, (now - last) / 1000);
  last = now;
  tick(dt);
  saveT += dt; liveT += dt;
  const ae = document.activeElement;
  const editing = ae && $('view').contains(ae) && /^(SELECT|TEXTAREA|INPUT)$/.test(ae.tagName);
  if (needRender && !editing) render();
  else if (liveT > 0.1) { updateLive(); liveT = 0; }
  if (saveT > 5) { save(); saveT = 0; }
  if (tab === 'work') drawOffice(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);
addEventListener('resize', () => { if (tab === 'record') drawChart(); });
})();
</script>
