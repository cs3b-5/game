<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>開封の儀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Bebas+Neue&display=swap">
<style>
/* Layout: a dark card table. HUD on top, the pack (then the card stack) centered, revealed cards line up underneath, pack shop along the bottom. Binder and card inspect are full-screen overlays. */
:root {
  --felt: #12201c;
  --felt-2: #1b2e28;
  --ink: #f2efe8;
  --muted: #9aa8a2;
  --gold: #ffc94a;
  --line: rgba(255,255,255,.12);
  --jp: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --num: "Bebas Neue", "Noto Sans JP", sans-serif;
  --C: #9aa3ad; --U: #5fc27a; --R: #4aa3ff; --SR: #c77dff; --UR: #ffb020; --SEC: #ff4fa0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; color: var(--ink); font-family: var(--jp); background: radial-gradient(1200px 700px at 50% 35%, var(--felt-2), var(--felt) 70%); background-color: var(--felt); overflow: hidden; user-select: none; -webkit-user-select: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* ---------- HUD ---------- */
.top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 18px; padding: 14px 22px; z-index: 5; }
.logo { font-family: var(--jp); font-weight: 900; font-size: 1.35rem; letter-spacing: .04em; }
.logo small { font-family: var(--num); font-weight: 400; color: var(--muted); letter-spacing: .3em; font-size: .9rem; margin-left: 10px; }
.sp { flex: 1; }
.coins { font-family: var(--num); font-size: 1.9rem; letter-spacing: .04em; color: var(--gold); display: flex; align-items: center; gap: 8px; }
.coin { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff2b0, #ffc94a 45%, #b07a10); box-shadow: 0 0 0 2px #7a5208 inset; }
.comp { font-family: var(--num); font-size: 1.3rem; letter-spacing: .05em; color: var(--muted); }
.tbtn { padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.06); font-weight: 700; cursor: pointer; }
.tbtn:hover { background: rgba(255,255,255,.12); }
.tbtn.battle { background: linear-gradient(90deg, #ff3d6a, #ff8a3d); border-color: transparent; color: #fff; }

/* ---------- 台 ---------- */
.stage { position: fixed; inset: 70px 0 150px; display: grid; place-items: center; perspective: 1400px; }
.hint { position: absolute; top: 0; left: 0; right: 0; text-align: center; color: var(--muted); font-size: .95rem; pointer-events: none; }
.hint b { color: var(--ink); }

/* ---------- パック ---------- */
.pack { position: relative; width: 240px; height: 350px; transform-style: preserve-3d; animation: packIn .45s cubic-bezier(.2,1.4,.4,1); }
@keyframes packIn { from { transform: translateY(80px) rotate(-6deg) scale(.8); opacity: 0; } }
.pack .body { position: absolute; inset: 44px 0 0; border-radius: 0 0 14px 14px; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,.55); }
.pack .strip { touch-action: none; position: absolute; left: 0; right: 0; top: 0; height: 46px; border-radius: 14px 14px 0 0; cursor: grab; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.pack .strip:active { cursor: grabbing; }
.pack .crimp { position: absolute; left: 0; right: 0; top: 0; height: 12px; background: repeating-linear-gradient(90deg, rgba(0,0,0,.25) 0 3px, transparent 3px 6px); }
.pack .tearline { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: repeating-linear-gradient(90deg, rgba(255,255,255,.6) 0 6px, transparent 6px 11px); }
.pack .rip { position: absolute; left: 0; bottom: -1px; height: 5px; width: 0; background: #fff; box-shadow: 0 0 12px #fff, 0 0 26px var(--gold); }
.pack .shine { position: absolute; inset: 0; background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,.35) 45%, transparent 60%); mix-blend-mode: overlay; background-size: 250% 100%; animation: sheen 3.2s linear infinite; }
@keyframes sheen { from { background-position: 150% 0; } to { background-position: -100% 0; } }
.pack .face { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 10px; text-align: center; padding: 20px; }
.pack .set { font-family: var(--num); font-size: 1rem; letter-spacing: .35em; opacity: .85; }
.pack .ttl { font-weight: 900; font-size: 1.9rem; line-height: 1.1; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
.pack .kind { font-family: var(--num); font-size: 1.5rem; letter-spacing: .12em; padding: 2px 14px; border: 2px solid currentColor; border-radius: 6px; }
.pack .emb { width: 110px; height: 110px; }
.pack.tearing .strip { animation: none; }
.pack .strip.off { animation: stripOff .6s ease-in forwards; }
@keyframes stripOff { to { transform: translate(140px, -160px) rotate(38deg); opacity: 0; } }
.pack .body.off { animation: bodyOff .5s .15s ease-in forwards; }
@keyframes bodyOff { to { transform: translateY(260px) rotate(4deg); opacity: 0; } }

/* ---------- カード ---------- */
.card { --w: 240px; position: relative; width: var(--w); height: calc(var(--w) * 1.4); font-size: calc(var(--w) / 24); transform-style: preserve-3d; }
.card .inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.3,1.3,.5,1); }
.card.face-down .inner { transform: rotateY(180deg); }
.card .front, .card .back { position: absolute; inset: 0; border-radius: .9em; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 1.2em 2.4em rgba(0,0,0,.5); }
.card .back { transform: rotateY(180deg); background: radial-gradient(circle at 50% 50%, #233a6a, #0d1630 70%); border: .5em solid #0a1024; display: grid; place-items: center; }
.card .back svg { width: 70%; }
.card .front { display: grid; grid-template-rows: auto auto 1fr; border: .5em solid var(--rc); background: var(--rc); }
.card .head { display: flex; align-items: center; gap: .5em; padding: .35em .5em .45em; background: rgba(0,0,0,.25); }
.card .nm { font-weight: 900; font-size: 1.25em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; letter-spacing: .01em; }
.card .el { width: 1.6em; height: 1.6em; border-radius: 50%; display: grid; place-items: center; font-size: .85em; font-weight: 900; color: #fff; box-shadow: 0 0 0 .15em rgba(255,255,255,.6) inset; flex: none; }
.card .art { aspect-ratio: 4 / 3; position: relative; overflow: hidden; background: #000; margin: 0 .35em; border-radius: .25em; }
.card .art img { position: relative; z-index: 1; display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .35s; }
.card .art img.ok { opacity: 1; }
.card .art::before { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, #1a1a22 30%, #2a2a36 50%, #1a1a22 70%); background-size: 300% 100%; animation: load 1.2s linear infinite; }
@keyframes load { to { background-position: -150% 0; } }
.card .tags { display: flex; justify-content: space-between; align-items: center; gap: .4em; font-size: .72em; font-weight: 700; color: #6a645a; }
.card .stats { display: flex; justify-content: flex-end; gap: 1em; font-family: var(--num); font-size: 1.1em; letter-spacing: .05em; color: #4a443a; border-top: 1px solid rgba(0,0,0,.12); padding-top: .2em; }
.card .stats b { font-weight: 400; color: #1a1610; font-size: 1.15em; }
.card .stats.eff { font-family: var(--jp); font-size: .75em; font-weight: 700; letter-spacing: 0; justify-content: flex-start; color: #5a544a; }
.card .ty { padding: .05em .55em; border-radius: .3em; color: #fff; background: #8a6a4a; }
.card .ty-S { background: #2f8a7a; } .card .ty-F { background: #5a6a8a; } .card .ty-I { background: #a0682a; }
.card .foot { display: grid; grid-template-rows: auto 1fr auto auto; gap: .35em; padding: .5em .6em .55em; background: #f4efe2; color: #2a2620; }
.card .txt { font-size: .95em; line-height: 1.5; padding-top: .2em; border-top: 1px solid rgba(0,0,0,.12); }
.card .meta { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--num); letter-spacing: .06em; font-size: 1.05em; color: #6a645a; }
.card .rar { color: var(--rc); font-size: 1.25em; filter: brightness(.85); }
.card .holo { position: absolute; inset: 0; border-radius: .9em; pointer-events: none; mix-blend-mode: color-dodge; opacity: 0; background: linear-gradient(115deg, transparent 15%, rgba(255,80,160,.55) 30%, rgba(255,230,90,.55) 42%, rgba(90,255,180,.55) 54%, rgba(80,170,255,.55) 66%, transparent 82%); background-size: 260% 260%; background-position: var(--hx, 50%) var(--hy, 50%); transition: opacity .3s; }
.card.foil .holo { opacity: .55; }
.card.foil.SEC .holo { background-image: linear-gradient(115deg, transparent 15%, rgba(255,215,120,.8) 35%, rgba(255,255,255,.7) 48%, rgba(255,190,60,.8) 60%, transparent 80%); opacity: .7; }
.card .glare { position: absolute; inset: 0; border-radius: .9em; pointer-events: none; background: radial-gradient(circle at var(--gx, 50%) var(--gy, 30%), rgba(255,255,255,.35), transparent 45%); opacity: 0; transition: opacity .3s; mix-blend-mode: overlay; }
.card.tilt .glare { opacity: 1; }
.card .new { position: absolute; top: -.7em; right: -.7em; z-index: 3; font-family: var(--num); letter-spacing: .08em; font-size: 1.3em; background: #ff3b5c; color: #fff; padding: .1em .55em; border-radius: .4em; transform: rotate(8deg); box-shadow: 0 .3em .8em rgba(0,0,0,.4); }
.card.glow-SR.face-down .back { box-shadow: 0 0 2em .4em var(--SR), 0 1.2em 2.4em rgba(0,0,0,.5); animation: pulse .7s ease-in-out infinite alternate; }
.card.glow-UR.face-down .back { box-shadow: 0 0 2.6em .7em var(--UR), 0 1.2em 2.4em rgba(0,0,0,.5); animation: pulse .5s ease-in-out infinite alternate, quake .12s linear infinite; }
.card.glow-SEC.face-down .back { box-shadow: 0 0 3em 1em var(--SEC), 0 0 6em 1em #fff, 0 1.2em 2.4em rgba(0,0,0,.5); animation: pulse .35s ease-in-out infinite alternate, quake .08s linear infinite; }
@keyframes pulse { to { filter: brightness(1.35); } }
@keyframes quake { 25% { translate: -2px 1px; } 75% { translate: 2px -1px; } }

/* ---------- 山札とめくった列 ---------- */
.deck { position: relative; width: 240px; height: 336px; cursor: pointer; }
.deck .card { position: absolute; left: 0; top: 0; transition: transform .45s cubic-bezier(.3,1.2,.5,1), opacity .3s; }
.row { position: fixed; left: 0; right: 0; bottom: 150px; display: flex; justify-content: center; gap: 12px; pointer-events: none; }
.row .card { --w: 104px; pointer-events: auto; cursor: zoom-in; animation: drop .35s ease-out; }
@keyframes drop { from { transform: translateY(-60px) scale(1.4); opacity: 0; } }
.flash { position: fixed; inset: 0; z-index: 30; pointer-events: none; background: #fff; opacity: 0; }
.flash.go { animation: flash .6s ease-out; }
@keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }
#fx { position: fixed; inset: 0; z-index: 25; pointer-events: none; }
.rlabel { position: fixed; left: 50%; top: 24%; z-index: 26; transform: translateX(-50%); font-family: var(--num); font-size: 4.2rem; letter-spacing: .12em; pointer-events: none; text-shadow: 0 0 24px currentColor; animation: rl 1.2s ease-out forwards; }
@keyframes rl { 0% { transform: translate(-50%, 20px) scale(.6); opacity: 0; } 20% { transform: translate(-50%, 0) scale(1.08); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(-50%, -30px); opacity: 0; } }

/* ---------- ショップ ---------- */
.shop { position: fixed; left: 0; right: 0; bottom: 0; height: 140px; display: flex; justify-content: center; align-items: center; gap: 16px; padding: 0 16px; background: linear-gradient(transparent, rgba(0,0,0,.45)); }
.buy { display: grid; grid-template-columns: 54px auto; gap: 2px 12px; align-items: center; padding: 10px 18px 10px 12px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.06); cursor: pointer; text-align: left; min-width: 210px; }
.buy:hover:not(:disabled) { background: rgba(255,255,255,.12); transform: translateY(-2px); }
.buy:disabled { opacity: .4; cursor: not-allowed; }
.buy .mini { grid-row: 1 / span 2; width: 54px; height: 76px; border-radius: 6px; box-shadow: 0 6px 14px rgba(0,0,0,.4); }
.buy b { font-weight: 900; font-size: 1.05rem; }
.buy span { font-family: var(--num); font-size: 1.35rem; letter-spacing: .05em; color: var(--gold); }
.buy span.free { color: #7be39a; }
.buy small { display: block; font-family: var(--jp); font-size: .75rem; color: var(--muted); letter-spacing: 0; }

/* ---------- 結果 ---------- */
.result { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -62%); z-index: 6; display: grid; gap: 14px; justify-items: center; text-align: center; }
.result h2 { margin: 0; font-weight: 900; font-size: 1.8rem; }
.result .gain { font-family: var(--num); font-size: 1.6rem; letter-spacing: .05em; color: var(--gold); }
.bigbtn { white-space: nowrap; padding: 12px 28px; border: 0; border-radius: 999px; background: var(--gold); color: #1a1408; font-weight: 900; font-size: 1.05rem; cursor: pointer; box-shadow: inset 0 -4px 0 rgba(0,0,0,.2); }
.ghost { white-space: nowrap; padding: 10px 20px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.06); font-weight: 700; cursor: pointer; }

/* ---------- 図鑑・詳しく見る ---------- */
.over { position: fixed; inset: 0; z-index: 20; background: rgba(5,10,9,.86); backdrop-filter: blur(4px); display: grid; grid-template-rows: auto 1fr; }
.over .bar { display: flex; align-items: center; gap: 14px; padding: 16px 22px; flex-wrap: wrap; }
.over h2 { margin: 0; font-weight: 900; font-size: 1.5rem; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-weight: 700; font-size: .85rem; }
.filters button.on { background: var(--ink); color: #111; }
.binder { overflow-y: auto; padding: 8px 22px 40px; display: grid; grid-template-columns: repeat(auto-fill, 120px); gap: 18px 14px; justify-content: center; align-content: start; }
.slot { position: relative; width: 120px; height: 168px; }
.slot .card { --w: 120px; cursor: zoom-in; }
.slot.empty { border-radius: 10px; border: 2px dashed rgba(255,255,255,.14); display: grid; place-items: center; color: rgba(255,255,255,.25); font-family: var(--num); font-size: 1.4rem; letter-spacing: .06em; }
.slot .cnt { position: absolute; right: -6px; bottom: -6px; z-index: 3; font-family: var(--num); font-size: 1rem; background: #000; border: 1px solid var(--line); padding: 0 6px; border-radius: 6px; }
.inspect { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(0,0,0,.7); perspective: 1200px; }
.inspect { touch-action: none; }
.inspect .card { --w: min(380px, 70vh / 1.4, 86vw); }
.inspect .cap { position: absolute; bottom: 24px; left: 0; right: 0; text-align: center; color: var(--muted); font-size: .9rem; }
.toast { position: fixed; left: 50%; top: 76px; transform: translateX(-50%); z-index: 50; background: #000; border: 1px solid var(--line); padding: 10px 18px; border-radius: 10px; font-weight: 700; animation: toast 2.6s ease forwards; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -8px); } 10%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pack, .row .card, .rlabel, .flash.go, .card .inner, .shine { animation: none !important; transition: none !important; } }


/* ---------- スマホ ---------- */
.stage > .pack, .stage > .deck { scale: var(--ps, 1); }
body.mob .top { padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px; gap: 8px; }
body.mob .logo { font-size: 1.05rem; white-space: nowrap; }
body.mob .logo small { display: none; }
body.mob .comp { font-size: 1rem; white-space: nowrap; }
body.mob .coins { font-size: 1.35rem; gap: 5px; }
body.mob .coin { width: 15px; height: 15px; }
body.mob .tbtn { padding: 7px 11px; font-size: .85rem; white-space: nowrap; }
body.mob .stage { inset: var(--topH) 0 var(--stageB); }
body.mob .hint { font-size: .8rem; padding: 0 12px; }
body.mob .row { bottom: var(--rowB); gap: 8px; }
body.mob .row .card { --w: var(--rowW); }
body.mob .row .card .new { font-size: 1.6em; }
body.mob .shop { height: var(--shopH); justify-content: flex-start; overflow-x: auto; overflow-y: hidden; gap: 10px; padding: 0 12px calc(env(safe-area-inset-bottom, 0px)); scroll-snap-type: x mandatory; scrollbar-width: none; background: rgba(0,0,0,.35); }
body.mob .shop::-webkit-scrollbar { display: none; }
body.mob .buy { min-width: 158px; padding: 8px 12px 8px 8px; grid-template-columns: 38px auto; gap: 1px 9px; scroll-snap-align: start; flex: none; }
body.mob .buy .mini { width: 38px; height: 54px; }
body.mob .buy b { font-size: .9rem; white-space: nowrap; }
body.mob .buy span { font-size: 1.15rem; }
body.mob .buy small { font-size: .65rem; }
body.mob.busy .shop { display: none; }
body.mob .result { top: var(--resY); transform: translate(-50%, -50%); gap: 8px; width: calc(100vw - 24px); }
body.mob .result h2 { font-size: 1.25rem; }
body.mob .result .gain { font-size: 1.2rem; }
body.mob .result > div:last-child { flex-wrap: wrap; justify-content: center; }
body.mob .bigbtn { padding: 10px 18px; font-size: .9rem; }
body.mob .ghost { padding: 9px 16px; font-size: .9rem; }
body.mob .rlabel { font-size: 2.4rem; }
body.mob .over .bar { padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; gap: 8px; }
body.mob .over h2 { font-size: 1.2rem; }
body.mob .filters button { padding: 6px 10px; }
body.mob .binder { grid-template-columns: repeat(auto-fill, 100px); gap: 14px 10px; padding: 6px 10px calc(30px + env(safe-area-inset-bottom, 0px)); }
body.mob .slot { width: 100px; height: 140px; }
body.mob .slot .card { --w: 100px; }
body.mob .toast { top: 60px; max-width: calc(100vw - 24px); text-align: center; }
/* スマホ共通 */
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
button, a, [role=button] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<header class="top">
  <div class="logo">開封の儀<small>OPEN THE PACK</small></div>
  <div class="sp"></div>
  <div class="comp" id="comp">0 / 74</div>
  <button class="tbtn" id="binderBtn">図鑑</button>
  <button class="tbtn battle" id="battleBtn">バトル</button>
  <div class="coins"><i class="coin"></i><span id="coins">0</span></div>
</header>

<main class="stage" id="stage"><div class="hint" id="hint"></div></main>
<div class="row" id="row"></div>
<div class="result" id="result" hidden>
  <h2 id="resTitle">開封完了</h2>
  <div class="gain" id="resGain"></div>
  <div style="display:flex;gap:10px"><button class="bigbtn" id="againBtn">同じパックをもう1つ</button><button class="ghost" id="doneBtn">片付ける</button></div>
</div>
<nav class="shop" id="shop"></nav>
<div class="flash" id="flash"></div>
<canvas id="fx"></canvas>

<section class="over" id="binderOv" hidden>
  <div class="bar"><h2>図鑑</h2><span class="comp" id="comp2"></span><div class="filters" id="filters"></div><span class="sp" style="flex:1"></span><button class="ghost" id="closeBinder">閉じる</button></div>
  <div class="binder" id="binder"></div>
</section>
<div class="inspect" id="inspect" hidden><div id="inspectCard"></div><div class="cap">マウスを動かすと傾く・クリックで閉じる</div></div>

<script src="art.js"></script>
<script src="cards.js"></script>
<script src="battle.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// =============================================================
//  カードの一覧（すべてオリジナル）
// =============================================================
const ELEMENTS = [
  { id: 'fire',  nm: '炎', mark: '炎', pre: 'ヒノ', c: '#ff5a2a', bg: ['#ffb36b', '#d9361a'], body: ['#ff8a4a', '#f2c14e', '#e8553a'] },
  { id: 'water', nm: '水', mark: '水', pre: 'ミズ', c: '#2a8cff', bg: ['#9fdcff', '#1f6fd6'], body: ['#6ec3ff', '#9ff4ff', '#4a8cff'] },
  { id: 'leaf',  nm: '森', mark: '森', pre: 'コケ', c: '#2fb35a', bg: ['#c9f2a0', '#2f8a4a'], body: ['#7bd36a', '#c9e86a', '#4fb36a'] },
  { id: 'bolt',  nm: '雷', mark: '雷', pre: 'ビリ', c: '#f2b800', bg: ['#fff3a0', '#e0a000'], body: ['#ffd84a', '#fff07a', '#f2a020'] },
  { id: 'dark',  nm: '闇', mark: '闇', pre: 'ヤミ', c: '#7a4aff', bg: ['#6a4aa0', '#1a1030'], body: ['#8a6ad0', '#5a4a8a', '#c07aff'] },
  { id: 'light', nm: '光', mark: '光', pre: 'キラ', c: '#ff9ad0', bg: ['#fff4fb', '#ffc6e6'], body: ['#fff', '#ffe0f0', '#ffd6a0'] },
];
const RAR = {
  C:   { nm: 'コモン',        sell: 5,    c: '#9aa3ad' },
  U:   { nm: 'アンコモン',    sell: 10,   c: '#5fc27a' },
  R:   { nm: 'レア',          sell: 30,   c: '#4aa3ff' },
  SR:  { nm: 'スーパーレア',  sell: 90,   c: '#c77dff' },

  el.className = 'pack';
  const bg = `linear-gradient(160deg,${p.colors[0]},${p.colors[1]})`;
  el.innerHTML = `<div class="body" style="background:${bg}">${packFace(p)}</div><div class="strip" id="strip" style="background:${bg}"><div class="crimp"></div><div class="tearline"></div><div class="rip" id="rip"></div></div>`;

    const cx = Math.max(-.6, Math.min(1.6, x)), cy = Math.max(-.6, Math.min(1.6, y));
    card.style.transform = `rotateY(${(cx - .5) * strength}deg) rotateX(${(.5 - cy) * strength}deg)`;
    card.style.setProperty('--hx', `${cx * 100}%`); card.style.setProperty('--hy', `${cy * 100}%`);
    card.style.setProperty('--gx', `${cx * 100}%`); card.style.setProperty('--gy', `${cy * 100}%`);
  };
  return onMove;
}
let inspectMove = null;
function inspect(c) {
  $('inspectCard').innerHTML = cardHTML(c);
  const card = $('inspectCard').firstElementChild;
  inspectMove = tiltable(card, 26);
  $('inspect').hidden = false;
  tone(700, .08, 'sine', .03);
}
$('inspect').addEventListener('pointermove', e => { if (inspectMove) inspectMove(e); });
$('inspect').addEventListener('click', () => { $('inspect').hidden = true; inspectMove = null; });

// =============================================================
//  図鑑
// =============================================================
let filter = 'all';
function renderBinder() {
  $('filters').innerHTML = [['all', 'すべて'], ...ELEMENTS.map(e => [e.id, e.nm]), ['SEC', '？']].map(([k, n]) => `<button data-f="${k}" class="${filter === k ? 'on' : ''}">${n}</button>`).join('');
  const list = CARDS.filter(c => filter === 'all' || (filter === 'SEC' ? c.r === 'SEC' : c.el === filter && c.r !== 'SEC'));
  $('binder').innerHTML = list.map(c => S.owned[c.no] ? `<div class="slot" data-no="${c.no}">${cardHTML(c)}${S.owned[c.no] > 1 ? `<span class="cnt">×${S.owned[c.no]}</span>` : ''}</div>` : `<div class="slot empty">${String(c.no).padStart(3, '0')}</div>`).join('');
  $('comp2').textContent = `${ownedKinds()} / ${TOTAL}（${Math.floor(ownedKinds() / TOTAL * 100)}%）`;
}
$('binderBtn').addEventListener('click', () => { filter = 'all'; renderBinder(); $('binderOv').hidden = false; });
$('closeBinder').addEventListener('click', () => { $('binderOv').hidden = true; });
$('filters').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; filter = b.dataset.f; renderBinder(); });
$('binder').addEventListener('click', e => { const s = e.target.closest('.slot[data-no]'); if (s) inspect(CARDS.find(c => c.no === +s.dataset.no)); });

// =============================================================
//  HUD
// =============================================================
function hud() {
  $('coins').textContent = S.coins.toLocaleString('ja-JP');
  $('comp').textContent = `図鑑 ${ownedKinds()} / ${TOTAL}`;
}
hud(); renderShop();
hint(S.opened ? '下からパックを選ぶ' : 'まずは<b>無料パック</b>を開けてみよう');
if (TOUCH) document.querySelector('#inspect .cap').textContent = '指でなぞると傾く・タップで閉じる';
setInterval(() => { if (state === 'idle' || state === 'done') renderShop(); }, 1000);
addEventListener('pagehide', save);
// カードバトル（battle.js）に道具をわたす
window.PackBattle.init({ get S() { return S; }, save, hud, CARDS, ELEMENTS, RAR, inspect, cardHTML, tone, chime, audio, sparkle, toast, esc });
$('battleBtn').addEventListener('click', () => { audio(); window.PackBattle.open(); });
})();
</script>
