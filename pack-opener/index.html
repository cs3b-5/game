<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>けものの星</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Bebas+Neue&display=swap">
<style>
/* Layout: a dark card table. HUD on top, the pack (then the card stack) centered, revealed cards line up underneath, pack shop along the bottom. Binder and card inspect are full-screen overlays. */
:root {
  --felt: #12201c;
  --felt-2: #1b2e28;
  --ink: #f2efe8;
  --muted: #9aa8a2;
  --gold: #ffc94a;
  --line: rgba(255,255,255,.12);
  --jp: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --num: "Bebas Neue", "Noto Sans JP", sans-serif;
  --C: #9aa3ad; --U: #5fc27a; --R: #4aa3ff; --SR: #c77dff; --UR: #ffb020; --SEC: #ff4fa0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; color: var(--ink); font-family: var(--jp); background: radial-gradient(1200px 700px at 50% 35%, var(--felt-2), var(--felt) 70%); background-color: var(--felt); overflow: hidden; user-select: none; -webkit-user-select: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* ---------- HUD ---------- */
.top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 18px; padding: 14px 22px; z-index: 5; }
.logo { font-family: var(--jp); font-weight: 900; font-size: 1.35rem; letter-spacing: .04em; }
.logo small { font-family: var(--num); font-weight: 400; color: var(--muted); letter-spacing: .3em; font-size: .9rem; margin-left: 10px; }
.sp { flex: 1; }
.coins { font-family: var(--num); font-size: 1.9rem; letter-spacing: .04em; color: var(--gold); display: flex; align-items: center; gap: 8px; }
.coin { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff2b0, #ffc94a 45%, #b07a10); box-shadow: 0 0 0 2px #7a5208 inset; }
.comp { font-family: var(--num); font-size: 1.3rem; letter-spacing: .05em; color: var(--muted); }
.tbtn { padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.06); font-weight: 700; cursor: pointer; }
.home { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; color: inherit; font-weight: 700; }
.tbtn.home { padding: 7px 12px; }
.tbtn:hover { background: rgba(255,255,255,.12); }
.tbtn.battle { background: linear-gradient(90deg, #ff3d6a, #ff8a3d); border-color: transparent; color: #fff; }

/* ---------- 台 ---------- */
.stage { position: fixed; inset: 70px 0 150px; display: grid; place-items: center; perspective: 1400px; }
.hint { position: absolute; top: 0; left: 0; right: 0; text-align: center; color: var(--muted); font-size: .95rem; pointer-events: none; }
.hint b { color: var(--ink); }

/* ---------- パック ---------- */
.pack { position: relative; width: 240px; height: 350px; transform-style: preserve-3d; animation: packIn .45s cubic-bezier(.2,1.4,.4,1); }
@keyframes packIn { from { transform: translateY(80px) rotate(-6deg) scale(.8); opacity: 0; } }
.pack .body { position: absolute; inset: 44px 0 0; border-radius: 0 0 14px 14px; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,.55); }
.pack .strip { touch-action: none; position: absolute; left: 0; right: 0; top: 0; height: 46px; border-radius: 14px 14px 0 0; cursor: grab; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.pack .strip:active { cursor: grabbing; }
.pack .crimp { position: absolute; left: 0; right: 0; top: 0; height: 12px; background: repeating-linear-gradient(90deg, rgba(0,0,0,.25) 0 3px, transparent 3px 6px); }
.pack .tearline { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: repeating-linear-gradient(90deg, rgba(255,255,255,.6) 0 6px, transparent 6px 11px); }
.pack .rip { position: absolute; left: 0; bottom: -1px; height: 5px; width: 0; background: #fff; box-shadow: 0 0 12px #fff, 0 0 26px var(--gold); }
.pack .shine { position: absolute; inset: 0; background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,.35) 45%, transparent 60%); mix-blend-mode: overlay; background-size: 250% 100%; animation: sheen 3.2s linear infinite; }
@keyframes sheen { from { background-position: 150% 0; } to { background-position: -100% 0; } }
.pack .face { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 10px; text-align: center; padding: 20px; }
.pack .set { font-family: var(--num); font-size: 1rem; letter-spacing: .35em; opacity: .85; }
.pack .glogo { font-weight: 900; font-size: 2rem; letter-spacing: .08em; line-height: 1; color: #ffe08a; text-shadow: 0 2px 0 #7a4a00, 0 0 14px rgba(255,200,80,.65), 0 4px 10px rgba(0,0,0,.6); -webkit-text-stroke: 1px rgba(90,50,0,.6); }
.pack .ttl { font-weight: 900; font-size: 1.9rem; line-height: 1.1; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
.pack .kind { font-family: var(--num); font-size: 1.5rem; letter-spacing: .12em; padding: 2px 14px; border: 2px solid currentColor; border-radius: 6px; }
.pack .emb { width: 110px; height: 110px; }
.pack.hasArt .emb { display: none; }
.pack.hasArt .face { align-content: space-between; padding: 14px 14px 18px; background: linear-gradient(rgba(0,0,0,.55), transparent 28%, transparent 62%, rgba(0,0,0,.75)); }
.pack .face .ptop, .pack .face .pbot { display: grid; gap: 6px; justify-items: center; }
.pack.hasArt .kind { background: rgba(0,0,0,.45); backdrop-filter: blur(2px); }
.pack.hasArt .set, .pack.hasArt .ttl { text-shadow: 0 0 6px #000, 0 0 12px #000, 0 2px 2px #000; opacity: 1; font-weight: 900; }
.pack.hasArt .strip .crimp { background: repeating-linear-gradient(90deg, rgba(0,0,0,.35) 0 3px, transparent 3px 6px); }
.pack.tearing .strip { animation: none; }
.pack .strip.off { animation: stripOff .6s ease-in forwards; }
@keyframes stripOff { to { transform: translate(140px, -160px) rotate(38deg); opacity: 0; } }
.pack .body.off { animation: bodyOff .5s .15s ease-in forwards; }
@keyframes bodyOff { to { transform: translateY(260px) rotate(4deg); opacity: 0; } }

/* ---------- カード ---------- */
.card { --w: 240px; position: relative; width: var(--w); height: calc(var(--w) * 1.4); font-size: calc(var(--w) / 24); transform-style: preserve-3d; }
.card .inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.3,1.3,.5,1); }
.card.face-down .inner { transform: rotateY(180deg); }
.card .front, .card .back { position: absolute; inset: 0; border-radius: .9em; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 1.2em 2.4em rgba(0,0,0,.5); }
.card .back { transform: rotateY(180deg); background: radial-gradient(circle at 50% 50%, #233a6a, #0d1630 70%); border: .5em solid #0a1024; display: grid; place-items: center; }
.card .back svg { width: 70%; }
.card .front { display: grid; grid-template-rows: auto auto 1fr; border: .5em solid var(--rc); background: var(--rc); }
.card .head { display: flex; align-items: center; gap: .5em; padding: .35em .5em .45em; background: rgba(0,0,0,.25); }
.card .nm { font-weight: 900; font-size: 1.25em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; letter-spacing: .01em; }
.card .el { width: 1.6em; height: 1.6em; border-radius: 50%; display: grid; place-items: center; font-size: .85em; font-weight: 900; color: #fff; box-shadow: 0 0 0 .15em rgba(255,255,255,.6) inset; flex: none; }
.card .art { aspect-ratio: 4 / 3; position: relative; overflow: hidden; background: #000; margin: 0 .35em; border-radius: .25em; }
.card .art img { position: relative; z-index: 1; display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .35s; }
.card .art img.ok { opacity: 1; }
.card .art::before { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, #1a1a22 30%, #2a2a36 50%, #1a1a22 70%); background-size: 300% 100%; animation: load 1.2s linear infinite; }
@keyframes load { to { background-position: -150% 0; } }
.card .tags { display: flex; justify-content: space-between; align-items: center; gap: .4em; font-size: .72em; font-weight: 700; color: #6a645a; }
.card .stats { display: flex; justify-content: flex-end; gap: 1em; font-family: var(--num); font-size: 1.1em; letter-spacing: .05em; color: #4a443a; border-top: 1px solid rgba(0,0,0,.12); padding-top: .2em; }
.card .stats b { font-weight: 400; color: #1a1610; font-size: 1.15em; }
.card .stats .kwi { margin-right: auto; font-family: var(--jp); font-size: .85em; letter-spacing: 0; }
.card .stats.eff { font-family: var(--jp); font-size: .75em; font-weight: 700; letter-spacing: 0; justify-content: flex-start; color: #5a544a; }
.card .ty { padding: .05em .55em; border-radius: .3em; color: #fff; background: #8a6a4a; }
.card .ty-S { background: #2f8a7a; } .card .ty-F { background: #5a6a8a; } .card .ty-I { background: #a0682a; }
.card .foot { display: grid; grid-template-rows: auto 1fr auto auto; gap: .35em; padding: .5em .6em .55em; background: #f4efe2; color: #2a2620; }
.card .txt { font-size: .95em; line-height: 1.5; padding-top: .2em; border-top: 1px solid rgba(0,0,0,.12); }
.card .meta { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--num); letter-spacing: .06em; font-size: 1.05em; color: #6a645a; }
.card .rar { color: var(--rc); font-size: 1.25em; filter: brightness(.85); }
.card .holo { position: absolute; inset: 0; border-radius: .9em; pointer-events: none; mix-blend-mode: color-dodge; opacity: 0; background: linear-gradient(115deg, transparent 15%, rgba(255,80,160,.55) 30%, rgba(255,230,90,.55) 42%, rgba(90,255,180,.55) 54%, rgba(80,170,255,.55) 66%, transparent 82%); background-size: 260% 260%; background-position: var(--hx, 50%) var(--hy, 50%); transition: opacity .3s; }
.card.foil .holo { opacity: .55; }
.card.foil.SEC .holo { background-image: linear-gradient(115deg, transparent 15%, rgba(255,215,120,.8) 35%, rgba(255,255,255,.7) 48%, rgba(255,190,60,.8) 60%, transparent 80%); opacity: .7; }
.card .glare { position: absolute; inset: 0; border-radius: .9em; pointer-events: none; background: radial-gradient(circle at var(--gx, 50%) var(--gy, 30%), rgba(255,255,255,.35), transparent 45%); opacity: 0; transition: opacity .3s; mix-blend-mode: overlay; }
.card.tilt .glare { opacity: 1; }
.card .new { position: absolute; top: -.7em; right: -.7em; z-index: 3; font-family: var(--num); letter-spacing: .08em; font-size: 1.3em; background: #ff3b5c; color: #fff; padding: .1em .55em; border-radius: .4em; transform: rotate(8deg); box-shadow: 0 .3em .8em rgba(0,0,0,.4); }
.card.glow-SR.face-down .back { box-shadow: 0 0 2em .4em var(--SR), 0 1.2em 2.4em rgba(0,0,0,.5); animation: pulse .7s ease-in-out infinite alternate; }
.card.glow-UR.face-down .back { box-shadow: 0 0 2.6em .7em var(--UR), 0 1.2em 2.4em rgba(0,0,0,.5); animation: pulse .5s ease-in-out infinite alternate, quake .12s linear infinite; }
.card.glow-SEC.face-down .back { box-shadow: 0 0 3em 1em var(--SEC), 0 0 6em 1em #fff, 0 1.2em 2.4em rgba(0,0,0,.5); animation: pulse .35s ease-in-out infinite alternate, quake .08s linear infinite; }
@keyframes pulse { to { filter: brightness(1.35); } }
@keyframes quake { 25% { translate: -2px 1px; } 75% { translate: 2px -1px; } }

/* ---------- 山札とめくった列 ---------- */
.deck { position: relative; width: 240px; height: 336px; cursor: pointer; }
.deck .card { position: absolute; left: 0; top: 0; transition: transform .45s cubic-bezier(.3,1.2,.5,1), opacity .3s; }
.row { position: fixed; left: 0; right: 0; bottom: 150px; display: flex; justify-content: center; gap: 12px; pointer-events: none; }
.row .card { --w: 104px; pointer-events: auto; cursor: zoom-in; animation: drop .35s ease-out; }
@keyframes drop { from { transform: translateY(-60px) scale(1.4); opacity: 0; } }
.flash { position: fixed; inset: 0; z-index: 30; pointer-events: none; background: #fff; opacity: 0; }
.flash.go { animation: flash .6s ease-out; }
@keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }
#fx { position: fixed; inset: 0; z-index: 25; pointer-events: none; }
.rlabel { position: fixed; left: 50%; top: 24%; z-index: 26; transform: translateX(-50%); font-family: var(--num); font-size: 4.2rem; letter-spacing: .12em; pointer-events: none; text-shadow: 0 0 24px currentColor; animation: rl 1.2s ease-out forwards; }
@keyframes rl { 0% { transform: translate(-50%, 20px) scale(.6); opacity: 0; } 20% { transform: translate(-50%, 0) scale(1.08); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(-50%, -30px); opacity: 0; } }

/* ---------- ショップ ---------- */
.shop { position: fixed; left: 0; right: 0; bottom: 0; height: 140px; display: flex; justify-content: center; align-items: center; gap: 16px; padding: 0 16px; background: linear-gradient(transparent, rgba(0,0,0,.45)); }
.buy { display: grid; grid-template-columns: 54px auto; gap: 2px 12px; align-items: center; padding: 10px 18px 10px 12px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.06); cursor: pointer; text-align: left; min-width: 210px; }
.buy:hover:not(:disabled) { background: rgba(255,255,255,.12); transform: translateY(-2px); }
.buy:disabled { opacity: .4; cursor: not-allowed; }
.buy .mini { grid-row: 1 / span 2; width: 54px; height: 76px; border-radius: 6px; box-shadow: 0 6px 14px rgba(0,0,0,.4); }
.buy b { font-weight: 900; font-size: 1.05rem; }
.buy span { font-family: var(--num); font-size: 1.35rem; letter-spacing: .05em; color: var(--gold); }
.buy span.free { color: #7be39a; }
.buy small { display: block; font-family: var(--jp); font-size: .75rem; color: var(--muted); letter-spacing: 0; }

/* ---------- 結果 ---------- */
.result { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -62%); z-index: 6; display: grid; gap: 14px; justify-items: center; text-align: center; }
.result h2 { margin: 0; font-weight: 900; font-size: 1.8rem; }
.result .gain { font-family: var(--num); font-size: 1.6rem; letter-spacing: .05em; color: var(--gold); }
.bigbtn { white-space: nowrap; padding: 12px 28px; border: 0; border-radius: 999px; background: var(--gold); color: #1a1408; font-weight: 900; font-size: 1.05rem; cursor: pointer; box-shadow: inset 0 -4px 0 rgba(0,0,0,.2); }
.ghost { white-space: nowrap; padding: 10px 20px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.06); font-weight: 700; cursor: pointer; }

/* ---------- 図鑑・詳しく見る ---------- */
.over { position: fixed; inset: 0; z-index: 20; background: rgba(5,10,9,.86); backdrop-filter: blur(4px); display: grid; grid-template-rows: auto 1fr; }
.over .bar { display: flex; align-items: center; gap: 14px; padding: 16px 22px; flex-wrap: wrap; }
.over h2 { margin: 0; font-weight: 900; font-size: 1.5rem; }
.tbtn.news { position: relative; padding-left: 12px; padding-right: 12px; }
.stackOv { position: fixed; inset: 0; z-index: 22; background: radial-gradient(900px 700px at 50% 45%, #1c2a40, #05080e 75%); display: grid; grid-template-rows: auto 1fr auto; user-select: none; -webkit-user-select: none; cursor: pointer; touch-action: manipulation; }
.stkSkip { padding: 8px 16px; border-radius: 999px; border: 0; background: var(--gold, #ffd25a); color: #241a00; font: inherit; font-weight: 800; font-size: .9rem; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.stkSkip:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.stkTop { display: flex; align-items: center; gap: 8px; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 8px; cursor: default; }
.stkCount { display: flex; gap: 10px; align-items: baseline; font-family: var(--num); font-size: 1.15rem; flex-wrap: wrap; }
.stkCount b { font-size: 1.8rem; color: #fff; }
.stk3dWrap { position: relative; perspective: 1100px; perspective-origin: 50% 20%; display: grid; place-items: center; overflow: hidden; }
.stk3d { position: relative; width: var(--sw); height: calc(var(--sw) * 1.4); transform-style: preserve-3d; --sw: min(250px, 62vw, 44vh); }
.stk3d .card { --w: var(--sw); position: absolute; left: 0; top: 0; transition: transform .35s cubic-bezier(.2,.9,.3,1), opacity .35s; will-change: transform; }
.stk3d .card.face-down .new { display: none; }
.stkPack { position: absolute; left: 50%; top: 50%; width: 240px; height: 350px; transform: translate(-50%, -50%) scale(var(--pks, 1)); z-index: 5; }
.stkPack .pack { animation: packIn .45s cubic-bezier(.2,1.4,.4,1); }
.stkCount .pk { color: #ffe08a; }
.stkCount > span { white-space: nowrap; }
.stkCount b { font-size: 1.5rem; }
@media (max-width: 520px) { .stkTop { flex-wrap: wrap; gap: 6px 8px; } .stkCount { order: 3; width: 100%; font-size: .95rem; gap: 8px; } .stkCount b { font-size: 1.25rem; } .stkTop .ghost { padding: 7px 12px; font-size: .82rem; } .stkSkip { padding: 7px 14px; font-size: .84rem; } }
.stkCount span { font-family: var(--num); }
.stkHint { text-align: center; color: var(--muted); padding: 8px 0 calc(14px + env(safe-area-inset-bottom, 0px)); font-size: .9rem; }
.flipAll { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 3; }
.buy .mini { position: relative; }
.buy .mini .x10 { position: absolute; right: -6px; bottom: -6px; font-style: normal; font-family: var(--num); font-size: .95rem; background: #ff3d6a; color: #fff; border-radius: 999px; padding: 0 6px; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
.bulkWrap { overflow-y: auto; padding: 0 22px 40px; overscroll-behavior: contain; }
.bulkSum { margin: 0 0 14px; line-height: 1.9; font-size: .95rem; }
.bulkSum .nw { color: #7be39a; }
.bulkGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 14px 10px; }
.bulkGrid .card { --w: 118px; cursor: pointer; }
.bulkGrid .bslot2 { display: grid; justify-items: center; }
.tbtn .bell { display: block; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tbtn .ndot { position: absolute; top: -3px; right: -3px; width: 11px; height: 11px; border-radius: 50%; background: #ff3d6a; box-shadow: 0 0 0 2px var(--bg, #0c1412); }
.newsBody { overflow-y: auto; padding: 4px 22px 40px; overscroll-behavior: contain; }
.newsList { display: grid; gap: 12px; max-width: 720px; margin: 0 auto; }
.nItem { display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: center; text-align: left; padding: 10px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.05); cursor: pointer; color: inherit; font: inherit; }
.nItem:hover { background: rgba(255,255,255,.09); }
.nItem img { width: 92px; height: 134px; object-fit: cover; border-radius: 8px; box-shadow: 0 6px 14px rgba(0,0,0,.4); }
.nItem .meta { display: flex; gap: 8px; align-items: center; font-size: .78rem; color: var(--muted); margin-bottom: 6px; }
.nItem .tag, .nArt .tag { font-size: .72rem; font-weight: 900; padding: 2px 8px; border-radius: 999px; background: var(--gold, #ffc94a); color: #2a1a00; }
.nItem .new { font-size: .7rem; font-weight: 900; color: #ff3d6a; }
.nItem b { display: block; font-weight: 900; font-size: 1.05rem; line-height: 1.4; }
.nArt { max-width: 680px; margin: 0 auto; }
.nArt .hero { position: relative; height: min(46vh, 380px); border-radius: 16px; overflow: hidden; background-size: cover; background-position: center 35%; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
.nArt .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 45%, rgba(0,0,0,.85)); }
.nArt .hero .ht { position: absolute; left: 18px; right: 18px; bottom: 16px; z-index: 1; }
.nArt .hero .gl { font-weight: 900; color: #ffe08a; letter-spacing: .08em; text-shadow: 0 2px 0 #7a4a00, 0 0 10px rgba(255,200,80,.6); font-size: .95rem; }
.nArt h3 { margin: 6px 0 0; font-weight: 900; font-size: 1.45rem; line-height: 1.35; text-shadow: 0 2px 6px #000; }
.nArt .meta { display: flex; gap: 8px; align-items: center; font-size: .8rem; color: var(--muted); margin: 14px 0 6px; }
.nArt p { margin: 0 0 1em; line-height: 1.95; font-size: .98rem; color: #e8e4da; }
.nArt p b { color: #ffe08a; }
.nArt .ok { display: block; margin: 20px auto 0; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-weight: 700; font-size: .85rem; }
.filters button.on { background: var(--ink); color: #111; }
.filters .sep { width: 1px; background: var(--line); margin: 2px 4px; }
.binder { overflow-y: auto; padding: 8px 22px 40px; display: grid; grid-template-columns: repeat(auto-fill, 120px); gap: 18px 14px; justify-content: center; align-content: start; }
.slot { position: relative; width: 120px; height: 168px; }
.slot .card { --w: 120px; cursor: zoom-in; }
.slot.empty { border-radius: 10px; border: 2px dashed rgba(255,255,255,.14); display: grid; place-items: center; color: rgba(255,255,255,.25); font-family: var(--num); font-size: 1.4rem; letter-spacing: .06em; }
.slot .cnt { position: absolute; right: -6px; bottom: -6px; z-index: 3; font-family: var(--num); font-size: 1rem; background: #000; border: 1px solid var(--line); padding: 0 6px; border-radius: 6px; }
.inspect { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(0,0,0,.7); perspective: 1200px; }
.inspect { touch-action: none; }
.inspect .card { --w: min(380px, 62vh / 1.4, 86vw); }

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// =============================================================
//  カードの一覧（すべてオリジナル）
// =============================================================
const ELEMENTS = [
  { id: 'fire',  nm: '炎', mark: '炎', pre: 'ヒノ', c: '#ff5a2a', bg: ['#ffb36b', '#d9361a'], body: ['#ff8a4a', '#f2c14e', '#e8553a'] },
  { id: 'water', nm: '水', mark: '水', pre: 'ミズ', c: '#2a8cff', bg: ['#9fdcff', '#1f6fd6'], body: ['#6ec3ff', '#9ff4ff', '#4a8cff'] },
  { id: 'leaf',  nm: '森', mark: '森', pre: 'コケ', c: '#2fb35a', bg: ['#c9f2a0', '#2f8a4a'], body: ['#7bd36a', '#c9e86a', '#4fb36a'] },
  { id: 'bolt',  nm: '雷', mark: '雷', pre: 'ビリ', c: '#f2b800', bg: ['#fff3a0', '#e0a000'], body: ['#ffd84a', '#fff07a', '#f2a020'] },
  { id: 'dark',  nm: '闇', mark: '闇', pre: 'ヤミ', c: '#7a4aff', bg: ['#6a4aa0', '#1a1030'], body: ['#8a6ad0', '#5a4a8a', '#c07aff'] },
  { id: 'light', nm: '光', mark: '光', pre: 'キラ', c: '#ff9ad0', bg: ['#fff4fb', '#ffc6e6'], body: ['#fff', '#ffe0f0', '#ffd6a0'] },
];
const RAR = {
  C:   { nm: 'コモン',        sell: 5,    c: '#9aa3ad' },
  U:   { nm: 'アンコモン',    sell: 10,   c: '#5fc27a' },
  R:   { nm: 'レア',          sell: 30,   c: '#4aa3ff' },
  SR:  { nm: 'スーパーレア',  sell: 90,   c: '#c77dff' },
  UR:  { nm: 'ウルトラレア',  sell: 350,  c: '#ffb020' },
  SEC: { nm: 'シークレット',  sell: 1200, c: '#ff4fa0' },
};
const RORDER = ['C', 'U', 'R', 'SR', 'UR', 'SEC'];
const CARDS = window.CARD_DEFS;
const TOTAL = CARDS.length;
const byRar = r => CARDS.filter(c => c.r === r);

// =============================================================
//  絵（art.js の CardArt で描いて、できたものから差しこむ）
// =============================================================
const EL = id => ELEMENTS.find(e => e.id === id);
const artQueue = [];
let artBusy = false;
function pumpArt() {
  if (artBusy || !artQueue.length) return;
  artBusy = true;
  setTimeout(() => {
    const no = artQueue.shift();
    const c = CARDS[no - 1];
    const url = CardArt.render(c);
    document.querySelectorAll(`img.pic[data-no="${no}"]`).forEach(im => { im.src = url; im.classList.add('ok'); });
    artBusy = false; pumpArt();
  }, 0);
}
function needArt(no, urgent) {
  const i = artQueue.indexOf(no);
  if (i >= 0) { if (!urgent) return; artQueue.splice(i, 1); }
  urgent ? artQueue.unshift(no) : artQueue.push(no);
  pumpArt();
}
function art(c) {
  // Stable Diffusionで描いた絵（images/NNN.jpg）を使う。読めなかったらプログラムの絵に切り替える
  const n = String(c.no).padStart(3, '0');
  return `<img class="pic" data-no="${c.no}" alt="" src="images/${n}.jpg" onload="this.classList.add('ok')" onerror="window.__artFallback(this)">`;
}
window.__artFallback = im => { im.onerror = null; const no = +im.dataset.no; const url = CardArt.cached(no); if (url) { im.src = url; im.classList.add('ok'); } else needArt(no, true); };
const BACK = `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="40" fill="none" stroke="#ffc94a" stroke-width="2"/><circle cx="50" cy="50" r="31" fill="none" stroke="#ffc94a" stroke-width="1" stroke-dasharray="2 3"/><path d="M50 18 L56 44 L82 50 L56 56 L50 82 L44 56 L18 50 L44 44Z" fill="#ffc94a"/><circle cx="50" cy="50" r="6" fill="#0d1630" stroke="#ffc94a" stroke-width="2"/></svg>`;
const BASE = { C: 600, U: 1000, R: 1500, SR: 2100, UR: 2800, SEC: 3500 };
const EFFECT = { S: '効果：場のモンスター全員に力をあたえる', F: '効果：同じ属性のモンスターが元気になる', I: '効果：持たせたモンスターが強くなる' };
function stats(c) {
  // バトルと同じ数字・効果を出す（battle.js が読めないときは昔の表示）
  const PB = window.PackBattle;
  if (c.type !== 'M') return `<div class="stats eff">${PB && PB.shortText ? esc(PB.shortText(c)) : EFFECT[c.type]}</div>`;
  if (PB && PB.power) { const p = PB.power(c), kw = PB.kwIcons(c); return `<div class="stats">${kw ? `<span class="kwi">${kw}</span>` : ''}<span>ATK <b>${p.atk}</b></span><span>HP <b>${p.hp}</b></span></div>`; }
  const b = BASE[c.r], a = b + (c.seed % 9) * 50, d = b - 200 + (Math.floor(c.seed / 9) % 9) * 50;
  return `<div class="stats"><span>ATK <b>${a}</b></span><span>DEF <b>${d}</b></span></div>`;
}
function cardHTML(c, opts = {}) {
  const el = EL(c.el), r = RAR[c.r];
  const foil = ['SR', 'UR', 'SEC'].includes(c.r);
  return `<div class="card ${opts.down ? 'face-down' : ''} ${foil ? 'foil' : ''} ${c.r} ${opts.glow ? 'glow-' + c.r : ''}" data-no="${c.no}" style="--rc:${c.r === 'SEC' ? 'linear-gradient(135deg,#ffe9a8,#ff9ad0,#9ff4ff)' : r.c}">
    ${opts.isNew ? '<div class="new">NEW</div>' : ''}
    <div class="inner">
      <div class="front" style="${c.r === 'SEC' ? 'border-image: linear-gradient(135deg,#ffe9a8,#ff9ad0,#9ff4ff) 1; background:#ffe9a8;' : ''}">
        <div class="head"><div class="nm">${esc(c.nm)}</div><div class="el" style="background:${el.c}">${el.mark}</div></div>
        <div class="art">${art(c)}</div>
        <div class="foot"><div class="tags"><span class="ty ty-${c.type}">${c.typeNm}</span><span class="st">画風：${CardArt.STYLE_NAMES[c.style]}</span></div><div class="txt">${esc(c.txt)}</div>${stats(c)}<div class="meta"><span>NO.${String(c.no).padStart(3, '0')}/${TOTAL}</span><span class="rar" style="color:${r.c}">${c.r}</span></div></div>
        <div class="holo"></div><div class="glare"></div>
      </div>
      <div class="back">${BACK}</div>
    </div>
  </div>`;
}

// =============================================================
//  パックの種類と排出率
// =============================================================
// 第一弾・第二弾のパック（確率は同じ。5枚目はR以上）
const BULK = 10;   // まとめて開けるパックの数
const RATES = { C: 60, U: 27, R: 10, SR: 2.5, UR: .45, SEC: .05 }, LAST = { R: 80, SR: 16, UR: 3.5, SEC: .5 };
const PACKS = [
  { id: 'set1', set: 1, nm: '第一弾パック', title: '', price: 100, colors: ['#2a8cff', '#1a3a8a'], img: 'images/pack1.jpg', mini: 'images/mini_pack1.jpg', rates: RATES, last: LAST, sub: '5枚・最後の1枚はレア以上' },
  { id: 'set2', set: 2, nm: '第二弾パック', title: '夜汽車と異界の駅', price: 100, colors: ['#3a2a6a', '#0a0a1e'], img: 'images/pack2.jpg', mini: 'images/mini_pack2.jpg', rates: RATES, last: LAST, sub: '5枚・最後の1枚はレア以上' },
  { id: 'set3', set: 3, nm: '第三弾パック', title: '成長と進化', price: 100, colors: ['#2a8a4a', '#0a2a14'], img: 'images/pack3.jpg', mini: 'images/mini_pack3.jpg', rates: RATES, last: LAST, sub: '5枚・最後の1枚はレア以上' },
];
const FREE_EVERY = 180;  // 無料パックは3分ごとに1つ（最大3つ）
function roll(rates) {
  let t = Object.values(rates).reduce((a, b) => a + b, 0) * Math.random();
  for (const [k, v] of Object.entries(rates)) { t -= v; if (t <= 0) return k; }
  return Object.keys(rates)[0];
}
function makePack(p) {
  const out = [];
  for (let i = 0; i < 5; i++) { const r = roll(i === 4 ? p.last : p.rates); const pool = byRar(r).filter(c => c.set === p.set); out.push(pool[Math.floor(Math.random() * pool.length)]); }
  return out;
}

// =============================================================
//  セーブ
// =============================================================
const KEY = 'pack-opener-v1';
let S = { coins: 1000, owned: {}, opened: 0, free: 1, freeAt: Date.now(), bonus: {} };
try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d) S = Object.assign(S, d); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const ownedKinds = () => Object.keys(S.owned).filter(k => S.owned[k] > 0).length;
function tickFree() {
  const now = Date.now();
  while (S.free < 3 && now - S.freeAt >= FREE_EVERY * 1000) { S.free++; S.freeAt += FREE_EVERY * 1000; }
  if (S.free >= 3) S.freeAt = now;
}

// =============================================================
//  音
// =============================================================
let AC = null;
function audio() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} }
function tone(f, d = .1, type = 'triangle', v = .05, slide = 0, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02);
}
function crinkle(v = .05) {
  if (!AC) return;
  const len = AC.sampleRate * .05, b = AC.createBuffer(1, len, AC.sampleRate), a = b.getChannelData(0);
  for (let i = 0; i < len; i++) a[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = b; f.type = 'highpass'; f.frequency.value = 2500 + Math.random() * 3000; g.gain.value = v;
  s.connect(f).connect(g).connect(AC.destination); s.start();
}
const CHIME = { C: [660], U: [660, 880], R: [660, 880, 1100], SR: [523, 659, 784, 1047], UR: [523, 659, 784, 1047, 1319], SEC: [392, 523, 659, 784, 1047, 1319, 1568] };
function chime(r) { CHIME[r].forEach((f, i) => tone(f, .25, r === 'SEC' || r === 'UR' ? 'sine' : 'triangle', .05, 0, i * .07)); }

// =============================================================
//  紙ふぶき・きらきら
// =============================================================
const fx = $('fx'), gx = fx.getContext('2d');
let P = [];
function fit() { fx.width = innerWidth; fx.height = innerHeight; }
addEventListener('resize', fit); fit();
function sparkle(x, y, color, n = 40, power = 8) {
  if (reduce) return;
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = Math.random() * power + 2; P.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 3, t: 0, life: 50 + Math.random() * 40, c: Array.isArray(color) ? color[i % color.length] : color, r: Math.random() * 3 + 2, rot: Math.random() * 6 }); }
}
function stepFx() {
  gx.clearRect(0, 0, fx.width, fx.height);
  P = P.filter(p => p.t < p.life);
  for (const p of P) {
    p.t++; p.vy += .18; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += .2;
    gx.globalAlpha = 1 - p.t / p.life; gx.fillStyle = p.c;
    gx.save(); gx.translate(p.x, p.y); gx.rotate(p.rot); gx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); gx.restore();
  }
  gx.globalAlpha = 1;
  requestAnimationFrame(stepFx);
}
requestAnimationFrame(stepFx);


// =============================================================
//  画面の大きさに合わせる（スマホ）
// =============================================================
const TOUCH = matchMedia('(pointer: coarse)').matches;
const T = (pc, sp) => TOUCH ? sp : pc;
function layout() {
  const W = innerWidth, H = innerHeight, mob = W < 760 || H < 600;
  document.body.classList.toggle('mob', mob);
  const busy = state !== 'idle';
  document.body.classList.toggle('busy', busy);
  const st = document.documentElement.style;
  if (!mob) { $('stage').style.removeProperty('--ps'); return; }
  const topH = 50, shopH = busy ? 0 : 92;
  const avail = H - topH - shopH;
  const rowW = Math.max(52, Math.min(104, Math.floor((W - 24 - 4 * 8) / 5), Math.floor(avail * .3 / 1.4)));
  const rowH = (state === 'deck' || state === 'done' || state === 'tearing') ? rowW * 1.4 + 14 : 0;
  const stageH = avail - rowH;
  st.setProperty('--topH', topH + 'px'); st.setProperty('--shopH', shopH + 'px');

$('doneBtn').addEventListener('click', () => { $('result').hidden = true; $('row').innerHTML = ''; state = 'idle'; hint('下からパックを選ぶ'); renderShop(); });
addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && STK) { e.preventDefault(); stackNext(); return; }
  if (e.key === ' ' && state === 'deck') { e.preventDefault(); const d = document.querySelector('.deck'); if (d) flipNext(d); }
  if (e.key === 'Escape') { $('inspect').hidden = true; $('binderOv').hidden = true; $('bulkOv').hidden = true; $('newsOv').hidden = true; }
});
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2700); }

// =============================================================
//  傾き・ホロ
// =============================================================
function tiltable(card, strength = 18) {
  card.classList.add('tilt');
  const onMove = e => {
    const r = card.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    const cx = Math.max(-.6, Math.min(1.6, x)), cy = Math.max(-.6, Math.min(1.6, y));
    card.style.transform = `rotateY(${(cx - .5) * strength}deg) rotateX(${(.5 - cy) * strength}deg)`;
    card.style.setProperty('--hx', `${cx * 100}%`); card.style.setProperty('--hy', `${cy * 100}%`);
    card.style.setProperty('--gx', `${cx * 100}%`); card.style.setProperty('--gy', `${cy * 100}%`);
  };
  return onMove;
}
let inspectMove = null;
function inspect(c) {
  $('inspectCard').innerHTML = cardHTML(c);
  $('inspectRule').innerHTML = window.PackBattle && window.PackBattle.battleText ? '<b>バトルでの効果</b>\n' + esc(window.PackBattle.battleText(c)) : '';
  const card = $('inspectCard').firstElementChild;
  inspectMove = tiltable(card, 26);
  $('inspect').hidden = false;
  tone(700, .08, 'sine', .03);
}
$('inspect').addEventListener('pointermove', e => { if (inspectMove) inspectMove(e); });
$('inspect').addEventListener('click', () => { $('inspect').hidden = true; inspectMove = null; });

// =============================================================
//  図鑑
// =============================================================
let filter = 'all', binSet = 's1';
function renderBinder() {
  $('filters').innerHTML = [['s1', '第一弾'], ['s2', '第二弾'], ['s3', '第三弾']].map(([k, n]) => `<button data-s="${k}" class="${binSet === k ? 'on' : ''}">${n}</button>`).join('') + '<span class="sep"></span>'
    + [['all', 'すべて'], ...ELEMENTS.map(e => [e.id, e.nm]), ['SEC', '？']].map(([k, n]) => `<button data-f="${k}" class="${filter === k ? 'on' : ''}">${n}</button>`).join('');
  const set = +binSet.slice(1) || 1;
  const list = CARDS.filter(c => c.set === set && (filter === 'all' || (filter === 'SEC' ? c.r === 'SEC' : c.el === filter && c.r !== 'SEC')));
  const inSet = CARDS.filter(c => c.set === set), got = inSet.filter(c => S.owned[c.no]).length;
  $('binder').innerHTML = list.map(c => S.owned[c.no] ? `<div class="slot" data-no="${c.no}">${cardHTML(c)}${S.owned[c.no] > 1 ? `<span class="cnt">×${S.owned[c.no]}</span>` : ''}</div>` : `<div class="slot empty">${String(c.no).padStart(3, '0')}</div>`).join('');
  $('comp2').textContent = `第${set}弾 ${got} / ${inSet.length}・全体 ${ownedKinds()} / ${TOTAL}`;
}
// =============================================================
//  お知らせ
// =============================================================
const NEWS = window.NEWS || [];
const newsHTML = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const unreadNews = () => NEWS.filter(n => !(S.newsRead || []).includes(n.id));
function newsDot() { $('newsDot').hidden = !unreadNews().length; }
function openNews(id) {
  $('newsOv').hidden = false;
  if (!id) {
    $('newsBack').hidden = true;
    $('newsBody').innerHTML = `<div class="newsList">${NEWS.map(n => `<button class="nItem" data-id="${n.id}">${n.img ? `<img src="${n.img}" alt="">` : '<span></span>'}<span><span class="meta"><span class="tag">${esc(n.tag)}</span>${esc(n.date.replace(/-/g, '.'))}${(S.newsRead || []).includes(n.id) ? '' : '<span class="new">NEW</span>'}</span><b>${esc(n.title)}</b></span></button>`).join('')}</div>`;
  } else {
    const n = NEWS.find(x => x.id === id); if (!n) return openNews();
    $('newsBack').hidden = false;
    $('newsBody').innerHTML = `<article class="nArt">${n.img ? `<div class="hero" style="background-image:url(${n.img})"><div class="ht"><div class="gl">けものの星</div><h3>${esc(n.title)}</h3></div></div>` : `<h3>${esc(n.title)}</h3>`}
      <div class="meta"><span class="tag">${esc(n.tag)}</span>${esc(n.date.replace(/-/g, '.'))}</div>${n.body.map(p => `<p>${newsHTML(p)}</p>`).join('')}
      <button class="bigbtn ok" id="newsOk">${unreadNews().filter(x => x.id !== id).length ? '次のお知らせへ' : 'とじる'}</button></article>`;
    S.newsRead = [...new Set([...(S.newsRead || []), id])]; save(); newsDot();
    $('newsBody').scrollTop = 0;
    $('newsOk').onclick = () => { const u2 = unreadNews(), next = u2[u2.length - 1]; if (next) openNews(next.id); else $('newsOv').hidden = true; };
  }
}
$('newsBtn').addEventListener('click', () => { audio(); openNews(); });
$('closeNews').addEventListener('click', () => { $('newsOv').hidden = true; });
$('newsBack').addEventListener('click', () => openNews());
$('newsBody').addEventListener('click', e => { const b = e.target.closest('.nItem'); if (b) openNews(b.dataset.id); });
newsDot();
// 読んでいないお知らせがあれば、はじめに1回だけ出す（古い順：リリース→第二弾）
setTimeout(() => { const u = unreadNews(); if (u.length && $('newsOv').hidden) openNews(u[u.length - 1].id); }, 500);

$('binderBtn').addEventListener('click', () => { filter = 'all'; renderBinder(); $('binderOv').hidden = false; });
$('closeBinder').addEventListener('click', () => { $('binderOv').hidden = true; });
$('filters').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.s) binSet = b.dataset.s; else filter = b.dataset.f; renderBinder(); });
$('binder').addEventListener('click', e => { const s = e.target.closest('.slot[data-no]'); if (s) inspect(CARDS.find(c => c.no === +s.dataset.no)); });

// =============================================================
//  HUD
// =============================================================
function hud() {
  $('coins').textContent = S.coins.toLocaleString('ja-JP');
  $('comp').textContent = `図鑑 ${ownedKinds()} / ${TOTAL}`;
}
hud(); renderShop();
hint(S.opened ? '下からパックを選ぶ' : 'まずは<b>無料パック</b>を開けてみよう');
if (TOUCH) document.querySelector('#inspect .cap').textContent = '指でなぞると傾く・タップで閉じる';
setInterval(() => { if (state === 'idle' || state === 'done') renderShop(); }, 1000);
addEventListener('pagehide', save);
// カードバトル（battle.js）に道具をわたす
window.PackBattle.init({ get S() { return S; }, save, hud, CARDS, ELEMENTS, RAR, inspect, cardHTML, tone, chime, audio, sparkle, toast, esc });
$('battleBtn').addEventListener('click', () => { audio(); window.PackBattle.open(); });
})();
</script>
</body>
